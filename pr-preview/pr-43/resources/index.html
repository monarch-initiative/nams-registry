<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAMs Registry</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1d2430; --muted: #5b6575; --line: #e3e7ee;
    --row-hover: #f6f8fb; --detail-bg: #f9fafc; --accent: #2f5fb3;
    --chip-bg: #eef2f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --fg: #e6e9ef; --muted: #9aa3b2; --line: #2a303a;
      --row-hover: #1b2028; --detail-bg: #181c23; --accent: #8fb3ff;
      --chip-bg: #232a35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .controls input, .controls select {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
  }
  .controls input { flex: 1 1 260px; }
  tr.filters th { padding-top: 0; font-weight: 400; }
  button.sort {
    font: inherit; color: inherit; background: none; border: 0; padding: 0;
    cursor: pointer; white-space: nowrap;
  }
  button.sort .arrow { display: inline-block; width: 1em; color: var(--muted); }
  tr.filters select {
    font: inherit; font-size: 13px; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px;
    max-width: 100%;
  }
  .count { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  tr.summary { cursor: pointer; }
  tr.summary:hover { background: var(--row-hover); }
  .toggle {
    font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer;
    width: 24px; padding: 0; line-height: 1;
  }
  .toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .chev { display: inline-block; font-size: 1.35em; transition: transform .12s; }
  .name { font-weight: 600; }
  .col-check { text-align: center; }
  .check { font-weight: 700; }
  .clamp {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; max-width: 34ch;
  }
  .rid { color: var(--muted); font-size: 13px; }
  tr.detail td { background: var(--detail-bg); padding: 14px 16px 18px 44px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; }
  .chip {
    display: inline-block; background: var(--chip-bg); border-radius: 4px;
    padding: 1px 7px; margin: 0 4px 4px 0; font-size: 13px;
  }
  a { color: var(--accent); }
  ul.pubs { margin: 0; padding-left: 18px; }
  .none { color: var(--muted); }
  @media (max-width: 600px) {
    tr.detail td { padding-left: 16px; }
    dl { grid-template-columns: 1fr; }
    dt { margin-top: 6px; }
  }
</style>
</head>
<body>
<main>
  <h1>NAMs Registry</h1>
  <p class="subtitle">NAM and NAM-adjacent sources collected in support of a NAMs landscape analysis.</p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search names, ids, and descriptions" aria-label="Search">
  </div>
  <p class="count" id="count"></p>
  <div class="table-wrap">
  <table>
    <thead><tr><th></th><th class="col-text" aria-sort="none"><button class="sort" data-field="name">Name<span class="arrow" aria-hidden="true"></span></button></th><th class="col-text" aria-sort="none"><button class="sort" data-field="holds_nams">Holds NAMs<span class="arrow" aria-hidden="true"></span></button></th><th class="col-text" aria-sort="none"><button class="sort" data-field="priority">Priority<span class="arrow" aria-hidden="true"></span></button></th><th class="col-clamp" aria-sort="none"><button class="sort" data-field="dismech_integration">DisMech integration<span class="arrow" aria-hidden="true"></span></button></th><th class="col-check" aria-sort="none"><button class="sort" data-field="is_tox">is_tox<span class="arrow" aria-hidden="true"></span></button></th><th class="col-issue" aria-sort="none"><button class="sort" data-field="discussion_issue">GH Issue<span class="arrow" aria-hidden="true"></span></button></th></tr><tr class="filters" id="filters"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
</main>
<script>
const DATA = [{"id": "aop-db", "name": "AOP-DB", "description": "The Adverse Outcome Pathway Database (AOP-DB) is an EPA-developed integrative knowledgebase that connects chemicals and stressors to molecular initiating events, key events across biological organization levels, and adverse outcomes relevant to human health and ecological risk assessment. It harmonizes data from toxicology, high‑throughput screening, pathway, gene/protein, and phenotype resources to enable computational toxicology, mode-of-action analysis, and predictive risk prioritization.", "homepage_url": "https://www.epa.gov/healthresearch/adverse-outcome-pathway-database-aop-db", "resource_type": "Aggregator", "domain_areas": ["toxicology", "environment", "pathways", "adverse outcome pathways"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/4", "activity_status": "active", "license": {"id": "https://www.epa.gov/healthresearch/adverse-outcome-pathway-database-aop-db", "label": "EPA AOP-DB Use & Access"}, "publications": [{"id": "doi:10.1038/s41597-021-00962-3", "title": "The 2021 update of the EPA's adverse outcome pathway database", "authors": ["Mortensen HM", "Senn J", "Levey T", "Langley P", "Williams AJ"], "journal": "Scientific Data", "year": "2021", "doi": "10.1038/s41597-021-00962-3", "preferred": true}, {"id": "doi:10.1016/j.taap.2018.02.006", "title": "AOP-DB: A database resource for the exploration of Adverse Outcome Pathways through integrated association networks", "authors": ["Pittman ME", "Edwards SW", "Ives C", "Mortensen HM"], "journal": "Toxicology and Applied Pharmacology", "year": "2018", "doi": "10.1016/j.taap.2018.02.006"}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "aop-db", "source_url": "https://kghub.org/kg-registry/resource/aop-db/aop-db.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/aop-db.yaml"}, {"id": "aop-wiki", "name": "AOP-Wiki", "description": "The AOP-Wiki is the primary collaborative authoring and curation interface for the Adverse Outcome Pathway Knowledge Base (AOP-KB). It enables the community to develop, review, browse, and export Adverse Outcome Pathways (AOPs) linking molecular initiating events through key events to adverse outcomes relevant to human and ecological risk assessment. Structured exports (XML and tabular subsets) support computational toxicology, ontology mapping, and integration into predictive assessment workflows.", "homepage_url": "https://aopwiki.org/", "resource_type": "DataSource", "domain_areas": ["toxicology", "environment", "pathways", "adverse outcome pathways"], "holds_nams": "secondary", "relevance_note": "Its primary content is adverse outcome pathways: AOPs, Key Events, Key Event Relationships and stressors. It holds methods, including NAMs, in each Key Event's \"How it is Measured or Detected\" section (measurement_method in the aop-wiki-cli cache), which names the assays and methods used to measure the event. That section is free text written by contributors. It doesn't identify assays as records or link them to assay registries.", "curation_model": ["community"], "dismech_integration": "Tooling: the aop-wiki skill queries the AOP-Wiki XML export through aop-wiki-cli (github.com/gingin77/aop_wiki_cli), which downloads and parses the XML outside DisMech. The mie-ker-capture and ker-evidence-triage skills turn Key Events into verified causal edges and judge a KER's evidence. scripts/aop_dismech_crosswalk.py maps any AOP's Key Events onto pathograph nodes from the aop-wiki-cli cache; scripts/aop_parkinsonism_crosswalk.py is its predecessor for the five parkinsonian AOPs. Content: no disorder entry cites AOP-Wiki, since it isn't citable evidence and no schema slot can reference a Key Event (dismech#10272). Four modules were curated against AOP-Wiki and say so in their notes: cardiac_camp_pka_calcium_handling, neuroinflammation_glial_activation, nmda_receptor_hypofunction and xenobiotic_cardiac_channel_perturbation. Project pages AOP_EMOD_ALIGNMENT, TDAR_AOP, AOP_40_SKIN_SENSITIZATION and ESTROGEN_SIGNALLING compare AOPs with DisMech. Checked against dismech commit 1019485f6e8.", "supporting_scripts": [{"name": "aop-wiki-cli search-with-config methods_nams", "repository": "https://github.com/gingin77/aop_wiki_cli", "path": "src/aop_wiki_cli/configs/methods_nams.py", "command": "aop-wiki-cli --data-dir <dir> search-with-config methods_nams", "description": "Searches each Key Event's measurement_method text for 33 NAM and assay terms, such as organoid, ToxCast, air-liquid interface and ELISA."}], "priority": "medium", "priority_rationale": "As has been started in DisMech's AOP work, AOP-Wiki content is treated as a hypothesis for curation, not as evidence. That work found three problems with the evidence behind it. Most KERs have none: in the 2026-08-06 snapshot, 1,536 of 2,369 KERs (65%) hold only their endpoints and identifiers, with no evidence text or references (dismech#10454). A KER's weight-of-evidence grade doesn't show whether evidence is attached: some KERs are graded High while their evidence sections are empty. And references can be wrong: in AOP 552, 13 of 16 cited references have a DOI that leads to a different paper from the one named (dismech#10773). The methods can be extracted deterministically, but the list of methods is not where most of the value lies. The value is in how each method relates to the Key Event it measures, in the context of that event's AOPs, and in comparing those relationships against DisMech pathographs. That comparison could show which events DisMech already models as Pathograph nodes, and how they are measured.", "extraction_effort": "medium", "effort_rationale": "See the discussion in the priority rationale above for details on the challenges and considerations in extracting NAM-related measurement methods from the AOP-Wiki.", "expectations": "Based on prior queries and the structure of the AOP-Wiki, I expect to find \"old school\" methods (e.g., Western blot, ELISA assays), ToxCast assays, and possibly some air-liquid interface methods. I don't expect to find many organoid assays.", "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/5", "activity_status": "active", "license": {"id": "https://aopwiki.org/", "label": "Varies"}, "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "aop-wiki", "source_url": "https://kghub.org/kg-registry/resource/aop-wiki/aop-wiki.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/aop-wiki.yaml"}, {"id": "aopwiki-rdf", "name": "AOP-Wiki RDF", "description": "AOP-Wiki RDF is an RDF representation of the AOP-Wiki, the authoring interface of the Adverse Outcome Pathway Knowledge Base. The AOP-Wiki XML export is converted to RDF/Turtle every week using the AOP Ontology (aopo) together with Dublin Core, CHEMINF and NCIT, and is enriched with gene mappings (gene names in key events matched to HGNC symbols and resolved to Ensembl, NCBI Gene, UniProt and Protein Ontology identifiers through BridgeDb) and chemical cross-references. AOPs, key events, key event relationships, biological events, stressors and chemicals get identifiers.org URIs and are linked to ChEBI, GO, PATO, UBERON, CL, NCBITaxon and HGNC. The 2026.08.15 release has about 340,000 triples, covering 595 AOPs, 1,595 key events, 2,360 key event relationships, 754 stressors and 430 chemicals. The data is served from a public SPARQL endpoint with a SNORQL query interface on top of it. A grlc REST API built from the same curated query library, a second endpoint holding every quarterly AOP-Wiki snapshot since 2018 as named graphs, and a dashboard for version-over-version trends are also available.", "synonyms": ["AOPWikiRDF", "AOP-Wiki RDF Explorer"], "homepage_url": "https://aopwiki.rdf.bigcat-bioinformatics.org/", "repository": "https://github.com/marvinm2/AOPWikiRDF", "resource_type": "KnowledgeGraph", "domain_areas": ["toxicology", "environment", "pathways", "chemistry and biochemistry", "adverse outcome pathways"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/6", "activity_status": "active", "license": {"id": "https://creativecommons.org/licenses/by-sa/4.0/", "label": "CC BY-SA 4.0"}, "publications": [{"id": "doi:10.1089/aivt.2021.0010", "title": "Providing Adverse Outcome Pathways from the AOP-Wiki in a Semantic Web Format to Increase Usability and Accessibility of the Content", "authors": ["Marvin Martens", "Chris T. Evelo", "Egon L. Willighagen"], "journal": "Applied In Vitro Toxicology", "year": "2022", "doi": "10.1089/aivt.2021.0010", "preferred": true}, {"id": "doi:10.5281/zenodo.13353286", "title": "Adverse Outcome Pathway Wiki RDF", "authors": ["Marvin Martens", "Egon Willighagen", "Chris Evelo"], "journal": "Zenodo", "year": "2026", "doi": "10.5281/zenodo.13353286"}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "aopwiki-rdf", "source_url": "https://kghub.org/kg-registry/resource/aopwiki-rdf/aopwiki-rdf.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/aopwiki-rdf.yaml"}, {"id": "biobricks-aopwiki", "name": "BioBricks AOP-Wiki", "description": "BioBricks AOP-Wiki is an open knowledge graph for Adverse Outcome Pathways from the AOP-Wiki.", "homepage_url": "https://github.com/biobricks-ai/aopwikirdf-kg", "repository": "https://github.com/biobricks-ai/aopwikirdf-kg", "resource_type": "KnowledgeGraph", "domain_areas": ["toxicology", "adverse outcome pathways"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/7", "activity_status": "active", "license": {"id": "https://aopwiki.org/", "label": "Varies"}, "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "biobricks-aopwiki", "source_url": "https://kghub.org/kg-registry/resource/biobricks-aopwiki/biobricks-aopwiki.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/biobricks-aopwiki.yaml"}, {"id": "biobricks-ice", "name": "BioBricks ICE", "description": "BioBricks ICE (Integrated Chemical Environment) is an open knowledge graph for cheminformatics and chemical safety data from EPA's CompTox database.", "homepage_url": "https://github.com/biobricks-ai/biobricks-okg", "repository": "https://github.com/biobricks-ai/biobricks-okg", "resource_type": "KnowledgeGraph", "domain_areas": ["chemistry and biochemistry", "toxicology", "cheminformatics"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/8", "activity_status": "active", "license": {"id": "https://opensource.org/licenses/MIT", "label": "MIT License"}, "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "biobricks-ice", "source_url": "https://kghub.org/kg-registry/resource/biobricks-ice/biobricks-ice.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/biobricks-ice.yaml"}, {"id": "biobricks-tox21", "name": "BioBricks Tox21", "description": "BioBricks Tox21 is an open knowledge graph for Tox21 toxicology screening data.", "homepage_url": "https://github.com/biobricks-ai/biobricks-okg", "repository": "https://github.com/biobricks-ai/biobricks-okg", "resource_type": "KnowledgeGraph", "domain_areas": ["toxicology", "drug discovery", "high-throughput screening"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/9", "activity_status": "active", "license": {"id": "https://www.usa.gov/government-works", "label": "U.S. Government Work (public domain)"}, "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "biobricks-tox21", "source_url": "https://kghub.org/kg-registry/resource/biobricks-tox21/biobricks-tox21.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/biobricks-tox21.yaml"}, {"id": "biobricks-toxcast", "name": "BioBricks ToxCast", "description": "BioBricks ToxCast is an open knowledge graph for EPA ToxCast high-throughput screening data.", "homepage_url": "https://github.com/biobricks-ai/biobricks-okg", "repository": "https://github.com/biobricks-ai/biobricks-okg", "resource_type": "KnowledgeGraph", "domain_areas": ["toxicology", "drug discovery", "high-throughput screening"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/3", "activity_status": "active", "license": {"id": "https://www.epa.gov/privacy/privacy-and-security-notice", "label": "EPA Data Usage & Privacy Notice (public domain / open government data)"}, "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "biobricks-toxcast", "source_url": "https://kghub.org/kg-registry/resource/biobricks-toxcast/biobricks-toxcast.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/biobricks-toxcast.yaml"}, {"id": "camera", "name": "CAMERA (Collection of Alternative Methods for Regulatory Application)", "description": "CAMERA (Collection of Alternative Methods for Regulatory Application) is a public, interactive NIH database and web interface that consolidates validated and qualified New Approach Methods (NAMs) for chemical safety testing into a single resource. It brings together validation study reports, data, protocols and SOPs, and regulatory guidance that were previously scattered across multiple agencies and organizations, and lets users filter by alternative method type, defined approach, test method endpoint, and regulatory guidance. CAMERA additionally uses standardized ontology vocabulary and large language models to identify validated NAMs that can measure the key events (KEs) of OECD-endorsed adverse outcome pathways (AOPs), linking methods to AOP-Wiki content to support next generation risk assessment. It currently holds 67 validated NAMs. CAMERA is supported by NICEATM and operates under the direction and oversight of the Interagency Coordinating Committee on the Validation of Alternative Methods (ICCVAM).", "synonyms": ["Collection of Alternative Methods for Regulatory Application"], "homepage_url": "https://camera.od.nih.gov/", "resource_type": "Aggregator", "domain_areas": ["toxicology", "adverse outcome pathways", "chemistry and biochemistry", "environment"], "holds_nams": "primary", "priority": "medium", "priority_rationale": "Moved to medium priority; NAMs Network is now the only high-priority resource.", "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/10", "activity_status": "active", "license": {"id": "https://www.usa.gov/government-works", "label": "U.S. Government Work (public domain)"}, "publications": [{"id": "doi:10.6084/m9.figshare.34809921.v1", "title": "CAMERA and AOP-Wiki: Building a NAMs Database with Integrated AOP Features to Support Next Generation Risk Assessment", "authors": ["Alexander Cole", "Katie Needham", "Prince Osei-Akyeampong", "Tosho Agunloye", "Jeremiah Mensah", "Caleb DeGroote", "Helena T. Hogberg"], "journal": "figshare", "year": "2026", "doi": "10.6084/m9.figshare.34809921.v1", "preferred": true}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "camera", "source_url": "https://kghub.org/kg-registry/resource/camera/camera.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/camera.yaml"}, {"id": "complement-arie-landscape-analysis", "name": "Complement-ARIE Landscape Analysis Report", "synonyms": ["Landscape Analysis Report 2024: New Approach Methodologies in Biomedical Research", "Complement-ARIE Landscape Analysis"], "description": "A landscape analysis of new approach methodologies (NAMs) in biomedical research, carried out for the NIH Common Fund Complement Animal Research In Experimentation (Complement-ARIE) program by NICEATM, Inotiv (ILS) and ICF and dated 29 February 2024. It surveys in vitro, in silico and in chemico approaches. PubMed, Web of Science and Scopus searches (October 2023) were screened with clustering and active machine learning down to 2,938 relevant papers, mostly published 2023. Claude v2 then answered 19 questions about each of the 2,735 papers whose full text it could process. The questions cover the method, its validation and limitations, the tissues, cell types and diseases examined, and its regulatory, ethical, economic and workforce aspects. The report classifies the papers with a keyword list of NAM categories under four model types: in vitro, in silico, in chemico and general methods (Appendix E). It summarizes coverage and gaps for each model type. It also scores 28 of 260 identified biomedical databases with a 29-question FAIR rubric (Appendices G and H), and it closes with recommendations. The per-paper answers and the reference list are published in the companion Tableau dashboard (complement-arie-landscape-dashboard), not in the report.", "homepage_url": "https://commonfund.nih.gov/complementarie/strategicplanning/landscape-analysis", "resource_type": "Report", "domain_areas": ["biomedical", "cell biology", "machine learning", "chemistry and biochemistry"], "holds_nams": "secondary", "relevance_note": "The report is about NAMs, but it holds them only as prose, figures and counts. It does not list them as records. Its structured content is the NAM keyword classification (Appendix E), the generative-AI prompts (Appendix F) and the FAIR scores of 28 databases (Appendix G). The papers and their per-paper answers are in the companion dashboard.", "curation_model": ["maintainers", "automated"], "dismech_integration": "Tooling: none for the report itself. DisMech has a parser for the companion dashboard's data download (see complement-arie-landscape-dashboard), and docs/reports/complement-arie-landscape-analysis-2026-10-30.md says the PDF was not read for that work. Content: none incorporated into kb/. The Complement-ARIE mention in kb/disorders/Rheumatoid_Arthritis.yaml comes from the separate Challenge prize winners, not this report. Checked against dismech commit 4bce5b015a9.", "priority": "medium", "priority_rationale": "It is best looked at together with its dashboard (complement-arie-landscape-dashboard): some understanding of the analysis may help decide the most effective strategy for using the two. Its NAM classification (Appendix E) and its 19 questions offer a ready-made scheme for sorting NAMs in this registry and in DisMech. Its FAIR review names 28 biomedical databases, any of which could be checked for this registry. It is also the methods record for the dashboard: it explains how the papers were chosen and how the answers were generated, which is needed to judge how far the dashboard's answers can be trusted.", "extraction_effort": "medium", "effort_rationale": "The report itself is medium effort to extract from, as it is a PDF with structured appendices. The companion dashboard's data download is handled separately and is not part of this extraction effort.", "expectations": "This report is expected to provide a structured overview of NIH's baseline assessment of NAMs from 2024. The breakdown and prompts used might inform some of the classification schemes we may also adopt in this registry.", "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/36", "activity_status": "active", "publications": [{"id": "https://commonfund.nih.gov/sites/commonfund/files/Complement-ARIE-Landscape-Analysis-29-Feb-2024-508.pdf", "title": "Landscape Analysis Report 2024: New Approach Methodologies in Biomedical Research", "year": "2024", "preferred": true}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "is_tox": false, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/complement-arie-landscape-analysis.yaml"}, {"id": "complement-arie-landscape-dashboard", "name": "Complement-ARIE Landscape Analysis Tableau Public Dashboard", "synonyms": ["Complement-ARIE Landscape Analysis dashboard"], "description": "The interactive Tableau Public dashboard of the NIH Common Fund Complement-ARIE Landscape Analysis, which publishes that report's paper-level results. It has three tabs. \"Explore Questions\" shows the generative-AI (Claude v2) answers to 19 questions for each paper. \"Explore Categories\" shows the papers by NAM keyword category (in vitro, in silico, in chemico, general methods). \"Reference List\" gives each paper's bibliographic details, and it is the report's Appendix D. The \"Q&A-Question Details\" data download from Explore Questions has 30,241 rows, one per paper and question, covering 3,051 citation keys. 2,737 of those keys trace to a single paper with answers, and most of those papers have a PMID or a DOI. The answers are summaries that point a reader to a paper; they are not evidence in themselves. First published 18 December 2023; last republished 8 May 2024 (workbook revision 1.9).", "homepage_url": "https://public.tableau.com/app/profile/complement.arie/viz/Complement-ARIELandscapeAnalysis_17029296896540/ExploreQuestions", "resource_type": "Report", "domain_areas": ["biomedical", "cell biology", "machine learning", "chemistry and biochemistry"], "holds_nams": "secondary", "relevance_note": "Each record is a paper about a NAM, with free-text answers describing the method, tissues, cell types, diseases, validation and limitations. The NAMs themselves are not named or identified as records. Turning them into structured records needs parsing, entity matching (for example to MONDO, CL and UBERON) and a check against each paper.", "curation_model": ["maintainers", "automated"], "dismech_integration": "Tooling: `just complement-arie-parse` (scripts/complement_arie_landscape.py, tested in tests/test_complement_arie_landscape.py) parses the \"Q&A-Question Details\" download into papers.tsv, answers.jsonl and questions.tsv. The download is about 128 MB and is not committed. It is pinned by sha256 in data/complement-arie/MANIFEST.yaml (downloaded 2026-10-30). The parser and its handling of the download's edge cases are described in docs/reports/complement-arie-landscape-analysis-2026-10-30.md, added in dismech PR #16039. Content: none incorporated into kb/. The report lists candidate uses: disease-to-model leads, cell and tissue annotation, model limitations and validation. Checked against dismech commit 4bce5b015a9.", "priority": "medium", "priority_rationale": "It is best looked at together with the report (complement-arie-landscape-analysis): some understanding of the analysis may help decide the most effective strategy for using the dashboard. It is the only machine-readable form of the Landscape Analysis: about 2,700 NAM papers, nearly all with a PMID or DOI, each described in the same 19-question form. DisMech can already parse it. Its 1,572 disease answers and its tissue and cell-type answers are leads to experimental models for DisMech entries. Each lead still needs the paper itself checked, since the answers were model-generated.", "extraction_effort": "medium", "effort_rationale": "The dashboard's data download is medium effort to extract from, as it is a large TSV/JSONL dataset that needs parsing and handling of edge cases. The parser scripts and tests facilitate this process, but it still requires careful processing to ensure accurate extraction of NAM-related information.", "expectations": "This literature in this dashboard has already been selected and processed for the Complement-ARIE Landscape Analysis. It is expected to provide structured answers to the 19 questions for each NAM paper, which can guide the extraction and organization of NAM-related information for further use in the registry.", "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/37", "activity_status": "active", "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "is_tox": false, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/complement-arie-landscape-dashboard.yaml"}, {"id": "comptox-dashboard", "name": "CompTox Chemicals Dashboard", "description": "The CompTox Chemicals Dashboard (formerly the Chemistry Dashboard) is a US Environmental Protection Agency (EPA) web application that integrates chemistry, toxicity, and exposure information for over one million chemicals, with over 300 chemical lists based on structure or category. Built on the DSSTox chemical database, it brings together physicochemical properties, environmental fate and transport, exposure and use data, in vivo hazard data (ToxValDB, ToxRefDB), in vitro bioactivity from the ToxCast and Tox21 high-throughput screening programs (invitrodb), and high-throughput toxicokinetic (HTTK) ADME/IVIVE predictions. Its data and models support chemical prioritization and efforts to reduce animal use in chemical testing through new approach methodologies (NAMs).", "synonyms": ["CompTox Chemistry Dashboard"], "homepage_url": "https://comptox.epa.gov/dashboard", "resource_type": "Aggregator", "domain_areas": ["chemistry and biochemistry", "cheminformatics", "toxicology", "environment", "environmental exposure", "drug discovery", "high-throughput screening", "public health"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/11", "activity_status": "active", "license": {"label": "U.S. Government Work (public domain)"}, "publications": [{"id": "https://doi.org/10.1186/s13321-017-0247-6", "title": "The CompTox Chemistry Dashboard: a community data resource for environmental chemistry", "authors": ["Antony J. Williams", "Christopher M. Grulke", "Jeff Edwards", "Andrew D. McEachran", "Kamel Mansouri", "Nancy C. Baker", "Grace Patlewicz", "Imran Shah", "John F. Wambaugh", "Richard S. Judson", "Ann M. Richard"], "journal": "Journal of Cheminformatics", "year": "2017", "doi": "10.1186/s13321-017-0247-6", "preferred": true}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "comptox-dashboard", "source_url": "https://kghub.org/kg-registry/resource/comptox-dashboard/comptox-dashboard.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/comptox-dashboard.yaml"}, {"id": "db-alm", "name": "DB-ALM (EURL ECVAM DataBase service on ALternative Methods to animal experimentation)", "description": "The EURL ECVAM DataBase service on ALternative Methods to animal experimentation (DB-ALM) is a collection of method summaries and standardised protocols for alternative methods in toxicology and biomedical science, maintained by the EU Reference Laboratory for Alternatives to Animal Testing (EURL ECVAM) at the European Commission Joint Research Centre (JRC). It covers methods submitted to EURL ECVAM for validation and methods identified through literature reviews and end users. The former interactive online database has been replaced by a versioned open dataset published through the JRC Data Catalogue, with a browsable static index of documents and a complete downloadable archive.", "synonyms": ["DB-ALM", "DBALM"], "homepage_url": "https://data.jrc.ec.europa.eu/dataset/b7597ada-148d-4560-9079-ab0a5539cad3", "resource_type": "DataSource", "domain_areas": ["toxicology", "biomedical"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/12", "activity_status": "active", "license": {"id": "https://creativecommons.org/licenses/by/4.0/", "label": "CC BY 4.0"}, "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "db-alm", "source_url": "https://kghub.org/kg-registry/resource/db-alm/db-alm.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/db-alm.yaml"}, {"id": "dsstoxdb", "name": "Distributed Structure-Searchable Toxicity (DSSTox) Database", "description": "EPA's Distributed Structure-Searchable Toxicity (DSSTox) database provides high-quality chemical and chemistry data underpinning several publicly available computational toxicology applications. DSSTox contains curated chemical substances mapped to chemical identifiers including CAS Registry Numbers, IUPAC names, SMILES, and InChIKeys. The database currently exceeds 1.2 million substances which includes chemical lists of interest to EPA, other federal agencies, states, tribes, industry and stakeholder groups. DSSTox provides accurate linkages of chemical structures to source substance identifiers, allowing high-quality association of chemicals to existing toxicity data, bioactivity data, experimental chemical property data and enabling structure-based predictive modeling. The database supports the CompTox Chemicals Dashboard, EcoTox Knowledgebase, Chemical Exposure Knowledgebase, and other EPA tools.", "homepage_url": "https://www.epa.gov/comptox-tools/distributed-structure-searchable-toxicity-dsstox-database", "resource_type": "DataSource", "domain_areas": ["toxicology", "chemistry and biochemistry", "environment", "biomedical"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/13", "activity_status": "active", "license": {"id": "https://creativecommons.org/publicdomain/zero/1.0/", "label": "CC0"}, "publications": [{"id": "https://pubmed.ncbi.nlm.nih.gov/33426407", "title": "EPA's DSSTox database: History of development of a curated chemistry resource supporting computational toxicology research", "authors": ["Grulke CM", "Williams AJ", "Thillanadarajah I", "Richard AM"], "journal": "Comput Toxicol", "year": "2019", "doi": "10.1016/j.comtox.2019.100096", "preferred": true}, {"id": "doi:10.1186/s13321-017-0247-6", "title": "The CompTox Chemistry Dashboard: a community data resource for environmental chemistry", "authors": ["Williams AJ", "Grulke CM", "Edwards J", "McEachran AD", "Mansouri K", "Baker NC", "Patlewicz G", "Shah I", "Wambaugh JF", "Judson RS", "Richard AM"], "journal": "Journal of Cheminformatics", "year": "2017", "doi": "10.1186/s13321-017-0247-6"}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "dsstoxdb", "source_url": "https://kghub.org/kg-registry/resource/dsstoxdb/dsstoxdb.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/dsstoxdb.yaml"}, {"id": "echemportal", "name": "eChemPortal (The Global Portal to Information on Chemical Substances)", "description": "eChemPortal (The Global Portal to Information on Chemical Substances) is a free public portal run by the Organisation for Economic Co-operation and Development (OECD), developed in collaboration with the European Chemicals Agency (ECHA), that provides simultaneous search across chemical hazard and risk information prepared for government chemical programmes at national, regional, and international levels. It covers existing and new industrial chemicals, pesticides, and biocides, and supports search by substance name or number, by chemical property and endpoint data (structured according to the OECD Harmonised Templates), and by GHS or national hazard classification, linking to about 34 participating data sources.", "synonyms": ["eChemPortal", "Global Portal to Information on Chemical Substances"], "homepage_url": "https://www.echemportal.org/", "resource_type": "Aggregator", "domain_areas": ["toxicology", "chemistry and biochemistry", "environment", "public health"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/14", "activity_status": "active", "license": {"id": "https://www.echemportal.org/echemportal/page/12", "label": "eChemPortal Disclaimer (data remain subject to the terms of each participating source)"}, "publications": [{"id": "https://doi.org/10.1016/B978-0-12-824315-2.01159-3", "title": "eChemPortal - The Global Portal to Information on Chemical Substances", "authors": ["Sally de Marcellus"], "journal": "Encyclopedia of Toxicology", "year": "2024", "doi": "10.1016/B978-0-12-824315-2.01159-3", "preferred": true}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "echemportal", "source_url": "https://kghub.org/kg-registry/resource/echemportal/echemportal.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/echemportal.yaml"}, {"id": "hsci", "name": "Harvard Stem Cell Institute (HSCI)", "description": "The Harvard Stem Cell Institute (HSCI) is a research network of stem cell scientists at Harvard University and its affiliated hospitals. It was founded in 2004 by Doug Melton and David Scadden. Its research is organized into disease programs and cross-cutting themes, such as fibrosis and aging. It runs shared core facilities for its members, including an iPS Core Facility for deriving and distributing induced pluripotent stem cell lines, a Center for Stem Cell Bioinformatics that pairs the Harvard Chan Bioinformatics Core with the Stem Cell Commons data platform, and a Center for Human Cell Therapy. The research page describes these programs and the work done in them.", "synonyms": ["HSCI"], "homepage_url": "https://www.hsci.harvard.edu/research", "resource_type": "Organization", "domain_areas": ["cell biology", "biomedical"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/45", "activity_status": "active", "creation_date": "2026-11-07", "last_modified_date": "2026-11-07", "is_tox": false, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/hsci.yaml"}, {"id": "httk", "name": "httk (High-Throughput Toxicokinetics)", "description": "High-Throughput Toxicokinetics (httk) is a US EPA R package that provides free, open-source data and models for toxicokinetics (TK). It pairs chemical-specific in vitro measurements and in silico predictions, available for thousands of chemicals, multiple exposure routes, and several species, with generic physiologically based (PBTK) and empirical TK models. The package supports traditional dosimetry and in vitro to in vivo extrapolation (IVIVE), including reverse dosimetry that converts high-throughput screening concentrations (e.g., from ToxCast and Tox21) into equivalent real-world exposures.", "homepage_url": "https://CRAN.R-project.org/package=httk", "repository": "https://github.com/USEPA/CompTox-ExpoCast-httk", "resource_type": "DataSource", "domain_areas": ["toxicology", "pharmacology", "chemistry and biochemistry", "environmental exposure", "environment", "software", "information technology"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/17", "activity_status": "active", "license": {"id": "https://opensource.org/licenses/MIT", "label": "MIT"}, "publications": [{"id": "https://doi.org/10.18637/jss.v079.i04", "title": "httk: R Package for High-Throughput Toxicokinetics", "authors": ["Robert G. Pearce", "R. Woodrow Setzer", "Cory L. Strope", "John F. Wambaugh", "Nisha S. Sipes"], "journal": "Journal of Statistical Software", "year": "2017", "doi": "10.18637/jss.v079.i04", "preferred": true}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "httk", "source_url": "https://kghub.org/kg-registry/resource/httk/httk.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/httk.yaml"}, {"id": "hipsci", "name": "Human Induced Pluripotent Stem Cells Initiative (HipSci)", "description": "The Human Induced Pluripotent Stem Cells Initiative (HipSci) generated a large, systematically characterised reference panel of human induced pluripotent stem cell (iPSC) lines from hundreds of phenotypically healthy donors and from cohorts of donors with inherited rare diseases, using a standardised derivation pipeline. Each line is profiled with assays including genotyping arrays, expression arrays, methylation arrays, RNA-seq, exome sequencing, proteomics mass spectrometry and high-content cellular phenotyping, with whole-genome sequencing for a subset. The data are deposited in EMBL-EBI archives (ENA, EGA, ArrayExpress and PRIDE), and the cell lines are available from the ECACC and EBiSC cell banks. The project was funded by the Wellcome Trust and the Medical Research Council, with partners including the Wellcome Sanger Institute, EMBL-EBI, King's College London, the University of Dundee, the University of Cambridge and UCL.", "homepage_url": "https://www.hipsci.org/", "resource_type": "DataSource", "domain_areas": ["cell biology", "biological systems", "genomics", "genetic variation", "gene expression profiling", "epigenomics", "proteomics", "rare disease", "biomedical"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/15", "activity_status": "active", "license": {"id": "https://www.hipsci.org/", "label": "Open access for the open-access healthy volunteer cohort; managed access through EGA for other data (no single license stated)"}, "publications": [{"id": "https://doi.org/10.1093/nar/gkw928", "title": "The human-induced pluripotent stem cell initiative-data resources for cellular genetics", "authors": ["Ian Streeter", "Peter W. Harrison", "Adam Faulconbridge", "The HipSci Consortium", "Paul Flicek", "Helen Parkinson", "Laura Clarke"], "journal": "Nucleic Acids Research", "year": "2017", "doi": "10.1093/nar/gkw928", "preferred": true}, {"id": "https://doi.org/10.1038/nature22403", "title": "Common genetic variation drives molecular heterogeneity in human iPSCs", "authors": ["Helena Kilpinen", "Angela Goncalves", "Andreas Leha", "Vackar Afzal", "Kaur Alasoo", "Sofie Ashford", "Sendu Bala", "Dalila Bensaddek", "Francesco Paolo Casale", "Oliver J. Culley", "Petr Danecek", "Adam Faulconbridge", "Peter W. Harrison", "Annie Kathuria", "Davis McCarthy", "Shane A. McCarthy", "Ruta Meleckyte", "Yasin Memari", "Nathalie Moens", "Filipa Soares", "Alice Mann", "Ian Streeter", "Chukwuma A. Agu", "Alex Alderton", "Rachel Nelson", "Sarah Harper", "Minal Patel", "Alistair White", "Sharad R. Patel", "Laura Clarke", "Reena Halai", "Christopher M. Kirton", "Anja Kolb-Kokocinski", "Philip Beales", "Ewan Birney", "Davide Danovi", "Angus I. Lamond", "Willem H. Ouwehand", "Ludovic Vallier", "Fiona M. Watt", "Richard Durbin", "Oliver Stegle", "Daniel J. Gaffney"], "journal": "Nature", "year": "2017", "doi": "10.1038/nature22403"}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "hipsci", "source_url": "https://kghub.org/kg-registry/resource/hipsci/hipsci.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": false, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/hipsci.yaml"}, {"id": "hpscreg", "name": "Human Pluripotent Stem Cell Registry (hPSCreg)", "description": "The Human Pluripotent Stem Cell Registry (hPSCreg) is a global public registry and data portal for human embryonic stem cell (hESC) and human induced pluripotent stem cell (hiPSC) lines. Registered lines receive a standard name and unique identifier, and their records cover donor and derivation information, ethical provenance and consent, culture conditions, genetic and characterization data, and links to other databases such as BioSamples. Lines are checked by curators before release, and hPSCreg issues certificates of ethical provenance and pluripotency. The registry also holds research project registrations and a database of clinical studies that use hPSC-derived cells. It was founded with European Commission funding and is operated by the Fraunhofer Institute for Biomedical Engineering (IBMT).", "homepage_url": "https://hpscreg.eu/", "resource_type": "DataSource", "domain_areas": ["cell biology", "biological systems", "biomedical", "clinical trials", "clinical"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/16", "activity_status": "active", "license": {"id": "https://hpscreg.eu/terms", "label": "hPSCreg Terms of Use (German copyright law; reproduction outside copyright limits requires written consent)"}, "publications": [{"id": "https://doi.org/10.1093/nar/gkv963", "title": "hPSCreg--the human pluripotent stem cell registry", "authors": ["Stefanie Seltmann", "Fritz Lekschas", "Robert Müller", "Harald Stachelscheid", "Marie-Sophie Bittner", "Weiping Zhang", "Luam Kidane", "Anna Seriola", "Anna Veiga", "Glyn Stacey", "Andreas Kurtz"], "journal": "Nucleic Acids Research", "year": "2016", "doi": "10.1093/nar/gkv963", "preferred": true}, {"id": "https://doi.org/10.1111/cpr.13238", "title": "Human pluripotent stem cell registry: Operations, role and current directions", "authors": ["Andreas Kurtz", "Nancy Mah", "Ying Chen", "Antonie Fuhr", "Sabine Kobold", "Stefanie Seltmann", "Sabine C. Müller"], "journal": "Cell Proliferation", "year": "2022", "doi": "10.1111/cpr.13238"}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "hpscreg", "source_url": "https://kghub.org/kg-registry/resource/hpscreg/hpscreg.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": false, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/hpscreg.yaml"}, {"id": "jrc-qsar-model-database", "name": "JRC QSAR Model Database", "description": "The JRC QSAR Model Database is an inventory of (Q)SAR models submitted to the EU Reference Laboratory for Alternatives to Animal Testing (EURL ECVAM) at the European Commission Joint Research Centre (JRC), each documented in the harmonised QSAR Model Reporting Format (QMRF), which is structured according to the OECD (Q)SAR validation principles. It was intended to help identify valid (Q)SARs for regulatory use, particularly under REACH. The database is now a historical archive published as a static dataset in the JRC Data Catalogue; its most recent QMRF updates date from 2019.", "synonyms": ["QMRF Inventory", "JRC QSAR Model Database (QMRF Inventory)"], "homepage_url": "https://data.jrc.ec.europa.eu/dataset/e4ef8d13-d743-4524-a6eb-80e18b58cba4", "resource_type": "DataSource", "domain_areas": ["toxicology", "chemistry and biochemistry", "cheminformatics"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/18", "activity_status": "inactive", "license": {"id": "https://creativecommons.org/licenses/by/4.0/", "label": "CC BY 4.0"}, "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "jrc-qsar-model-database", "source_url": "https://kghub.org/kg-registry/resource/jrc-qsar-model-database/jrc-qsar-model-database.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/jrc-qsar-model-database.yaml"}, {"id": "mps-db", "name": "Microphysiology Systems Database", "description": "The Microphysiology Systems Database (MPS-Db) was a web-based database developed at the University of Pittsburgh Drug Discovery Institute and Department of Computational and Systems Biology for capturing, managing, analyzing and sharing experimental data from microphysiology systems, from static microplate models to multi-organ microfluidic organ-on-chip models. It linked these data to reference chemical, bioactivity, preclinical, clinical and post-marketing data from ChEMBL, PubChem, DrugBank, UniChem, OpenFDA and FAERS, and served as the data platform for the NCATS Tissue Chip Testing Center program. The Pitt-hosted MPS-Db is no longer available in its published form - its homepage now redirects to EveAnalytics, a login-only commercial successor platform operated under license from the University of Pittsburgh.", "synonyms": ["MPS-Db", "MPS Database", "BioSystics Analytics Platform", "BioSystics-AP"], "homepage_url": "https://mps.csb.pitt.edu/", "resource_type": "DataSource", "domain_areas": ["drug discovery", "toxicology", "pharmacology", "anatomy and development"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/19", "activity_status": "inactive", "license": {"id": "https://doi.org/10.1039/c9lc01047e", "label": "Custom (free for non-profit research use with citation; license required for for-profit use)"}, "publications": [{"id": "doi:10.1089/aivt.2016.0011", "title": "The Microphysiology Systems Database for Analyzing and Modeling Compound Interactions with Human and Animal Organ Models", "authors": ["Albert Gough", "Lawrence Vernetti", "Luke Bergenthal", "Tong Ying Shun", "D Lansing Taylor"], "journal": "Applied In Vitro Toxicology", "year": "2016", "doi": "10.1089/aivt.2016.0011"}, {"id": "doi:10.1039/c9lc01047e", "title": "Applications of the microphysiology systems database for experimental ADME-Tox and disease models", "authors": ["Mark Schurdak", "Lawrence Vernetti", "Luke Bergenthal", "Quinn K Wolter", "Tong Ying Shun", "Sandra Karcher", "D Lansing Taylor", "Albert Gough"], "journal": "Lab on a Chip", "year": "2020", "doi": "10.1039/c9lc01047e", "preferred": true}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "mps-db", "source_url": "https://kghub.org/kg-registry/resource/mps-db/mps-db.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/mps-db.yaml"}, {"id": "namsnetwork", "name": "NAMs Network", "description": "NAMs.network is the first database of regulatory-relevant New Approach Methodologies (NAMs) for assessing the safety of materials and chemicals. Given the ethical, economic, and time-related challenges associated with animal testing, as well as emerging bans on such methods in the EU, it is paramount to develop and validate alternative in silico, in chemico, in vitro, and ex vivo approaches. NAMs.network provides state-of-the-art knowledge on different NAMs for materials and chemical safety assessment.", "homepage_url": "https://nams.network/", "resource_type": "KnowledgeGraph", "domain_areas": ["toxicology", "chemistry and biochemistry"], "holds_nams": "primary", "relevance_note": "NAMs are its records. Its catalogue lists 542 NAMs: 374 in vitro, 131 in silico, 19 in chemico, 15 ex vivo and 3 in vitro/in silico. Each record gives a type, a toxicity endpoint, an organ, cell types and a development status: 335 under development, 121 under validation and 86 accepted for regulatory use. It also gives a guideline or strategy, and the EU regulations the NAM applies to. Filters link NAMs to substances, methods and biomarkers, and AOP-Wiki AOPs and Key Events. The catalogue is aimed at chemical and nanomaterial safety assessment: the most common endpoint is acute inhalation toxicity, and the most common organ is the lung (281 NAMs). The list and its filters are public through a JSON API at https://api.nams.network, which scripts/fetch_namsnetwork.py reads. A NAM's full record needs a logged-in account.", "curation_model": ["maintainers"], "dismech_integration": "None. DisMech has no tooling for it, and no DisMech content mentions it. Checked against dismech commit 1019485f6e8.", "supporting_scripts": [{"name": "fetch_namsnetwork.py", "repository": "https://github.com/monarch-initiative/nams-registry", "path": "scripts/fetch_namsnetwork.py", "command": "uv run python scripts/fetch_namsnetwork.py", "description": "Fetches the public NAM list and filter facets from the NAMs.network API, and rebuilds the links from NAMs to substances, methods and biomarkers, biological endpoints, and AOP-Wiki AOPs and Key Events."}], "priority": "high", "priority_rationale": "It is one of the few resources that hold NAMs as structured records, each with a type, an endpoint, an organ and a development status, and its list is public through an API. Its links to AOP-Wiki AOPs and Key Events connect it to the AOP-Wiki methods work (#5): in the 2026-11-06 fetch, 16 NAMs link to an AOP and 67 to a Key Event. Its scope is narrower than DisMech's. It covers toxicity endpoints for chemical and nanomaterial regulation, not disease, so its value to DisMech is mainly in the methods it describes.", "extraction_effort": "low", "effort_rationale": "The NAMs are structured records accessible through a public API, making extraction straightforward. Scripts like scripts/fetch_namsnetwork.py can automate the retrieval of the data.", "expectations": "I expect to find detailed information on various NAMs, including their type, toxicity endpoint, organ, cell types, development status, guidelines or strategies, and relevant EU regulations. The data should be well-structured and easily retrievable via the API.", "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/20", "activity_status": "active", "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "namsnetwork", "source_url": "https://kghub.org/kg-registry/resource/namsnetwork/namsnetwork.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/namsnetwork.yaml"}, {"id": "nice", "name": "NICE (NIH Integrated Chemical Environment)", "description": "NICE, the NIH Integrated Chemical Environment (formerly the Integrated Chemical Environment, ICE), is a public web resource developed by the NTP Interagency Center for the Evaluation of Alternative Toxicological Methods (NICEATM), part of the National Toxicology Program (NTP) at the National Institute of Environmental Health Sciences (NIEHS). It brings together curated chemical characterization and physicochemical data, curated in vitro and high-throughput screening (cHTS) assay data, and reference in vivo toxicity datasets, together with computational tools and workflows (including in vitro to in vivo extrapolation, a dose-response Curve Surfer, and physiologically based pharmacokinetic modeling). NICE integrates data from established sources, including ToxCast and Tox21 high-throughput screening data, chemical identity and property data from the EPA CompTox Chemicals Dashboard and DSSTox, and OPERA-predicted physicochemical and ADME properties. It is designed to help scientists develop, evaluate, and apply new approach methodologies (NAMs) for chemical hazard characterization and next generation risk assessment.", "synonyms": ["ICE", "Integrated Chemical Environment", "NIH Integrated Chemical Environment"], "homepage_url": "https://ice.ntp.niehs.nih.gov/", "resource_type": "Aggregator", "domain_areas": ["chemistry and biochemistry", "toxicology", "cheminformatics", "biomedical", "environment", "environmental exposure"], "holds_nams": "primary", "relevance_note": "NICE exists to develop and evaluate NAMs, and NAM records make up most of its 19 data sets. These include in vitro and in chemico results for skin sensitization, skin irritation and corrosion, eye irritation, endocrine activity and genotoxicity; ToxCast and Tox21 high-throughput screening data; and in silico predictions from OPERA, CATMoS, CERAPP, CoMPARA, the AR and ER pathway models, and SEEM3. In vivo and human reference data, such as the LLNA, Draize, rat acute toxicity, cancer bioassay and DART guideline studies, are held alongside them so the NAMs can be evaluated against them.", "curation_model": ["maintainers", "aggregated"], "dismech_integration": "No NICE content has been extracted into DisMech, and DisMech has no tooling for it. The Contact Dermatitis entry records the SARA-ICE model, which was trained on data drawn from NICE. Checked against dismech commit ecaad77e5e9.", "priority": "medium", "priority_rationale": "NICE adds nine reference data sets that NICEATM curates, which pair NAM results with in vivo or human reference data, and its own curation and annotation of the ToxCast and Tox21 data. Most of its content by volume is copied unchanged from resources that have their own entries, such as OPERA and httk.", "expectations": "The content found only in NICE is the reference data NICEATM curates: sensitization, skin irritation and corrosion, eye irritation, endocrine, acute oral, dermal and inhalation toxicity, cancer, and DART. Each pairs NAM results, where there are any, with in vivo or human reference data. NICE also adds its own curation to the ToxCast and Tox21 data (hit-call flags, and annotations of each assay's mechanistic target and mode of action mapped to OBO ontologies), and shows CATMoS, CERAPP and CoMPARA predictions. Its OPERA predictions and measured httk ADME values are copied unchanged, so get those from the opera and httk entries. The data sets are listed at https://ice.ntp.niehs.nih.gov/DATASETDESCRIPTION, where most can be downloaded as spreadsheets. All but the chemical use and taxonomy data sets can be queried through the REST API at https://ice.ntp.niehs.nih.gov/api/v1/search.", "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/21", "activity_status": "active", "license": {"label": "U.S. Government Work (public domain)"}, "publications": [{"id": "https://doi.org/10.1016/j.tiv.2020.104916", "title": "An integrated chemical environment with tools for chemical safety testing", "authors": ["Shannon Bell", "Jaleh Abedini", "Patricia Ceger", "Xiaoqing Chang", "Bethany Cook", "Agnes L. Karmaus", "Isabel Lea", "Kamel Mansouri", "Jason Phillips", "Eric McAfee", "Ruhi Rai", "John Rooney", "Catherine Sprankle", "Arpit Tandon", "David Allen", "Warren Casey", "Nicole Kleinstreuer"], "journal": "Toxicology in Vitro", "year": "2020", "doi": "10.1016/j.tiv.2020.104916", "preferred": true}, {"id": "https://doi.org/10.3389/ftox.2022.987848", "title": "Data curation to support toxicity assessments using the Integrated Chemical Environment", "authors": ["Amber B. Daniel", "Neepa Choksi", "Jaleh Abedini", "Shannon Bell", "Patricia Ceger", "Bethany Cook", "Agnes L. Karmaus", "John Rooney", "Kimberly T. To", "David Allen", "Nicole Kleinstreuer"], "journal": "Frontiers in Toxicology", "year": "2022", "doi": "10.3389/ftox.2022.987848"}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-06", "imported_from": [{"source": "kg_registry", "source_id": "nice", "source_url": "https://kghub.org/kg-registry/resource/nice/nice.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/nice.yaml"}, {"id": "oecd-qsar-toolbox", "name": "OECD QSAR Toolbox", "description": "The OECD QSAR Toolbox is a free software application, owned by the Organisation for Economic Co-operation and Development (OECD) and the European Chemicals Agency (ECHA) and developed by the Laboratory of Mathematical Chemistry (LMC, Bourgas, Bulgaria), that supports transparent and reproducible chemical hazard assessment. It bundles about 63 databases with experimental data for more than 140,000 chemical structures, together with profilers, metabolism simulators, and QSAR models, to find structurally and mechanistically defined analogues, build and assess chemical categories, and fill data gaps by read-across and trend analysis as an alternative to animal testing.", "synonyms": ["QSAR Toolbox", "(Q)SAR Application Toolbox"], "homepage_url": "https://qsartoolbox.org/", "resource_type": "Aggregator", "domain_areas": ["toxicology", "chemistry and biochemistry", "cheminformatics", "environment"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/22", "activity_status": "active", "license": {"id": "https://qsartoolbox.org/license-agreement/", "label": "OECD QSAR Toolbox End User Licence Agreement (free of charge)"}, "publications": [{"id": "https://doi.org/10.1080/1062936X.2015.1136680", "title": "QSAR Toolbox - workflow and major functionalities", "authors": ["S. D. Dimitrov", "R. Diderich", "T. Sobanski", "T. S. Pavlov", "G. V. Chankov", "A. S. Chapkanov", "Y. H. Karakolev", "S. G. Temelkov", "R. A. Vasilev", "K. D. Gerova", "C. D. Kuseva", "N. D. Todorova", "A. M. Mehmed", "M. Rasenberg", "O. G. Mekenyan"], "journal": "SAR and QSAR in Environmental Research", "year": "2016", "doi": "10.1080/1062936X.2015.1136680", "preferred": true}, {"id": "https://doi.org/10.1007/978-1-4939-7899-1_2", "title": "The OECD QSAR Toolbox Starts Its Second Decade", "authors": ["Terry W. Schultz", "Robert Diderich", "Chanita D. Kuseva", "Ovanes G. Mekenyan"], "journal": "Methods in Molecular Biology", "year": "2018", "doi": "10.1007/978-1-4939-7899-1_2"}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "oecd-qsar-toolbox", "source_url": "https://kghub.org/kg-registry/resource/oecd-qsar-toolbox/oecd-qsar-toolbox.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/oecd-qsar-toolbox.yaml"}, {"id": "open-systems-pharmacology", "name": "Open Systems Pharmacology (OSP)", "description": "Open Systems Pharmacology (OSP) is an open-source, community-governed platform for physiologically based pharmacokinetic (PBPK) and quantitative systems pharmacology (QSP) modeling. Its OSP Suite comprises PK-Sim, for whole-body PBPK modeling, and MoBi, for multiscale physiological modeling and model extension, along with the ospsuite R package and reporting tools. The project also maintains the OSP PBPK Model Library, a set of released PBPK models for individual compounds, including small-molecule drugs and antibodies, each with an evaluation report and a PK-Sim project file, and qualification documents for the suite. The OSP management team includes members from pharmaceutical companies and academic and service organizations.", "homepage_url": "https://www.open-systems-pharmacology.org/", "resource_type": "DataSource", "domain_areas": ["pharmacology", "drug interactions", "biomedical", "software", "information technology"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/23", "activity_status": "active", "license": {"id": "https://github.com/Open-Systems-Pharmacology/Suite/blob/master/LICENSE", "label": "GPL-2.0 with clarifying addendum"}, "publications": [{"id": "https://doi.org/10.1002/psp4.12473", "title": "Open Systems Pharmacology Community-An Open Access, Open Source, Open Science Approach to Modeling and Simulation in Pharmaceutical Sciences", "authors": ["Jörg Lippert", "Rolf Burghaus", "Andrea Edginton", "Sebastian Frechen", "Mats Karlsson", "Andreas Kovar", "Thorsten Lehr", "Peter Milligan", "Valerie Nock", "Sergej Ramusovic", "Matthew Riggs", "Stephan Schaller", "Jan Schlender", "Stephan Schmidt", "Michaël Sevestre", "Erik Sjögren", "Juri Solodenko", "Alexander Staab", "Donato Teutonico"], "journal": "CPT: Pharmacometrics & Systems Pharmacology", "year": "2019", "doi": "10.1002/psp4.12473", "preferred": true}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "open-systems-pharmacology", "source_url": "https://kghub.org/kg-registry/resource/open-systems-pharmacology/open-systems-pharmacology.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": false, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/open-systems-pharmacology.yaml"}, {"id": "open-tggates", "name": "Open TG-GATEs", "description": "Open TG-GATEs is the public release of the toxicogenomics database built by the Japanese Toxicogenomics Project (TGP, 2002-2007) and Toxicogenomics Informatics Project (TGP2, 2007-2012), collaborations of the National Institute of Biomedical Innovation, the National Institute of Health Sciences and Japanese pharmaceutical companies. It covers 170 compounds, with Affymetrix microarray gene expression data (CEL files) from rat liver and kidney in vivo (single and repeated dosing) and from rat and human primary hepatocytes in vitro, linked to pathology, hematology, blood biochemistry, organ and body weight, and cell viability data. The original site is offline; the data were last updated in 2012 and are preserved in the NBDC LSDB Archive and in ArrayExpress.", "synonyms": ["TG-GATEs", "Toxicogenomics Project-Genomics Assisted Toxicity Evaluation System"], "homepage_url": "https://dbarchive.biosciencedbc.jp/en/open-tggates/desc.html", "resource_type": "DataSource", "domain_areas": ["toxicology", "pharmacology", "genomics", "gene expression profiling"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/24", "activity_status": "inactive", "license": {"id": "https://creativecommons.org/licenses/by-sa/2.1/jp/", "label": "CC BY-SA 2.1 JP"}, "publications": [{"id": "doi:10.1093/nar/gku955", "title": "Open TG-GATEs: a large-scale toxicogenomics database", "authors": ["Yoshinobu Igarashi", "Noriyuki Nakatsu", "Tomoya Yamashita", "Atsushi Ono", "Yasuo Ohno", "Tetsuro Urushidani", "Hiroshi Yamada"], "journal": "Nucleic Acids Research", "year": "2015", "doi": "10.1093/nar/gku955", "preferred": true}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "open-tggates", "source_url": "https://kghub.org/kg-registry/resource/open-tggates/open-tggates.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/open-tggates.yaml"}, {"id": "opera", "name": "OPERA (OPEn structure-activity/property Relationship App)", "description": "OPERA (OPEn structure-activity/property Relationship App) is a free and open-source, open-data suite of QSAR models that predicts physicochemical properties, environmental fate, ADME/toxicokinetic parameters and toxicity endpoints for chemicals, together with an applicability domain and accuracy assessment for each prediction. Endpoints include logP, logD, pKa, water solubility, melting and boiling point, vapor pressure, Henry's law constant, bioconcentration factor, biodegradation, soil adsorption (Koc), hepatic intrinsic clearance, plasma fraction unbound, Caco-2 permeability, estrogen and androgen receptor activity (CERAPP and CoMPARA consensus models) and acute oral systemic toxicity (CATMoS). The models were built following OECD principles for QSAR validation and are developed through a collaboration between NIEHS NICEATM and the U.S. EPA. OPERA runs as a command-line or graphical application for Windows and Linux, and its predictions are also served through the EPA CompTox Chemicals Dashboard and the NICEATM Integrated Chemical Environment (ICE).", "homepage_url": "https://github.com/NIEHS/OPERA", "resource_type": "DataSource", "domain_areas": ["cheminformatics", "chemistry and biochemistry", "toxicology", "pharmacology", "environment", "machine learning", "information technology"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/25", "activity_status": "active", "license": {"id": "https://opensource.org/licenses/MIT", "label": "MIT License"}, "publications": [{"id": "https://doi.org/10.1186/s13321-018-0263-1", "title": "OPERA models for predicting physicochemical properties and environmental fate endpoints", "authors": ["Kamel Mansouri", "Chris M. Grulke", "Richard S. Judson", "Antony J. Williams"], "journal": "Journal of Cheminformatics", "year": "2018", "doi": "10.1186/s13321-018-0263-1", "preferred": true}, {"id": "https://doi.org/10.1186/s13321-024-00814-3", "title": "Free and open-source QSAR-ready workflow for automated standardization of chemical structures in support of QSAR modeling", "authors": ["Kamel Mansouri", "José T. Moreira-Filho", "Charles N. Lowe", "Nathaniel Charest", "Todd Martin", "Valery Tkachenko", "Richard Judson", "Mike Conway", "Nicole C. Kleinstreuer", "Antony J. Williams"], "journal": "Journal of Cheminformatics", "year": "2024", "doi": "10.1186/s13321-024-00814-3"}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "opera", "source_url": "https://kghub.org/kg-registry/resource/opera/opera.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://github.com/monarch-initiative/nams-registry/blob/main/resources/opera.yaml"}, {"id": "organoiddb", "name": "OrganoidDB", "description": "OrganoidDB is a database of curated bulk and single-cell transcriptome profiles of organoids. It holds 16,218 organoid samples (12,911 human and 3,307 mouse) collected from GEO and ArrayExpress and organized into 1,069 datasets, 145 of them single-cell RNA-seq. Primary tissue and cell line samples are included so that organoids can be compared against them, with GTEx and the Human Protein Atlas linked as references. The web interface supports gene expression search across organoid types, culture sources and protocols, sample types and developmental stages, plus correlation analysis, and datasets can be browsed with culture details, differentially expressed genes, enriched pathways and single-cell clusters. It is run by the Intelligent Bioinformatics Research Group at the Institute of Life Sciences, Chongqing Medical University.", "homepage_url": "http://www.inbirg.com/organoid_db/", "resource_type": "DataSource", "domain_areas": ["biomedical", "genomics", "gene expression profiling", "biological systems", "single-cell analysis", "anatomy and development"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/26", "activity_status": "active", "license": {"id": "http://www.inbirg.com/organoid_db/", "label": "Copyright Intelligent Bioinformatics Research Group, Chongqing Medical University (all rights reserved)"}, "publications": [{"id": "https://pubmed.ncbi.nlm.nih.gov/36271792/", "title": "OrganoidDB: a comprehensive organoid database for the multi-perspective exploration of bulk and single-cell transcriptomic profiles of organoids", "authors": ["Qinfeng Ma", "Haodong Tao", "Qiang Li", "Zhaoyu Zhai", "Xuelu Zhang", "Zhewei Lin", "Ni Kuang", "Jianbo Pan"], "journal": "Nucleic Acids Res", "year": "2023", "doi": "10.1093/nar/gkac942", "preferred": true}], "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"so }, {"id": "toxbai", "name": "ToxBAI", "description": "ToxBAI is a desktop application for predicting the toxicity of chemicals with mechanistically explainable AI organized around the adverse outcome pathway (AOP) framework. From a chemical structure (CAS number or SMILES), it computes molecular descriptors and fingerprints and performs Active/Inactive binary classification across toxicity endpoints, reporting a confidence level, performance metrics (F1, recall, AUC), training dataset size, and an applicability-domain reliability flag for each prediction. It offers two families of models — apical-outcome (AO) prediction models trained on OECD Test Guideline data that map to regulatory endpoints, and mechanism prediction models trained on ToxCast high-throughput bioactivity data that correspond to molecular initiating events and key events; predicted MIEs and KEs are mapped to AOP networks in the OECD AOP-Wiki for mechanistic interpretation. ToxBAI is developed by the Environmental Systems Toxicology group at the University of Seoul and operated by ChemBAI, in collaboration with RTI International. It supports pre-screening of untested chemicals under the Next Generation Risk Assessment (NGRA) framework.", "homepage_url": "http://toxbai.com/", "resource_type": "DataSource", "domain_areas": ["toxicology", "adverse outcome pathways", "cheminformatics", "machine learning", "information technology", "chemistry and biochemistry"], "discussion_issue": "https://github.com/monarch-initiative/nams-registry/issues/30", "activity_status": "active", "license": {"id": "http://toxbai.com/", "label": "Custom (free to use; requires Google sign-in and in-app terms acceptance)"}, "creation_date": "2026-11-05", "last_modified_date": "2026-11-05", "imported_from": [{"source": "kg_registry", "source_id": "toxbai", "source_url": "https://kghub.org/kg-registry/resource/toxbai/toxbai.html", "source_version": "006717b63", "imported_on": "2026-11-05"}], "is_tox": true, "record_url": "https://g
