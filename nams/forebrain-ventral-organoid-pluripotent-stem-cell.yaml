    title: Generation and assembly of human brain region–specific three-dimensional cultures
    authors:
    - Steven A. Sloan
    - Jimena Andersen
    - Anca M. Pașca
    - Fikri Birey
    - Sergiu P. Pașca
    journal: Nature Protocols
    year: 2018
synonyms:
- ventral forebrain organoids
- VFO
species:
- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: Studying inhibitory (GABAergic) interneurons in a 3D system, including their specification
    from medial ganglionic eminence-like progenitors.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-ventral-forebrain-organoid-differentiation-kit.html
- description: Fusing with dorsal forebrain organoids to make assembloids for interneuron migration and
    circuit integration (see the assembloid entry). GFP-labelled ventral organoids allow migrating interneurons
    to be traced by live imaging.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-ventral-forebrain-organoid-differentiation-kit.html
  - https://www.stemcell.com/how-to-generate-assembloids-from-hpsc-derived-dorsal-and-ventral-forebrain-organoid-co-cultures.html
  supporting_references:
  - doi:10.1038/nature22330
- description: scRNA-seq characterization of ventral cell populations; day-50 data can be explored in
    STEMCELL's single-cell visualization tool for neural organoids.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-ventral-forebrain-organoid-differentiation-kit.html
  - https://www.stemcell.com/single-cell-characterization-of-dorsal-and-ventral-forebrain-organoid-models.html
- description: Longitudinal disease-phenotype studies, using reproducible morphology between lines and
    organoids.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-ventral-forebrain-organoid-differentiation-kit.html
limitations:
- description: Represents early developing (fetal) ventral subpallium. Somatostatin-positive interneurons
    are rare at day 50 and appear only by day 75, so interneuron subtype studies need long cultures.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-ventral-forebrain-organoid-differentiation-kit.html
- description: Day 50 ventral forebrain organoids showed no network bursting on MEA over 4 weeks, unlike
    dorsal forebrain organoids, so they are less suited to network-activity readouts on their own.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-ventral-forebrain-organoid-differentiation-kit.html
- description: Patterning restricts fate to one region; interactions with other regions need assembloids.
    Achieving adult-like maturation remains unsolved for neural organoids.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/neural-organoids/overview.html
- description: Lacks vasculature and immune cells (microglia must be added by co-culture).
  source_urls:
  - https://www.stemcell.com/improving-drug-discovery-with-organoids.html
