model:
  id: forebrain-ventral-organoid-pluripotent-stem-cell
  type: Organoid
  name: Ventral forebrain organoids from human pluripotent stem cells
  description: Guided, brain-region-specific organoids representing the early developing human ventral
    forebrain, used to study inhibitory interneurons. NKX2.1 is high by day 25; somatostatin-positive
    GABAergic interneurons are rare at day 50 and observable by day 75. Organoids are of similar size
    across 11 cell lines.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0000204
    name: ventral part of telencephalon
  cell_types:
  - id: CL:0011020
    name: neural progenitor cell
  - id: CL:0011005
    name: GABAergic interneuron
  cell_source: pluripotent stem cells
  differentiation_method: Directed differentiation with timed small-molecule patterning, adapted from
    Pasca's protocols (Birey et al. 2017). hPSCs form embryoid bodies in AggreWell800 over 6 days, then
    grow in suspension and are patterned to the early developing ventral subpallium (FOXG1+, NKX2.1+,
    medial ganglionic eminence and GABAergic markers).
  culture_system: Matrix-free, serum-free suspension culture with fusion-free media. Organoids are generated
    in 43 days; 200 or more consistently sized organoids per kit with AggreWell800. Culture beyond 50
    days uses the STEMdiff Neural Organoid Maintenance Kit.
  references:
  - id: doi:10.1038/nature22330
    title: Assembly of functionally integrated human forebrain spheroids
    authors:
