model:
  id: stm-h9-secretome
  name: STM_H9_secretome
  description: STM_H9_secretome utilizes undifferentiated H9 cells to measure relative changes
    in two metabolites, ornithine (ORN) and cystine (CYSS) in the secretome, targeting a critical
    drop in the ORN/CYSS ratio as a biomarker for developmental toxicity.
