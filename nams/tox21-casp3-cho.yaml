model:
  id: tox21-casp3-cho
  name: TOX21_CASP3_CHO
  description: 'The TOX21_CASP3_CHO is a cell-based, single-readout assay that uses CHO-K1,
    a hamster ovary cell line, with measurements taken at 16 hours after chemical dosing on
    a microplate: 1536-well plate. To identify small molecule compounds that induce apoptosis,
    a homogeneous, luminescent Caspase-Glo 3/7 assay was used. Wild type CHO-K1 cells were
    used to screen Tox21 libraries for identifying caspase-3/7 activity inducers. Cytotoxicity
    of the compounds was tested in parallel by measuring the cell viability using CellTiter-Fluor
    assay system in the same wells. See tox21-casp3-cho-p1.'
