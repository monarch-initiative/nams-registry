  name: Homo sapiens
- id: NCBITaxon:10090
  name: Mus musculus
- id: NCBITaxon:10116
  name: Rattus norvegicus
applications:
- description: 'Functional drug transport and barrier assays: rhodamine 123 added to the surrounding medium
    accumulates in the lumen of duodenal and ileal organoids, and uptake is partially inhibited by 100
    uM of the P-glycoprotein inhibitor verapamil; FITC-dextran is used as a control. Uptake was greater
    and less diffuse than in organoids from first-generation expansion medium. Transporters beyond P-gp
    reported as examined include BCRP, MRP2, OAT and SLC family transporters.'
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: 'Drug metabolism: duodenal and ileal organoids robustly express CYP3A4; activity is induced
    by calcitriol or rifampicin and inhibited by ketoconazole, measured with the Promega P450-Glo CYP3A4
    assay.'
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
- description: Dose-dependent drug toxicity and viability screening across duodenum, ileum and colon organoids
    from multiple donors (CellTiter-Glo 3D), reproducible enough to detect donor-specific differences
    in drug response such as those seen with gefitinib.
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
- description: 'Cystic fibrosis disease modeling and modulator response: healthy ileal and colonic organoids
    swell on 10 uM forskolin, organoids from a CF donor carrying the F508 deletion are non-responsive,
    and Trikafta treatment partially restores forskolin-induced swelling.'
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
- description: Expansion of Wnt-independent colorectal cancer organoids, including organoids from subcutaneous
    PDX tumors, using IntestiCult Plus Basal Medium alone.
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: 'Extension of adult-tissue organoid culture to rat: lines were established from duodenum,
    jejunum, ileum, proximal and distal colon of Sprague Dawley rats, which the page states previously
    published and first-generation IntestiCult formulations had been unable to establish and passage.'
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
limitations:
- description: Not recommended for organoid-derived monolayer establishment or for hPSC-derived organoids;
    the recommended route for monolayers is IntestiCult Organoid Differentiation Medium.
  source_urls:
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: Not suitable for mouse monolayer workflows because its serum-free formulation does not
    support the cell adhesion mouse cells need; the first-generation serum-containing human expansion
    medium is recommended instead.
  source_urls:
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: Does not currently support gastric organoids or cancerous tissue from other GI regions
    such as pancreas; STEMCELL states gastric organoids need different conditions.
  source_urls:
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: Supports hPSC/ESC-derived colon organoids but with fibroblast overgrowth problems, since
    fibroblasts also grow well in this medium; the STEMdiff Intestinal Organoid Kit is recommended instead
    for ESC-derived systems.
  source_urls:
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: 'Induced rare cell types can destabilize the culture: M cells differentiate very fast with
    RANKL or TNF-alpha and can overtake the culture and reduce viability if not controlled; excessive
    DAPT dosing for goblet cell enrichment also affects viability.'
  source_urls:
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: Wnt-independent colorectal cancer organoids grown in IntestiCult Plus Basal Medium are
    dense and lack a defined single-cell columnar epithelium; MUC2 is present but without identifiable
    goblet cells or other specialized cell types.
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
- description: Not recommended for microphysiological system (MPS) platforms; first-generation expansion
    and differentiation media are recommended there because they support better cell adhesion.
  source_urls:
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: Research-use-only HUB licence restriction applies, excluding commercial drug screening,
    equipment validation and biobanking without a further licence.
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
