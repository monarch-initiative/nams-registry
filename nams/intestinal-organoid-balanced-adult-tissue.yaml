model:
  id: intestinal-organoid-balanced-adult-tissue
  type: Organoid
  name: Intestinal organoids with balanced stem and differentiated populations
  description: A next-generation adult-tissue intestinal organoid in which expansion and differentiation
    occur at the same time, giving organoids with complex budded, crypt-like morphology and subtle but
    consistent morphological differences between intestinal regions. Robust LGR5+ stem cell expansion
    is maintained alongside Paneth, enteroendocrine, enterochromaffin, goblet and tuft cells and more
    mature enterocyte lineages; single-cell RNA sequencing (NCBI GEO GSE308421) showed increased goblet
    and enteroendocrine lineages and more mature enterocytes versus first-generation expansion medium.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0000160
    name: intestine
  cell_types:
  - id: CL:0002250
    name: intestinal crypt stem cell
  - id: CL:0009010
    name: transit amplifying cell
  - id: CL:0000510
    name: paneth cell
  - id: CL:0000164
    name: enteroendocrine cell
  - id: CL:0000577
    name: type EC enteroendocrine cell
  - id: CL:0000160
    name: goblet cell
  - id: CL:0002204
    name: tuft cell
  - id: CL:0000682
    name: M cell of gut
  - id: CL:0000584
    name: enterocyte
  cell_source: adult tissue
  differentiation_method: 'Crypts, intestinal fragments or single LGR5+ cells from intestinal tissue are
    seeded in IntestiCult Plus Organoid Growth Medium (Cat #100-1677), a serum- and conditioned medium-free
    formulation that supports simultaneous expansion and differentiation in a single system; a two-phase
    schedule is used (2 days in "Start" medium at 5X supplement, then "Balance" medium at 1X supplement,
    typically 5 more days). The medium can be adapted Wnt-free for small intestinal differentiation or
    for Wnt-independent colorectal cancer organoids; rare cell types can be enriched with added factors
    (RANKL or TNF-alpha for M cells, DAPT/gamma-secretase inhibition for goblet cells, MEK plus gamma-secretase
    inhibition for enteroendocrine cells).'
  culture_system: '50 uL Matrigel domes, or 96-well and 24-well Organoid Culture Plates (Cat #200-0562
    / 200-0561), or 5% Matrigel dilute suspension; passaged when organoids are fully matured at 5-8 days.
    Reported split ratio 1:10 every 7 days, with consistent morphology and growth over 35 passages (245
    days).'
  references:
  - id: doi:10.1152/ajpcell.00108.2016
    title: TNF-α augments RANKL-dependent intestinal M cell differentiation in enteroid cultures
    authors:
    - Megan B. Wood
    - Daniel Rios
    - Ifor R. Williams
    journal: American Journal of Physiology-Cell Physiology
    year: 2016
