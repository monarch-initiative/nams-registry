model:
  id: acea-er
  name: ACEA_ER
  description: ACEA_ER is a cell-based, single-readout assay that uses T47D, a human breast
    cell line, with measurements taken at 80 hours after chemical dosing in a 96-well plate,
    although TO2 (mc0.srcf) used a 384-well plate. Differences in plate size can be ignored
    given data normalization.
