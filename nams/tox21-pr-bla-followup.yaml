model:
  id: tox21-pr-bla-followup
  name: TOX21_PR_BLA_Followup
  description: TOX21_PR_BLA_Followup is a secondary assay for specificity for the TOX21_PR_BLA_Agonist
    assay. To differentiate true PR agonists from cytotoxic substances, this follow up assay
    is multiplexed with a cell viability assay. The compounds were also tested for auto fluorescence
    that may interfere with the biological target readout resulting in potential false positives
    and/or negatives. To identify the compounds that stimulate PR signaling, a PR-UAS-bla
    GripTite cell line i.e. PR-UAS-bla HEK293T (Invitrogen, Carlsbad, CA, USA) containing
    a beta-lactamase reporter gene under the control of an UAS response element was used to
    screen Tox21 10K compound library. The cytotoxicity of the Tox21 compound library against
    the PR-bla cell line was tested in parallel by measuring the cell viability using CellTiter-Glo
    assay in the same wells.
  description_scope: METHOD
