model:
  id: ccte-glted-htbg
  name: CCTE_GLTED_hTBG
  description: CCTE_GLTED_hTBG is a cell-free, single-readout assay designed to test the chemicals'
    ability to displace T4 from the human thyroxine-binding globulin (TBG) protein. TBG is
    incubated in presence of test chemical for 2 hours during which disrupting chemicals displace
    ANSA from the TBG protein. Results read fluorescence at 380 excitation and 475 emission.
  description_scope: METHOD
