model:
  id: iuf-npc2-5
  name: IUF_NPC2-5
  description: IUF_NPC2-5 is a cell-based, multiplexed assay that uses hNPC, a human primary
    neural progenitor cells, with measurements taken at 72 or 120 hours after chemical dosing
    in a 96-well plate. Human neural progenitor cells (hNPC) are generated from human fetal
    brain cortex at gestational week (GW) 16-19. In the neural progenitor cell migration and
    differentiation assay (NPC2-5), hNPCs grown as spheres are plated on an extracellular
    matrix and migrate and differentiate out of the sphere core. The processes radial glia
    migration, neuronal and oligodendrocyte migration as well as neuronal differentiation,
    neuronal morphology and oligodendrocyte differentiation are studied using automated phase
    contrast imaging and automated fluorescence imaging in combination with high content image
    analysis. In parallel, the cell viability is assessed using an alamar blue viability assay
    and the cytotoxicity using a lactate dehydrogenase dependent membrane integrity assay.
  description_scope: METHOD
