model:
  id: ccte-glted-xdio3
  name: CCTE_GLTED_xDIO3
  description: CCTE_GLTED_xDIO3 is a cell-free, single-readout assay designed to test the
    inhibitory activity of chemicals toward Xenopus (frog) iodothyronine Deiodinase Type 3
    (DIO3) enzyme. Enzyme is incubated in presence of test chemical for 3 hours during which
    uninhibited enzyme liberates free iodide from substrate. Free iodide is measured in a
    second step using the Sandell-Kolthoff method.
  description_scope: METHOD
species:
- id: NCBITaxon:8355
  name: Xenopus laevis
measured_targets:
- name: dio3
  measurement: enzymatic activity
  notes: Entrez 100038242 is not an approved human gene in HGNC, so no HGNC id.
