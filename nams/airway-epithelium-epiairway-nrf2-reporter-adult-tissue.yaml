# A NAM found in a research paper (PMID:38614204), curated through DisMech but
# not represented in its graph: the reporter's readout (NRF2/ARE pathway
# activation) identified no mechanism node the DisMech screen could ground a
# model link to from the abstract alone. See dismech projects/NAMS_SPECIAL_ISSUE.md
# and dismech#16873 / dismech#17314.
model:
  id: airway-epithelium-epiairway-nrf2-reporter-adult-tissue
  type: TwoDCellCulture
  name: EpiAirway™ Nrf2 ARE-luciferase oxidative-stress reporter tissue
  description: >-
    MatTek EpiAirway™, a reconstructed pseudostratified human airway epithelium
    differentiated at the air-liquid interface from primary tracheobronchial
    cells, stably transfected with a lentiviral bioreporter in which the
    antioxidant response element (ARE) of the Nrf2 gene is fused to luciferase,
    so that NRF2/ARE transcriptional activity is read out as luminescence. Used
    to measure the oxidative-stress response of the airway epithelium to whole
    inhaled aerosols applied at the apical (air) surface; the reporter responds
    to cigarette whole smoke at sub-cytotoxic doses.
  cell_types:
  - id: CL:0002633
    name: respiratory basal cell
  - id: CL:0000067
    name: ciliated epithelial cell
  - id: CL:0002370
    name: respiratory tract goblet cell
  cell_source: adult tissue
  culture_conditions: >-
    Reconstructed human airway epithelium (MatTek EpiAirway™) at the air-liquid
    interface, stably transfected with a lentiviral ARE-Nrf2-luciferase
    reporter (EpiAirway™ Nrf2 tissue model, developed by MatTek). Whole aerosol
    is applied to the apical surface; luminescence is read as the oxidative-stress
    endpoint, with cobalt(II) chloride and tert-butylhydroquinone as positive
    controls.
  references:
  - id: doi:10.1016/j.tox.2024.153801
    title: In vitro toxicological evaluation of glo menthol and non-menthol heated tobacco products.
    authors:
    - Brian M. Keyser
    - Robert Leverette
    - Reagan McRae
    - John Wertman
    - Tom Shutsky
    - Kristen Jordan
    - Ken Szeliga
    - Patrudu Makena
    journal: Toxicology
    year: 2024
  - id: doi:10.3390/toxics12020129
    title: Evaluation of Cytotoxicity and Oxidative Stress of Whole Aerosol from Vuse Alto ENDS Products.
    authors:
    - Brian M. Keyser
    - Robert Leverette
    - John Wertman
    journal: Toxics
    year: 2024
species:
- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: >-
    Oxidative-stress testing of whole inhaled aerosols at the air-liquid
    interface, read as NRF2/ARE pathway activation. The reporter responds
    robustly to cigarette whole smoke at sub-cytotoxic doses; heated-tobacco-product
    aerosols elicited a response only at the highest dose tested.
  source_urls:
  - https://doi.org/10.1016/j.tox.2024.153801
  - https://doi.org/10.3390/toxics12020129
  supporting_references:
  - doi:10.1016/j.tox.2024.153801
  - doi:10.3390/toxics12020129
limitations:
- description: >-
    The endpoint is ARE-driven transcription read as luminescence, a proxy for
    NRF2 pathway activation rather than a measurement of a specific reactive
    oxygen species, of glutathione status, or of downstream tissue injury.
  supporting_references:
  - doi:10.3390/toxics12020129
- description: >-
    Epithelium only: the reconstructed tissue has no immune, stromal,
    endothelial or vascular compartment and no microbiome, so it does not
    capture oxidative stress arising from or amplified by those compartments.
- description: >-
    A single stably transfected reporter line; the oxidative-stress signal is
    whatever drives the ARE construct, and the construct is a fixed feature of
    the model rather than the native tissue.
