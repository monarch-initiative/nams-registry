species:
- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: Parkinson's disease modelling, recapitulating dopaminergic neuron vulnerability, alpha-synuclein
    pathology and mitochondrial dysfunction.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/neural-organoids/overview.html
  supporting_references:
  - doi:10.1038/s41531-024-00799-8
- description: Co-culture with hPSC-derived microglia to study microglia–neuron interactions and neuroinflammation
    in Parkinson's disease.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-midbrain-organoid-differentiation-kit.html
- description: 'Neurotoxicity and functional assays on MEA: day-125 organoids showed treatment-dependent
    activity changes after one hour of 4-aminopyridine or rotenone.'
  source_urls:
  - https://www.stemcell.com/products/human-ipsc-derived-midbrain-organoids.html
- description: Predictive assays and high-throughput phenotypic screening in long-term culture.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-midbrain-organoid-differentiation-kit.html
  - https://www.stemcell.com/products/human-ipsc-derived-midbrain-organoids.html
- description: Single-cell phenotyping of midbrain organoids by automated high-content imaging and single-cell
    flow cytometry, for Parkinson's disease and therapeutic discovery.
  source_urls:
  - https://www.stemcell.com/single-cell-phenotyping-of-neurons-and-midbrain-organoids.html
limitations:
- description: Represents the developing (fetal) midbrain; adult-like maturation remains unsolved for
    neural organoids, which matters for late-onset disease such as Parkinson's.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-midbrain-organoid-differentiation-kit.html
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/neural-organoids/overview.html
- description: Lacks vasculature, and microglia must be added by co-culture.
  source_urls:
  - https://www.stemcell.com/improving-drug-discovery-with-organoids.html
  - https://www.stemcell.com/products/stemdiff-midbrain-organoid-differentiation-kit.html
- description: 'The ready-made organoids carry licence terms: no clinical or therapeutic use, no commercialization,
    and no screening of compounds, antibodies, proteins or peptides except for target discovery, target
    validation or assay development.'
  source_urls:
  - https://www.stemcell.com/products/human-ipsc-derived-midbrain-organoids.html
- description: The ready-made organoids come from a single healthy-control iPSC line (SCTi003-A) and are
    shipped fresh, with delivery times that vary with supply.
  source_urls:
  - https://www.stemcell.com/products/human-ipsc-derived-midbrain-organoids.html
