model:
  id: midbrain-organoid-pluripotent-stem-cell
  type: Organoid
  name: Midbrain organoids from human pluripotent stem cells
  description: Guided organoids representing the developing human midbrain, used to study dopaminergic
    neurons. Organoids are uniform in size across cell lines and express tyrosine hydroxylase; GFAP rises
    by day 100.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0001891
    name: midbrain
  cell_types:
  - id: CL:0000700
    name: dopaminergic neuron
  - id: CL:0000127
    name: astrocyte
  cell_source: pluripotent stem cells
  differentiation_method: Directed differentiation adapted from Pasca's protocols. hPSCs form organoids
    in AggreWell800 over 6 days, then grow in suspension and are patterned to the midbrain (FOXA2, LMX1A,
    EN1 floor-plate markers by day 25; NURR1, TH, GIRK2, PITX3 dopaminergic markers by day 50).
  culture_system: Matrix-free, serum-free suspension culture; organoids generated in 43 days, 200 or more
    per kit with AggreWell800. Maintained beyond 50 days with the Neural Organoid Maintenance Kit. Also
    sold as fresh, pre-formed organoids from iPSC line SCTi003-A at day 42–49 or day 90–97.
  references:
  - id: doi:10.1016/j.stem.2016.07.005
    title: Midbrain-like Organoids from Human Pluripotent Stem Cells Contain Functional Dopaminergic and
      Neuromelanin-Producing Neurons
    authors:
