  id: tox21-p450-cyp3a4-antagonist
  name: TOX21_p450_CYP3A4_Antagonist
  description: TOX21_p450_CYP3A4_Antagonist is a cell-free assay that uses recombinant human
    p450 CYP3A4, isolated from insect cells infected with baculovirus containing human CYP3A4
    cDNA, as a source of enzyme to measure test chemical effects on enzymatic activity against
    a fluorescent substrate, P450-Glo CYP3A4. See tox21-p450-3a4-p1.
