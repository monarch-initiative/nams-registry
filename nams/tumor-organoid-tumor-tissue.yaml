model:
  id: tumor-organoid-tumor-tissue
  type: Organoid
  name: Patient-derived tumor organoids (general, pan-cancer)
  description: Organoid lines grown from patients' tumours and banked to make cancer models that reflect
    the disease more accurately than cell lines. The site presents them for predicting patient drug response
    (precision medicine), drug screening and immune co-culture.
  three_d_architecture: ORGANOID
  cell_types:
  - id: CL:0001064
    name: malignant cell
  cell_source: tumor tissue
  differentiation_method: Organoids derived from patient tumour biopsies or resections and expanded in
    tissue-specific organoid media; can be banked as living biobanks (e.g. HUB Biobank). Tissue-specific
    protocols belong to the organ groups.
  culture_system: Usually matrix-embedded domes; assay formats listed for organoids generally include
    dome-embedded, suspension, air-liquid interface, 96/384-well and organ-on-a-chip. About 4-6 weeks
    is considered sufficient to scale up enough organoids to screen for drug response.
  references:
