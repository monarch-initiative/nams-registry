model:
  id: intestinal-organoid-adult-tissue-human
  type: Organoid
  name: Human intestinal organoids from adult intestinal crypts (expansion-phase)
  description: 'Three-dimensional cultures of adult human intestinal epithelium in which a polarized epithelial
    layer encloses a functional lumen, with maturing organoids forming protruding buds resembling in vivo
    crypts. Organoids contain the known cell types of the adult intestinal epithelium with a self-propagating
    stem cell niche, intra- and intercellular signaling, and functional transport into and out of the
    lumen. Cultures can be established from patient biopsies, expanded long-term, cryopreserved as biobanks,
    genome-edited, and further differentiated in 3D or as 2D monolayers / ALI cultures with IntestiCult
    Organoid Differentiation Medium (Human, Cat #100-0214).'
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0000160
    name: intestine
  cell_types:
  - id: CL:0002250
    name: intestinal crypt stem cell
  - id: CL:0009010
    name: transit amplifying cell
  - id: CL:0000584
    name: enterocyte
  - id: CL:0000160
    name: goblet cell
  - id: CL:0000510
    name: paneth cell
  - id: CL:0000164
    name: enteroendocrine cell
  cell_source: adult tissue
  differentiation_method: 'Intestinal crypts (or sorted LGR5+ single stem cells) are isolated from fresh
    human colonic or small intestinal biopsies or surgical samples by mincing and incubation in Gentle
    Cell Dissociation Reagent, then filtered and embedded in extracellular matrix. The crypts self-organize
    into organoids in a complete medium (IntestiCult Organoid Growth Medium (Human), Cat #06010, or the
    serum- and conditioned medium-free IntestiCult-SF, Cat #100-0340) that mimics the crypt-base niche
    with EGF, Wnt/R-spondin agonism and BMP inhibition. The pages state organoids are generated from crypts
    in one week; primary cultures from biopsies that break into single cells need about 3 weeks.'
  culture_system: 50 uL domes of 50% Matrigel (Corning GFR, phenol red-free) in 24-well plates, submerged
    in complete medium, medium changed every 2-3 days, passaged by mechanical fragmentation every 6-12
    days (1000 fragments per dome gives 150-200 mature organoids). Growth is also supported in Geltrex
    and Cultrex Type 1 and Type 2 basement membrane extracts. Organoids are primarily cystic in IntestiCult
    OGM; figures show organoids from colonic biopsy fully mature after 10-14 days.
