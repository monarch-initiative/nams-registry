model:
  id: ukn5-hcs-sbad2
  name: UKN5_HCS_SBAD2
  description: 'UKN5_HCS_SBAD2 is a cell-based, multiplexed-readout assay screening for neurite
    outgrowth and cell viability that uses SBAD2 (peripheral neurons differentiated from iPSC),
    a human peripheral nervous system cell line, with measurements taken at 3 hours after
    chemical dosing in a microplate: 96-well plate. UKN5, also referred to as PeriTox, is
    an assay that uses human iPSC line SBAD2 as a model of peripheral neurons. Following 24
    hr chemical exposures in multi-well plates, neurite area is evaluated as a marker of neurite
    outgrowth using high-content imaging of cells stained with calcein-AM. Cell viability
    is assessed using stain Hoechst H-33342.'
