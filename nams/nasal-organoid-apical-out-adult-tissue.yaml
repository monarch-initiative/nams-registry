model:
  id: nasal-organoid-apical-out-adult-tissue
  type: Organoid
  name: Apical-out nasal organoids from primary human nasal epithelial cells
  description: An apical-out 3D model of the human nasal epithelium, the first respiratory surface exposed
    to inhaled pathogens. Day-28 organoids are dense structures with a clearly defined outer surface,
    beating cilia on the outward-facing apical side, KRT5+ basal cells, MUC5AC+ goblet cells and ZO-1
    at the apical surface; FOXJ1 and TUBB4B are upregulated relative to 2D HNECs. Because the apical membrane
    is on the outside, pathogens and compounds can be applied directly. The protocol is based on Stroulios
    et al. 2025.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0005384
    name: nasal cavity epithelium
  cell_types:
  - id: CL:0002633
    name: respiratory basal cell
  - id: CL:0000067
    name: ciliated epithelial cell
  - id: CL:0002370
    name: respiratory tract goblet cell
  cell_source: adult tissue
  differentiation_method: Primary human nasal epithelial cells (HNECs) are expanded in 2D at 37 C in PneumaCult-NGEx
    or PneumaCult-Ex Plus Medium, dissociated with the Animal Component-Free Cell Dissociation Kit, and
    360,000 cells are seeded per well of an AggreWell 400 24-well plate in complete PneumaCult Apical-Out
    Airway Organoid Medium (or Secretory Medium, added from day 6, to drive goblet cells). Aggregation
    and differentiation are carried out at 32.5 C with partial medium changes every 2 days; cells expanded
    in Ex Plus are dislodged and transferred to a pre-treated flat-bottom plate after 24 hours to 6 days,
    while NGEx-expanded cells stay in the AggreWell plate. Beating cilia appear by day 28.
  culture_system: 'Matrigel-free suspension: AggreWell 400 microwell plates and 24-well flat-bottom plates,
    both pre-treated with Anti-Adherence Rinsing Solution (centrifuged 1300 x g, 10 min), no inserts.
    Aggregation spin at 100 x g for 3 minutes; incubation at 32.5 C and 5% CO2. Assay-ready at day 28
    and stable for at least two further weeks.'
  references:
  - id: doi:10.1016/j.isci.2026.116638
    title: Generation of apical-out nasal organoids to facilitate human respiratory syncytial virus infection
      and drug screening
    authors:
    - Georgios Stroulios
    - Mathieu Hubert
    - Wing Chang
    - Allen Eaves
    - Sharon Louis
    - Philipp Kramer
    - Caroline Tapparel
    - Salvatore Simmini
    journal: iScience
    year: 2026
synonyms:
- apical-out nasal organoids
species:
- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: Modeling human respiratory syncytial virus infection of the nasal epithelium and screening
    antiviral drug responses, as described in the publication the protocol is based on.
  source_urls:
  - https://www.stemcell.com/how-to-generate-apical-out-nasal-organoids.html
  - https://www.stemcell.com/products/pneumacult-apical-out-airway-organoid-medium.html
  - https://www.stemcell.com/products/aggrewell400.html
  supporting_references:
  - doi:10.1016/j.isci.2026.116638
- description: Drug screening, infectious disease modeling and mucociliary function assays on an accessible
    apical surface.
  source_urls:
  - https://www.stemcell.com/how-to-generate-apical-out-nasal-organoids.html
- description: 'Studying goblet cell dynamics in the nasal epithelium: with the standard medium most organoids
    contain only 2 - 4 goblet cells (95.2% have at least one), while with the Secretory Medium 100% contain
    goblet cells, mostly 5 - 8 per organoid.'
  source_urls:
  - https://www.stemcell.com/how-to-generate-apical-out-nasal-organoids.html
- description: Host-pathogen interaction studies and personalized medicine, as a standardized and reproducible
    system.
  source_urls:
  - https://www.stemcell.com/products/aggrewell400.html
  supporting_references:
  - doi:10.1016/j.isci.2026.116638
limitations:
- description: 'Temperature-sensitive and not generated efficiently at body temperature: aggregating and
    differentiating HNECs at 37 C causes extensive cell shedding that reduces organoid generation efficiency,
    and both organoid numbers and ciliated-cell percentage are better at 32.5 C.'
  source_urls:
  - https://www.stemcell.com/how-to-generate-apical-out-nasal-organoids.html
- description: Requires per-donor optimization of the aggregation time, found by transferring aggregates
    daily until no fusion of aggregates is seen; large or fused aggregates otherwise form.
  source_urls:
  - https://www.stemcell.com/how-to-generate-apical-out-nasal-organoids.html
- description: 'Fragile to handling: washing steps must use room-temperature DMEM/F-12, since washing
    with D-PBS may be detrimental to organoid structure.'
  source_urls:
  - https://www.stemcell.com/how-to-generate-apical-out-nasal-organoids.html
- description: Goblet cell induction with the Secretory Medium/Supplement is recommended only for early-passage
    cells (up to passage 4).
  source_urls:
  - https://www.stemcell.com/how-to-generate-apical-out-nasal-organoids.html
- description: Slower than the bronchial apical-out model (day 28 versus day 15 to assay readiness) and,
    like it, epithelium only, with no immune, stromal or vascular component.
  source_urls:
  - https://www.stemcell.com/how-to-generate-apical-out-nasal-organoids.html
  - https://www.stemcell.com/products/pneumacult-apical-out-airway-organoid-medium.html
