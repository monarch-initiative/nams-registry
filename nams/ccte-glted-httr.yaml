model:
  id: ccte-glted-httr
  name: CCTE_GLTED_hTTR
  description: CCTE_GLTED_hTTR is a cell-free, single-readout assay designed to test the chemicals'
    ability to displace T4 from the human transthyretin (TTR) protein. TTR (at 0.125uM or
    0.5uM) is incubated in presence of test chemical for 2 hours during which disrupting chemicals
    displace ANSA from the TTR protein. Results read fluorescence at 380 excitation and 475
    emission.
  description_scope: METHOD
