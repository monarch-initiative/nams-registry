model:
  id: tox21-trb-bla-antagonist-followup
  name: TOX21_TRB_BLA_Antagonist_Followup
  description: The GeneBLAzer TRb-UAS-bla HEK293T assay kit for human TRb (ThermoFisherScientific
    Catalog No. K1684) was used as a secondary assay for specificity (TRb-bla).This assay
    contained the ligand-binding domain (LBD) of the human TRb fused to the DNA-binding domain
    of GAL4 stably integrated in the GeneBLAzer UAS-bla HEK293Tcell line. The reporter gene,
    b-lactamase, is under the transcriptional control of a UAS that binds the GAL4 DNA-binding
    domain. A cell viability assay was run in parallel for these cells as well using the CellTiter-Glo
    viability assay kit.
  description_scope: METHOD
