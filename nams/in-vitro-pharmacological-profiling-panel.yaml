model:
  id: in-vitro-pharmacological-profiling-panel
  name: In vitro pharmacological profiling panel for systemic toxicity safety
    assessment
  description: >-
    A fixed panel of receptors, enzymes, transporters, ion channels and nuclear
    receptors with known safety liabilities, screened in binding, enzymatic,
    coactivator-recruitment and luciferase assays, and used as the specific
    off-target arm of a NAM-based systemic toxicity toolbox alongside
    high-throughput transcriptomics and a cell stress panel. Forty-four of its
    targets were associated with in vivo adverse drug reactions by the
    pharmaceutical industry (Bowes et al. 2012); 19 more were added from a
    literature search to extend coverage into developmental toxicity. A point
    of departure is derived in two stages: every assay is first screened at one
    fixed concentration of 10 or 100 micromolar in two replicates, the
    concentration chosen from prior cytotoxicity measurements in HepG2, HepaRG
    and MCF7 cells; any target inhibited or stimulated by more than 50% is then
    followed up in concentration-response, giving an EC50 or IC50 and from it
    an IPP-specific point of departure. Because the assays are a mixture of
    cell-free biochemical measurements and cell-based reporter assays, no
    single NAMO class describes the platform, so the model carries no type.
    The paper's main text gives the panel as 63 targets; its supplementary
    sheet S3b, from which the target list below is taken, carries 76 assay
    wells over 64 distinct targets, 12 of them nuclear receptors run in both
    agonist and antagonist mode. Exactly 63 of the 64 resolve to HGNC genes,
    the exception being a rat tubulin preparation. The two counts are recorded
    as the paper and its supplement give them rather than reconciled.
  description_scope: METHOD
synonyms:
- IPP panel
- IPP platform
- in vitro pharmacological profiling
