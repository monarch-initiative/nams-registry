applications:
- description: >-
    Screening a chemical for activity at targets with known safety liabilities,
    as the specific off-target arm of a NAM-based systemic toxicity toolbox.
    Forty-four of the panel's targets were associated with in vivo adverse drug
    reactions by the pharmaceutical industry; 19 more were added to extend
    coverage into developmental toxicity.
  source_urls:
  - https://doi.org/10.1093/toxsci/kfae159
  supporting_references:
  - doi:10.1093/toxsci/kfae159
- description: >-
    Deriving a point of departure for a bioactivity:exposure ratio. Every assay
    is screened at a single fixed concentration of 10 or 100 micromolar in two
    replicates; a target inhibited or stimulated by more than 50% is followed
    up in concentration-response, and the resulting EC50 or IC50 gives the
    panel's point of departure.
  source_urls:
  - https://doi.org/10.1093/toxsci/kfae159
  supporting_references:
  - doi:10.1093/toxsci/kfae159
- description: >-
    Detecting a specific pharmacological mechanism that broader, non-specific
    platforms miss. Across 38 chemicals the panel gave the lowest point of
    departure for metoclopramide, cetirizine dihydrochloride and verapamil
    hydrochloride, where transcriptomic and cell stress points of departure sat
    above the predicted Cmax. For metoclopramide, a dopamine D2 antagonist, the
    panel's IC50 was 0.046 micromolar against a next-lowest point of departure
    of 16 micromolar from HepG2 transcriptomics.
  source_urls:
  - https://doi.org/10.1093/toxsci/kfae159
  supporting_references:
  - doi:10.1093/toxsci/kfae159
limitations:
- description: >-
    The assays have no metabolic capability, so a chemical that acts through a
    metabolite is missed even when its target is in the panel. Acetylcholinesterase
    is a panel target, but chlorpyrifos inhibits it only after conversion to
    chlorpyrifos-oxon, which the assay set-up cannot form.
  source_urls:
  - https://doi.org/10.1093/toxsci/kfae159
  supporting_references:
  - doi:10.1093/toxsci/kfae159
- description: >-
    A fixed target list covers only the modes of action it contains, and
    subunit-level specificity can defeat it. Topiramate acts as a GABA-receptor
    antagonist but was not detected, because the receptor subunit it is
    specific for is not in the panel. Hydralazine hydrochloride and
    glibenclamide act on ion movement through targets the panel does not hold,
    and warfarin's target, vitamin K epoxide reductase, is in neither the panel
    nor the wider toolbox.
  source_urls:
  - https://doi.org/10.1093/toxsci/kfae159
  supporting_references:
  - doi:10.1093/toxsci/kfae159
- description: >-
    Three targets carried by an earlier version of the panel were unavailable
    for this study. The mineralocorticoid receptor (NR3C2) and retinoic acid
    receptor gamma (RARG) assays are listed but returned no data; the aryl
    hydrocarbon receptor assay was dropped from the panel entirely, and AhR is
    instead an endpoint of the cell stress panel that runs beside it.
  source_urls:
  - https://doi.org/10.1093/toxsci/kfae159
  supporting_references:
  - doi:10.1093/toxsci/kfae159
- description: >-
    The first stage is a single fixed concentration in two replicates, so a
    target reaches concentration-response only by crossing a 50% response
    threshold at that one concentration.
  source_urls:
  - https://doi.org/10.1093/toxsci/kfae159
  supporting_references:
  - doi:10.1093/toxsci/kfae159
