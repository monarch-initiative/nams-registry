model:
  id: tox21-sbe-bla-antagonist
  name: TOX21_SBE_BLA_Antagonist
  description: 'The TOX21_SBE_BLA_Antagonist is a cell-based, single-readout assay that uses
    HEK293T , a human kidney cell line, with measurements taken at 5 hours after chemical
    dosing on a microplate: 1536-well plate. This cell line contains a beta-lactamase reporter
    gene under control of the Smad binding element (SBE) stably integrated into HEK 293T cells.
    Cytotoxicity of the compounds was tested in parallel by measuring the cell viability using
    CellTiter-Glo assay system in the same wells. See tox21-sbe-bla-antagonist-p1.'
