species:
- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: 'Measuring T cell-mediated killing of tumor organoids: organoid viability over time by
    CellTiter-Glo 3D, T cell viability by GloCell Fixable Viability Dye Red 780 and flow cytometry, apoptosis
    by Caspase-3/7 activity flow cytometry (with staurosporine as a positive control), and T cell activity
    by IFN-gamma ELISA at co-culture endpoint.'
  source_urls:
  - https://www.stemcell.com/co-culture-colorectal-organoids-and-t-cells.html
- description: Evaluating novel immuno-oncology therapeutics, patient-specific therapeutic evaluation
    and disease mechanisms; in the reported model TIL reactivity to CRC patient-derived organoids relies
    on endogenously processed and presented peptide rather than exogenous peptide loading.
  source_urls:
  - https://www.stemcell.com/co-culture-colorectal-organoids-and-t-cells.html
  supporting_references:
  - doi:10.1016/j.cell.2018.07.009
limitations:
- description: 'The central difficulty the model addresses is itself a limitation: optimal culture conditions
    exist separately for patient-derived organoids and for T cells, and identifying conditions that preserve
    viability and function of both cell types in the same medium remains a challenge.'
  source_urls:
  - https://www.stemcell.com/co-culture-colorectal-organoids-and-t-cells.html
- description: 'Medium composition changes the readout: 100% IntestiCult gave lower IFN-gamma secretion
    than the 50:50 blend, so results depend on the blend ratio chosen.'
  source_urls:
  - https://www.stemcell.com/co-culture-colorectal-organoids-and-t-cells.html
- description: 'Antigen specificity is undefined: the TIL reactivity in this model is described as undefined
    and most likely directed to neoantigens originating from somatic mutations in the tumor DNA.'
  source_urls:
  - https://www.stemcell.com/co-culture-colorectal-organoids-and-t-cells.html
- description: 'Only two cell compartments: the epithelial-immune co-culture does not address the stromal,
    microbiological and endothelial compartments, and the corpus notes that interaction between stromal,
    immunological, microbiological and epithelial compartments "cannot be addressed at this point and
    remains a major challenge to mimic in in vitro systems".'
  source_urls:
  - https://www.stemcell.com/organoid-profiles-maartje-van-der-heijden.html
  - https://www.stemcell.com/improving-drug-discovery-with-organoids.html
