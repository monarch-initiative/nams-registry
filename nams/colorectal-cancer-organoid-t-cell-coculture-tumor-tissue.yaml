model:
  id: colorectal-cancer-organoid-t-cell-coculture-tumor-tissue
  type: CoCulture
  name: Colorectal cancer organoid and T cell co-culture
  description: A co-culture model for immuno-oncology in which colorectal cancer patient-derived organoids
    and autologous or allogeneic T cells are maintained in a single blended medium. STEMCELL reports that
    the 50:50 blend of IntestiCult Organoid Growth Medium (Human) and ImmunoCult-XF T Cell Expansion Medium
    supported organoid viability without adverse impact on T cell viability and functionality, with the
    blend producing the highest Caspase-3/7 signal in co-culture (indicating T cell-mediated apoptosis
    of organoids) and high IFN-gamma secretion relative to 100% IntestiCult.
  models:
  - biological_system_modeled: UBERON:0012652
  cell_types:
  - id: CL:0001064
    name: malignant cell
  - id: CL:0000084
    name: T cell
  - id: CL:0000542
    name: lymphocyte
  cell_source: tumor tissue
  culture_conditions: Colorectal cancer patient-derived organoids are established and expanded as Wnt-independent
    tumoroids (IntestiCult OGM Human Basal Medium) and grown 1-2 days after passage; T cells are isolated
    from PBMCs or whole blood with EasySep/RosetteSep kits (or paired tumor-infiltrating lymphocytes are
    used) and grown 1-2 days in ImmunoCult-XF T Cell Expansion Medium. The two are combined in a 50:50
    blend of IntestiCult (complete or basal medium depending on whether organoids are cancer-derived)
    and ImmunoCult-XF, with 50 uL cold Matrigel per 950 uL of co-culture medium. 96-well plates, 100 uL
    per well containing 1700 organoids and 50,000 T cells in the 50:50 medium blend with 5% Matrigel;
    timepoints typically day 0, 3 and 5.
  references:
  - id: doi:10.1016/j.cell.2018.07.009
    title: Generation of Tumor-Reactive T Cells by Co-culture of Peripheral Blood Lymphocytes and Tumor
      Organoids
    authors:
