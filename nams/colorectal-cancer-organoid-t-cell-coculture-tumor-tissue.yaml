    journal: Cell
    year: 2018
  - id: doi:10.1038/s41575-019-0255-2
    title: Organoid models of gastrointestinal cancers in basic and translational research
    authors:
    - Harry Cheuk Hay Lau
    - Onno Kranenburg
    - Haipeng Xiao
    - Jun Yu
