model:
  id: tox21-pxr-luc-agonist
  name: TOX21_PXR_LUC_Agonist
  description: 'TOX21_PXR_LUC_Agonist is a cell-based, single-readout assay that uses HepG2,
    a human liver cell line, with measurements taken at 24 hours after chemical dosing on
    a microplate: 1536-well plate. To screen Tox21 libraries for compounds that activate hPXR-mediated
    CYP3A4 gene expression, PXR-Luc HepG2 cells were used. Cytotoxicity of the compounds was
    tested in parallel by measuring the cell viability using CellTiter-Fluor assay system
    in the same wells. See tox21-pxr-p1.'
