model:
  id: spinal-cord-organoid-pluripotent-stem-cell
  type: Organoid
  name: Spinal cord organoids from human pluripotent stem cells
  description: Guided organoids representing the developing human cervical spinal cord, used to study
    motor neurons. Day 30 organoids are electrically active on MEA.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0002726
    name: cervical spinal cord
  cell_types:
  - id: CL:0000100
    name: motor neuron
  - id: CL:0000127
    name: astrocyte
  - id: CL:0011020
    name: neural progenitor cell
  cell_source: pluripotent stem cells
  differentiation_method: Directed differentiation adapted from Pasca's protocols (Andersen 2020; Yoon
    2018). hPSCs form organoids in AggreWell800 over 6 days, then grow in suspension and are patterned
    to cervical spinal cord (OLIG2 motor neuron progenitors by day 19; ISL1, HB9, CHAT, FOXP1 motor neurons
    and CHX10 interneurons by day 30; GFAP astrocytes from day 75).
  culture_system: Matrix-free, serum-free suspension culture; organoids generated in 43 days, up to 300
    per kit with AggreWell800. Maintained beyond 50 days with the Neural Organoid Maintenance Kit.
  references:
