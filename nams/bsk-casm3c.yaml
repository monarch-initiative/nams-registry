  id: bsk-casm3c
  name: BSK_CASM3C
  description: BSK_CASM3C is a cell-based, multiplexed-readout assay that uses umbilical vein
    endothelium and coronary artery smooth muscle cells, a human vascular primary cell co-culture,
    with measurements taken at 24 hours after chemical dosing in a 96-well plate.
