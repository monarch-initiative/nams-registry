model:
  id: branching-lung-organoid-pluripotent-stem-cell
  type: Organoid
  name: Branching lung organoids from human pluripotent stem cells
  description: 'An hPSC-derived organoid that recapitulates airway branching morphogenesis and proximo-distal
    specification. Organoids develop proximal and distal-like branching airway epithelial structures expressing
    EPCAM, NKX2.1, SOX2, SOX9, MUC1 and P63, with pro-surfactant protein B- and C-expressing alveolar
    type II-like cells, luminal MUC1, and surrounding VIM-expressing mesenchyme. NKX2.1 and its surface
    surrogate CPM are maintained in long-term culture (day 67), and the cells are lung-specified: NKX2.1
    is expressed without the thyroid marker PAX8 or the forebrain marker FOXG1. With extended culture,
    maturity markers ABCA3, SFTPC and SFTPB increase.'
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0002048
    name: lung
  cell_types:
  - id: CL:0002368
    name: respiratory tract epithelial cell
  - id: CL:0008019
    name: mesenchymal cell
  cell_source: pluripotent stem cells
  differentiation_method: 'Human ES and iPS cells maintained in mTeSR1 or mTeSR Plus are taken through
    four stages: (1) definitive endoderm by day 3, (2) anterior foregut endoderm, with buds released from
    the monolayer during days 3 - 6, (3) suspension of those buds to form ventralized lung bud organoids,
    days 6 - 14, and (4) embedding of the lung bud organoids in a Matrigel sandwich to mature into branching
    lung organoids. Beyond 28 days in the Matrigel sandwich, the STEMdiff Branching Lung Organoid Maturation
    Kit is used for extended culture.'
  culture_system: Monolayer differentiation, then suspension culture of lung bud organoids, then a Matrigel
    sandwich for stage 4; serum-free throughout, with a cryopreservable intermediate stage. Branching
    tips keep growing and branching to day 101 and cultures have been assessed to day 105.
  references:
