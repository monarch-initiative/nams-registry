species:
- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: Modeling human lung development, specifically airway branching morphogenesis and proximal-distal
    patterning of the airway epithelium.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-branching-lung-organoid-kit.html
- description: Disease modeling and genome editing in a lung context (the kit lists genome editing as
    an application and is used with ES and multiple iPSC lines, including iPSCs derived from peripheral
    blood endothelial progenitor cells and from PBMCs).
  source_urls:
  - https://www.stemcell.com/products/stemdiff-branching-lung-organoid-kit.html
  - https://www.stemcell.com/products/stemdiff-branching-lung-organoid-maturation-kit.html
- description: Respiratory infectious disease modeling, supported by expression of the SARS-CoV-2 entry
    proteins ACE2 and TMPRSS2 at day 63.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-branching-lung-organoid-kit.html
- description: Drug discovery and toxicity testing, and transplantation research, listed as the kit's
    areas of interest.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-branching-lung-organoid-kit.html
- description: Patient-specific modeling of lung disease such as cystic fibrosis using hPSC-derived lung
    epithelial cells, overcoming the limited availability of patient primary cells.
  source_urls:
  - https://www.stemcell.com/making-lung-cells-from-pluripotent-stem-cells-disease-modeling-and-future-therapies.html
limitations:
- description: 'Developmentally immature: the model expresses "distal-like" and "alveolar type II-like"
    markers, and more mature lung markers (SFTPC, SFTPB, ABCA3) only increase with culture beyond 28 days
    in the Matrigel sandwich, requiring a separate maturation kit.'
  source_urls:
  - https://www.stemcell.com/products/stemdiff-branching-lung-organoid-kit.html
  - https://www.stemcell.com/products/stemdiff-branching-lung-organoid-maturation-kit.html
- description: 'Very long timeline: branching organoids are assessed at days 42 - 67 and matured to day
    101 - 105, against 15 - 35 days for the primary-cell airway organoid formats.'
  source_urls:
  - https://www.stemcell.com/products/stemdiff-branching-lung-organoid-kit.html
- description: Matrigel-dependent (a Matrigel sandwich for the whole branching stage) and tied to specific
    upstream maintenance media (optimized for cells maintained in mTeSR1 or mTeSR Plus).
  source_urls:
  - https://www.stemcell.com/products/stemdiff-branching-lung-organoid-kit.html
- description: hPSC-derived lung and intestinal organoids are characterized in the field as models of
    human fetal tissue, which the pulmonary organoid publication list cites directly.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/pulmonary-organoids/publications.html
  supporting_references:
  - doi:10.1016/j.ydbio.2016.06.006
- description: 'Field-level limitation stated on the overview page: precise control of lung differentiation
    and branching morphogenesis of stem cells remains a challenge, and unresolved issues for lung organoid
    culture include maintaining genetic stability and physiological function over time and developing
    high-throughput screening platforms.'
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/pulmonary-organoids/overview.html
  - https://www.stemcell.com/organoid-profiles-qi-tan.html
