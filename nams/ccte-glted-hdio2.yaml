model:
  id: ccte-glted-hdio2
  type: BiochemicalAssay
  name: CCTE_GLTED_hDIO2
  description: CCTE_GLTED_hDIO2 is a cell-free, single-readout assay designed to test the
    inhibitory activity of chemicals toward human iodothyronine Deiodinase type 2 (DIO2) enzyme.
    Enzyme is incubated in presence of test chemical for 3 hours during which uninhibited
    enzyme liberates free iodide from substrate. Free iodide is measured in a second step
    using the Sandell-Kolthoff method.
  description_scope: METHOD
