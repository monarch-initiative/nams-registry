    Calculating a transcriptional point of departure for a chemical from
    concentration-dependent gene expression change, as a first-tier screening
    value.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153694
  supporting_references:
  - pmid:38043774
- description: >-
    Determining the type of bioactivity a chemical causes, separating
    activation of specific targets from generalized cell stress.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153694
  supporting_references:
  - pmid:38043774
  quotes:
  - snippet: >-
      High-throughput transcriptomics (HTTr) in human cell lines has been
      proposed as a first-tier screening approach for determining the types of
      bioactivity a chemical can cause (activation of specific targets vs.
      generalized cell stress)
    reference: pmid:38043774
- description: >-
    Benchmarking tPOD calculation methods against an external reference: in
    vitro PODs from a validated set of high-throughput screening assays, for a
    set of estrogenic compounds.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153694
  supporting_references:
  - pmid:38043774
limitations:
- description: >-
    The readout is a point of departure, a dose metric. It does not assert a
    mechanism, which is why this paper was screened out of DisMech: a tPOD has
    no mechanism node to attach to.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153694
  supporting_references:
  - pmid:38043774
- description: >-
    For one chemical under one set of experimental conditions, tPODs calculated
    by different methods can vary by several orders of magnitude, and tPODs are
    at least as sensitive to the computational method as to the experimental
    conditions. The value is therefore not interpretable without the method
    that produced it.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153694
  supporting_references:
  - pmid:38043774
  quotes:
  - snippet: >-
      for a given chemical and set of experimental conditions, tPODs calculated
      by different methods can vary by several orders of magnitude
    reference: pmid:38043774
  - snippet: >-
      tPODs are at least as sensitive to computational methods as to
      experimental conditions
    reference: pmid:38043774
- description: >-
    Against an external reference set of PODs, some methods give generally
    higher values, principally PLIER and BMDExpress.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153694
  supporting_references:
  - pmid:38043774
  quotes:
  - snippet: >-
      in comparison to an external reference set of PODs, some methods give
      generally higher values, principally PLIER and BMDExpress
    reference: pmid:38043774
- description: >-
    tPODs from HTTr in this one cell type are mostly higher than the overall
    PODs from a broad battery of targeted in vitro ToxCast assays. The authors
    read this as the need to test chemicals in multiple cell types and readout
    technologies, so a single-cell-type tPOD may not be protective on its own.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153694
  supporting_references:
  - pmid:38043774
  quotes:
  - snippet: >-
      the tPODs from HTTr in this one cell type are mostly higher than the
      overall PODs from a broad battery of targeted in vitro ToxCast assays,
      reflecting the need to test chemicals in multiple cell types and readout
      technologies for in vitro hazard screening
    reference: pmid:38043774
    note: >-
      The authors' own reading of their result, not an inference from it.
- description: >-
    Only the paper's abstract is cached here. Its PubMed Central copy is an
    author manuscript rather than an open-access article, so the assay
    chemistry, the probe panel, the concentration range and the 44 chemicals
    are not itemised in this record.
  supporting_references:
  - pmid:38043774
