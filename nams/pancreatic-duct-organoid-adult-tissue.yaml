model:
  id: pancreatic-duct-organoid-adult-tissue
  type: Organoid
  name: Pancreatic duct organoids from adult pancreatic tissue
  description: Three-dimensional cultures of the pancreatic ductal/exocrine epithelium grown from progenitor
    cells residing in pancreatic ducts. Human organoids express CK19, SOX9, EPCAM, KI67, apical MUC1 and
    CA2, are enriched for PDX1, CK19 and LGR5 relative to whole pancreatic tissue, and show CFTR, SOX9
    and CA2 expression comparable to exocrine tissue. Mouse organoids express LGR5, PDX1, SOX9, CAR2,
    MUC1, KRT19 and AXIN2 and retain these markers to passage 6 - 10. STEMCELL reports more robust expansion
    in PancreaCult (Human) than in two do-it-yourself formulations.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0001264
    name: pancreas
  cell_types:
  - id: CL:0002079
    name: pancreatic ductal cell
  - id: CL:1001433
    name: epithelial cell of exocrine pancreas
  cell_source: adult tissue
  differentiation_method: Fresh or frozen dissociated pancreatic tissue - islet-depleted exocrine tissue
    fractions, isolated ducts or sorted duct cells - is seeded in matrix. Human cultures are initiated
    in PancreaCult Organoid Initiation Medium (Human) for the first 3 days, then switched to PancreaCult
    Organoid Growth Medium (Human) for the remainder; a fully serum-free route initiates directly in Growth
    Medium, though proliferative ductal cells and damaged tissue are better supported by Initiation Medium.
    Mouse exocrine organoids are established and maintained in PancreaCult Organoid Growth Medium (Mouse)
    from duct fragments, single cells or cryopreserved fragments, with no injury model, duct hand-picking
    or cell sorting required.
  culture_system: Corning Matrigel domes (40 uL for expansion) or dilute Matrigel suspension. Human cultures
    are passaged after 7 days with medium changes every 2 - 3 days and are suitable for experiments or
    banking after one full passage in Growth Medium; mouse organoids appear within one week and are passaged
    every 3 - 6 days. Also adaptable to 2D Transwell monolayer cultures and to 96-well (and 384-well)
    high-throughput formats as Matrigel layers (recommended) or 6 uL domes.
