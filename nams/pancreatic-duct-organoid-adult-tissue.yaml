applications:
- description: Study of pancreatic ductal epithelial function and pancreatic cell biology, including CFTR-expressing
    ductal epithelium; the product page names cystic fibrosis as a disease to model with these organoids.
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
  - https://www.stemcell.com/drug-screening-with-human-pancreatic-organoid-cultures.html
- description: Targeted drug screens and toxicity assays, run serum-free to reduce interference and variability
    in drug screens; high-throughput formats capture donor-specific drug responses.
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
  - https://www.stemcell.com/drug-screening-with-human-pancreatic-organoid-cultures.html
- description: Study of molecular pathways in pancreatic ductal cells toward potential therapies for diabetes,
    using organoids from human or murine pancreatic ducts.
  source_urls:
  - https://www.stemcell.com/generating-pancreatic-organoids-from-healthy-murine-and-human-pancreatic-ducts.html
- description: 'Serving as the normal (non-tumour) comparator in pancreatic cancer work, including the
    EGF-withdrawal test: removing EGF abrogates normal pancreatic duct organoid growth within the first
    passage while KRAS-activated tumour organoids continue to grow.'
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
- description: 'Reduction of animal use: mouse pancreatic organoid culture is described as enabling in
    vitro characterization of the pancreatic epithelium that "reduces the need for animal use", and cryopreserved
    Mouse Pancreatic Organoids remove the need for fresh mouse tissue and duct isolation.'
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-growth-medium-mouse.html
  - https://www.stemcell.com/products/mouse-pancreatic-organoids.html
limitations:
- description: Models only the exocrine/ductal compartment. The mouse product is described as a model
    of "the exocrine compartment of the pancreatic epithelium", the human workflow starts from islet-depleted
    exocrine fractions, and the pancreatic tissue page notes the pancreas also has an endocrine compartment
    regulating glucose homeostasis. Obtaining endocrine cells ex vivo is named by Dr. Huch as a challenging
    future prospect rather than a current capability.
  source_urls:
  - https://www.stemcell.com/products/mouse-pancreatic-organoids.html
  - https://www.stemcell.com/products/brands/pancreacult-pancreatic-culture.html
  - https://www.stemcell.com/tissue-and-cell-types/pancreatic.html
  - https://www.stemcell.com/organoid-profiles-meritxell-huch.html
- description: Only the epithelial counterpart of pancreatic disease can be modelled; Dr. Huch states
    the pathogenesis of liver and pancreatic diseases cannot yet be modelled in full and that mouse models
    are still needed to mimic fibrosis and inflammation.
  source_urls:
  - https://www.stemcell.com/organoid-profiles-meritxell-huch.html
- description: 'Fully serum-free initiation is less effective: proliferative pancreatic ductal cells are
    better supported in Initiation Medium during the first 3 days, and initiation and maintenance of damaged
    tissue is better supported by initiating in Initiation Medium rather than Growth Medium.'
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
- description: 'Matrigel-dependent, and dome seeding is error-prone at scale: domes are challenging to
    seed manually in the centre of a 96-well, and domes that wick to the well edge cause organoid growth
    differences and should be avoided (Matrigel layer cultures are recommended instead).'
  source_urls:
  - https://www.stemcell.com/drug-screening-with-human-pancreatic-organoid-cultures.html
- description: 'Passage window matters: organoids must be passaged before the lumen turns dark and collapses,
    and cultures that pass the typical window are shown as degenerate.'
  source_urls:
  - https://www.stemcell.com/mouse-pancreatic-exocrine-organoid-culture-supplementary-protocols.html
- description: 'Licence restriction: PancreaCult media and cryopreserved Mouse Pancreatic Organoids are
    sold for research use only under a licence to intellectual property owned by Hubrecht Organoid Technology
    (HUB); purchase does not include the right to use them for drug screening aiming for commercial gain,
    equipment validation, biobanking or other commercial purposes.'
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
  - https://www.stemcell.com/products/pancreacult-organoid-growth-medium-mouse.html
