model:
  id: atg-xsp1-xtt-cytotoxicity-multi-species
  name: ATG_XSP1_XTT_Cytotoxicity_multi-species
  description: ATG_XSP1_XTT_Cytotoxicity_multi-species is a cell-based, single-readout assay
    that uses HepG2, a human liver cell line, with measurements taken at 24 hours after chemical
    dosing in a 24-well plate. Xsp1 included 3 nM 6-alpha-fluorotestosterone to partially
    stimulate the androgen receptor.
