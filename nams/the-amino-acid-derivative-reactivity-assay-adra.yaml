model:
  id: the-amino-acid-derivative-reactivity-assay-adra
  name: The Amino Acid Derivative Reactivity Assay (ADRA)
  # Untyped: NAMO has no class for an in chemico method (namo#55). A class
  # for it is part of the NAMO work under nams-registry#110.
  description: >-
    A cell-free, in chemico assay for skin sensitization, developed from the
    DPRA to improve its sensitivity and reduce interference. In place of the
    DPRA's peptides it uses two synthetic amino acid derivatives, N-(2-(1-
    naphthyl)acetyl)-L-cysteine (NAC) and alpha-N-(2-(1-naphthyl)acetyl)-L-
    lysine (NAL), each carrying a naphthalene ring on the amino group. The
    naphthalene chromophore lets the unreacted derivative be quantified by
    HPLC at 281 nm, which gives a more stable baseline and less interference
    from co-absorbing test chemicals than the DPRA's 220 nm. As in the DPRA, a
    test chemical is incubated with each derivative and percent depletion of
    NAC and NAL is the readout for the molecular initiating event of the skin
    sensitization AOP (AOP 40, Key Event 396). The method was introduced by
    Fujita et al. 2014 and reached ~88% predictive accuracy on 82 chemicals,
    similar to that of the DPRA tested on the same set. A later dilutional variant, the ADRA-dilutional method
    (ADRA-DM; Yamamoto et al. 2015), reduces the test-chemical concentration
    100-fold relative to the ADRA and removes the solubility restriction that was a major problem for
    the DPRA, so poorly soluble, hydrophobic chemicals can still be tested.
    ADRA is one of the in chemico methods of OECD Test Guideline 442C,
    alongside DPRA and kDPRA.
  description_scope: METHOD
  references:
  - id: pmid:24928155
    title: Development of a prediction method for skin sensitization using novel cysteine and lysine derivatives.
    journal: J Pharmacol Toxicol Methods
    year: 2014
    url: https://doi.org/10.1016/j.vascn.2014.06.001
  - id: pmid:25809859
    title: A novel in chemico method to detect skin sensitizers in highly diluted reaction conditions.
    journal: J Appl Toxicol
    year: 2015
    url: https://doi.org/10.1002/jat.3139
  - id: pmid:27070937
    title: Assessment of Pre- and Pro-haptens Using Nonanimal Test Methods for Skin Sensitization.
    journal: Chem Res Toxicol
    year: 2016
    url: https://doi.org/10.1021/acs.chemrestox.6b00055
  - id: pmid:28882705
    title: Prediction of skin sensitization potency sub-categories using peptide reactivity data.
    journal: Toxicol In Vitro
    year: 2017
    url: https://doi.org/10.1016/j.tiv.2017.08.015
  - id: doi:10.1787/9789264229709-en
    title: 'Test No. 442C: In Chemico Skin Sensitisation'
    url: https://doi.org/10.1787/9789264229709-en
synonyms:
- ADRA
- amino acid derivative reactivity assay
measured_targets:
- name: N-(2-(1-naphthyl)acetyl)-L-cysteine (NAC)
  measurement: percent depletion after 24 h reaction with the test chemical (HPLC at 281 nm)
  notes: >-
    A synthetic cysteine derivative, not a gene product. Replaces the DPRA
    cysteine peptide; the naphthalene ring moves detection to 281 nm.
- name: alpha-N-(2-(1-naphthyl)acetyl)-L-lysine (NAL)
  measurement: percent depletion after 24 h reaction with the test chemical (HPLC at 281 nm)
  notes: >-
    A synthetic lysine derivative, not a gene product. Replaces the DPRA
    lysine peptide.
applications:
- description: >-
    Hazard identification of skin sensitizers without animals, reading the
    protein reactivity that is the molecular initiating event of the skin
    sensitization AOP. Fujita et al. reported ~88% predictive accuracy on 82
    chemicals, comparable to the DPRA, while the naphthalene label improved
    baseline stability and reduced interference from other substances in the
    reaction solution.
  source_urls:
  - https://doi.org/10.1016/j.vascn.2014.06.001
  supporting_references:
  - pmid:24928155
  quotes:
  - snippet: >-
      ADRA measurements were conducted at 281nm, which improved baseline
      stability, and were less influenced by other substances in the reaction
      solutions than DPRA measurements that are conducted at 220nm.
    reference: pmid:24928155
- description: >-
    Testing hydrophobic or poorly soluble chemicals that the DPRA cannot
    handle, through the ADRA-dilutional method (ADRA-DM) variant. ADRA-DM
    reduces the test-chemical concentration 100-fold relative to the ADRA --
    two orders of magnitude lower -- so chemicals that would precipitate in the
    DPRA reaction stay in solution, removing the solubility restriction that
    was a major problem for the DPRA.
  source_urls:
  - https://doi.org/10.1002/jat.3139
  supporting_references:
  - pmid:25809859
  quotes:
  - snippet: >-
      ADRA-DM does not have the restrictions on test compound solubility that
      were a major problem with the DPRA.
    reference: pmid:25809859
limitations:
- description: >-
    No cells, so no xenobiotic metabolism. Like the DPRA, ADRA reads direct
    protein reactivity and can miss pro-haptens, which become protein-reactive
    only after metabolic activation, and pre-haptens, which require abiotic
    transformation. The gap is the same one documented for the DPRA, since
    both are cell-free peptide-reactivity assays; combining in chemico with
    cell-based methods recovers the missed sensitizers.
  source_urls:
  - https://doi.org/10.1021/acs.chemrestox.6b00055
  supporting_references:
  - pmid:27070937
  quotes:
  - snippet: >-
      In contrast to in vivo methods, they lack or provide limited metabolic
      capacity. For this reason, identification of pro-haptens but also
      pre-haptens, which require molecular transformations to gain peptide
      reactivity, is a challenge for these methods.
    reference: pmid:27070937
- description: >-
    A hazard call, not a potency measure -- inferred by analogy with the DPRA,
    not shown for ADRA itself. ADRA, like the standard DPRA, reads depletion
    at a single concentration and reaction time. For the DPRA that design did
    not discriminate GHS potency sub-categories 1A and 1B, and resolving them
    needed the kinetic reading used by the kDPRA. No ADRA potency study has
    been curated here yet.
  source_urls:
  - https://doi.org/10.1016/j.tiv.2017.08.015
  supporting_references:
  - pmid:28882705
  quotes:
  - snippet: >-
      The Direct Peptide Reactivity Assay (DPRA; one concentration and
      reaction-time) did not sufficiently discriminate between sub-categories
      1A and 1B (56% accuracy compared to LLNA data, n=124).
    reference: pmid:28882705
