model:
  id: tox21-herg-u2os-antagonist
  name: TOX21_hERG_U2OS_Antagonist
  description: TOX21_hERG_U2OS_Antagonist is a cell-based, single-readout assay that uses
    U2OS, a human osteosarcoma cell line, to measure inhibition of hERG channel activity by
    continuously measuring fluorescence intensity once per second for two minutes, taken 10
    minutes after chemical dosing in a 1536-well plate. See tox21-herg-u2os-p1.
