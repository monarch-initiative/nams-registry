model:
  id: intestinal-organoid-pluripotent-stem-cell
  type: Organoid
  name: hPSC-derived human intestinal organoids
  description: Organoids generated by directed differentiation of human pluripotent stem cells, comprising
    a polarized epithelial monolayer surrounding a hollow lumen together with an associated mesenchymal
    cell population (desmin, vimentin) that contributes stem cell niche signaling. They express intestinal
    epithelial and progenitor markers (CDX2, E-cadherin, EPCAM, SOX9) and markers of mature cell types
    (MUC2 goblet cells, CHGA enteroendocrine cells, KRT20), and model the developing intestinal epithelium
    and associated mesenchyme rather than adult tissue.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0002108
    name: small intestine
  cell_types:
  - id: CL:0000160
    name: goblet cell
  - id: CL:0000164
    name: enteroendocrine cell
  - id: CL:0008019
    name: mesenchymal cell
  cell_source: pluripotent stem cells
  differentiation_method: 'Human ES and iPS cells are directed through a three-stage protocol with the
    STEMdiff Intestinal Organoid Kit (Cat #05140): induction of definitive endoderm (FOXA2/SOX17 co-expression
    by day 3), mid-/hindgut specification (days 5-9) during which spheroids spontaneously bud from the
    monolayer into the medium, then collection of the free-floating spheroids, embedding in extracellular
    matrix, and maturation into intestinal organoids in STEMdiff Intestinal Organoid Growth Medium (Cat
    #05145). Differentiation can also be initiated from single-cell hPSCs (20,000-30,000 viable cells
    per well of a 24-well plate in eTeSR with 10 uM Y-27632) for greater homogeneity, including for genetically
    modified clones. Based on the formulation published by Spence et al. (Nature 2011).'
  culture_system: 50 uL ~100% Matrigel domes in 24-well plates; organoids maintained and expanded by passaging
    every 7-10 days at a split ratio between 1 in 2 and 1 in 4; cryopreservable. Optimized for hPSCs maintained
    in mTeSR1, mTeSR Plus or TeSR-AOF.
  references:
  - id: doi:10.1038/nature09691
    title: Directed differentiation of human pluripotent stem cells into intestinal tissue in vitro
    authors:
    - Jason R. Spence
    - Christopher N. Mayhew
    - Scott A. Rankin
    - Matthew F. Kuhar
    - Jefferson E. Vallance
    - Kathryn Tolle
    - Elizabeth E. Hoskins
    - Vladimir V. Kalinichenko
    - Susanne I. Wells
    - Aaron M. Zorn
    - Noah F. Shroyer
    - James M. Wells
    journal: Nature
    year: 2011
  - id: doi:10.1242/dev.097386
    title: How to make an intestine
    authors:
    - James M. Wells
    - Jason R. Spence
    journal: Development
    year: 2014
  - id: doi:10.1038/s41598-020-63151-z
    title: Generation of intestinal organoids derived from human pluripotent stem cells for drug testing
    authors:
    - Shinpei Yoshida
    - Hiroto Miwa
    - Tomoyuki Kawachi
    - Shoen Kume
    - Koji Takahashi
    journal: Scientific Reports
    year: 2020
synonyms:
- human intestinal organoids
- HIOs
- PSC-derived intestinal organoids
species:
- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: Modeling intestinal development and cell biology, intestinal inflammation, intestinal regeneration,
    microbial interaction, disease modeling, drug discovery and compound screening.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-intestinal-organoid-kit.html
- description: 'Modeling developmental and malabsorptive disease: enteroendocrine regulation of nutrient
    absorption was studied in patient-relevant NEUROG3 contexts, where loss of enteroendocrine hormones
    produced abnormal enterocyte electrical responses to glucose and dipeptides that were only apparent
    in a complex physiological environment with enteric neuron input, and could be partly rescued by adding
    exogenous enteroendocrine hormones.'
  source_urls:
  - https://www.stemcell.com/organoid-profiles-heather-mccauley.html
  - https://www.stemcell.com/gi-tract-organoids-using-advanced-tissue-models-to-interrogate-absorption-and-regulation.html
- description: Modeling exposure of immature intestinal tissue to microbes, for example in necrotizing
    enterocolitis, using the fetal-like character of the epithelium as the point of the model.
  source_urls:
  - https://www.stemcell.com/organoid-profiles-jason-spence.html
- description: Platform for co-culture extensions, including generation of hPSC-derived intestinal tissue
    with a functional enteric nervous system by co-culture with neural crest cells, enabling study of
    human gastrointestinal motility disorders.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/intestinal-research/mini-review.html
  - https://www.stemcell.com/modeling-human-gastrointestinal-development-and-disease-using-pluripotent-stem-cells.html
  supporting_references:
  - doi:10.1038/nm.4233
- description: 'Genetic disease modeling with gene-edited hPSC clones: differentiating single clones of
    genetically modified hPSCs is used to elucidate the role of a specific gene in developmental or disease
    processes.'
  source_urls:
  - https://www.stemcell.com/intestinal-organoid-differentation-from-single-cells.html
limitations:
- description: 'Fetal-like maturity: at early passages hPSC-derived organoids have a distinctly fetal
    intestinal phenotype and maintain a more fetal-like phenotype in culture; the pages state full maturation
    of the intestinal epithelial cells is so far only achievable by transplanting organoids into mouse
    kidney capsules, and that understanding how to continue maturing tissues in vitro is an outstanding
    issue for the field.'
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/intestinal-research/mini-review.html
  - https://www.stemcell.com/organoid-profiles-jason-spence.html
  supporting_references:
  - doi:10.1016/j.ydbio.2016.06.006
  - doi:10.1242/dev.138453
- description: 'Culture composition drifts with passage: after multiple passages the organoids generally
    exhibit less sinking within the matrix dome and a lower proportion of mesenchymal cells.'
  source_urls:
  - https://www.stemcell.com/products/stemdiff-intestinal-organoid-kit.html
- description: 'Line-to-line variability: efficiency depends on hPSC line, and the density of the starting
    culture is critical for efficient differentiation all the way through; some hPSC lines work better
    than others and seeding densities should be optimized per line.'
  source_urls:
  - https://www.stemcell.com/organoid-profiles-jason-spence.html
  - https://www.stemcell.com/how-to-generate-monolayers-from-hpsc-derived-organoids-using-intesticult.html
- description: Fibroblast overgrowth is a recurring problem in ESC/hPSC-derived intestinal and colon organoid
    systems, including protocols from the STEMdiff kits and other published protocols.
  source_urls:
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: Closed lumen as in other 3D organoids; a separate monolayer protocol exists to expose the
    apical surface. IntestiCult Plus is not recommended for hPSC-derived organoids.
  source_urls:
  - https://www.stemcell.com/how-to-generate-monolayers-from-hpsc-derived-organoids-using-intesticult.html
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
