  quotes:
  - snippet: A hydrogel bioink comprised of hyaluronic acid and collagen is bioprinted into a viscous
      gelatin bath, which blocks the bioink from interacting with the well walls and provides support
      to maintain a spherical form.
    reference: doi:10.3390/mi11020208
  - snippet: This method was validated using several cancerous cell lines, and then applied to
      patient-derived glioblastoma (GBM) and sarcoma biospecimens for drug screening.
    reference: doi:10.3390/mi11020208
  - snippet: Responses to the p53 activator compound were effective across all PTO sets, while
      TMZ responses were observed, but less pronounced, potentially explained by genetic and epigenetic
      states of the originating tumors.
    reference: doi:10.1088/1748-605X/aca05d
  - snippet: Bioprinting technology enables the biofabrication of organoid models at increased
      throughput, furthering the use of organoid/organ-on-a-chip systems in basic science and translational
      studies.
    reference: doi:10.1557/s43577-023-00559-8
- description: >-
    Testing candidate combination therapies in glioblastoma: in a 3D GBM
    organoid model from the same group, temozolomide combined with the
    connexin 43 mimetic peptide αCT1 improved treatment efficacy in some
    GBM populations. The abstract does not say whether these organoids were
    patient-derived or which matrix or fabrication method was used; the
    review cites the work as part of the lab's GBM organoid platform.
