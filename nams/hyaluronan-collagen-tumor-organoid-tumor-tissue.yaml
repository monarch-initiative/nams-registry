model:
  id: hyaluronan-collagen-tumor-organoid-tumor-tissue
  type: Organoid
  name: >-
    Patient-derived tumour organoids in hyaluronic acid/collagen hydrogel,
    hand-deposited or immersion-bioprinted in well plates (pan-cancer)
  description: >-
    Patient-derived tumour organoids (PTOs) made by the Skardal, Soker and
    Votanopoulos groups (Wake Forest, later Ohio State) and summarised in the
    review by Anderson, Stagner, Sivakumar & Skardal 2023
    (doi:10.1557/s43577-023-00559-8). A fresh surgical tumour specimen (or,
    for lung adenocarcinoma, pleural effusion aspirate) is enzymatically
    dissociated and the unsorted, unexpanded cell population, which keeps
    tumour stroma and infiltrating immune cells, is suspended in an
    extracellular-matrix-mimicking hydrogel of thiolated hyaluronic acid with
    methacrylated collagen (or, in some studies, the HyStem-HP
    hyaluronan/heparin/gelatin system), deposited as small droplets of about
    5-10 μL in well plates and photocrosslinked. Drugs are screened about 7
    days after fabrication, with LIVE/DEAD imaging and metabolic (MTS) or ATP
    viability readouts. The lab has applied the platform across tumour types:
    appendiceal (low- and high-grade), colorectal and appendiceal peritoneal
    metastases, sarcomas of several subtypes, lung adenocarcinoma, peritoneal
    mesothelioma, glioblastoma/glioma and a lung adenocarcinoma brain
    metastasis. These are described within this one record rather than as
    separate records.

    Bioprinted versus hand-deposited: in the four full-text primary papers
    used here (appendiceal, colorectal/HIPEC, sarcoma, lung adenocarcinoma)
    the organoids were made by pipetting hydrogel-cell droplets into
    PDMS-coated 48- or 96-well plates; they were not bioprinted. Bioprinting
    is the scale-up fabrication route for the same hydrogel PTO, shown in
    two abstract-only papers: Maloney et al. 2020 immersion-bioprinted an
    HA/collagen bioink into a gelatin support bath in 96-well plates and
    applied it to patient glioblastoma and sarcoma specimens, and Clark et
    al. 2023 replaced the gelatin bath with a hyaluronic acid bath and
    screened glioma and lung-adenocarcinoma-brain-metastasis PTOs. The
    bioink, the patient cells and the screening readouts are shared; the
    printing step changes deposition, throughput and organoid uniformity.
    The mesothelioma study (Mazzocchi et al. 2018) placed the organoids in a
    tumour-on-a-chip microfluidic device rather than well plates.

    Distinct from tumor-organoid-tumor-tissue, the general pan-cancer
    patient-derived organoid record, whose organoids are expanded and banked
    as lines in basement-membrane (Matrigel-type) domes over weeks; these
    PTOs are not expanded, are used within days of surgery, and use a
    defined hyaluronan/collagen matrix that the authors chose instead of
    basement membrane extract partly because it can be bioprinted.
    Immune-enhanced PTOs (with patient-matched lymph node or blood immune
    cells), metastasis-on-a-chip and the glioblastoma spheroid Wnt invasion
    assay from the same review are separate records.
  description_scope: METHOD
  three_d_architecture: HYDROGEL_EMBEDDED
  complexity_level: MODERATE
  cell_types:
  - id: CL:0001064
    name: malignant cell
  - id: CL:0000057
    name: fibroblast
  - id: CL:0000738
    name: leukocyte
  cell_source: >-
    Fresh human tumour tissue from surgical resection (including
    cytoreductive surgery with HIPEC), or malignant pleural effusion
    aspirate; cells are used unsorted and without expansion.
  differentiation_method: >-
    None; primary tumour cells are encapsulated directly. Tissue is minced
    and digested with collagenase/hyaluronidase (or collagenase HA and BP
    protease) for up to 2 h, filtered at 100 µm, red cells lysed and, in
    later studies, dead cells removed; about 10 million cells/mL of hydrogel
    precursor.
  matrix_composition: >-
    Thiolated hyaluronic acid (Glycosil) mixed 1:3 with methacrylated type I
    collagen (PhotoCol), photocrosslinked by brief UV exposure with a
    photoinitiator; the sarcoma study instead used HyStem-HP
    (thiol-modified heparin, thiol-modified gelatin and PEGDA crosslinker).
    The bioprinted versions use an HA/collagen bioink of the same family,
    printed into a gelatin (Maloney 2020) or hyaluronic acid (Clark 2023)
    support bath.
  size_range: >-
    About 5-10 μL hydrogel droplets, roughly 1 mm across; 75-200 organoids
    per tumour specimen.
  culture_system: >-
    Droplets pipetted into PDMS-coated 48- or 96-well plates (hand-deposited
    format), or immersion-bioprinted into a support bath in 96-well plates;
    optionally integrated into microfluidic tumour-on-a-chip devices.
  culture_conditions: >-
    DMEM with 10% FBS, penicillin-streptomycin and L-glutamine (appendiceal,
    sarcoma), RPMI with 5% FBS (lung), or an Advanced DMEM/F12 organoid
    medium with B-27, N-2, EGF, nicotinamide, Y-27632, SB202190 and A83-01
    (colorectal/HIPEC). Drug exposure for 3-4 days starting on day 7;
    readouts by LIVE/DEAD staining, MTS or CellTiter-Glo 3D, H&E and
    immunohistochemistry.
