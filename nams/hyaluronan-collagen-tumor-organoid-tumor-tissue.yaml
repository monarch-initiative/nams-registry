- description: >-
    Bioprinting hydrogel into small wells is error-prone: a bioink droplet
    that touches the well wall spreads and flattens into a 2D culture. The
    support bath addresses this, and the authors report that a hyaluronic
    acid bath gave more consistent organoid volumes and shapes than the
    earlier gelatin bath, so organoid geometry depends on bath and print
    parameters.
