    reference: doi:10.1002/bit.28313
- description: >-
    Mutation-guided drug testing and on-chip screening: mesothelioma PTOs
    biofabricated from two patients' biopsies and kept in a tumour-on-a-chip
    microfluidic device gave on-chip chemotherapy results that the authors
    report mimicked the patients' own responses, and confirmed the
    non-standard compound 3-deazaneplanocin A against a mutation found by
    genetic screening. The hydrogel PTOs can likewise be placed in
    microfluidic devices for staged infusions or linked to other organoid
    types; the metastasis-on-a-chip system is a separate record.
  source_urls:
  - https://doi.org/10.1038/s41598-018-21200-8
  - https://pubmed.ncbi.nlm.nih.gov/30414038/
  supporting_references:
  - doi:10.1038/s41598-018-21200-8
  - pmid:30414038
  quotes:
  - snippet: Second, we demonstrate that results of on-chip chemotherapy screening mimic those
      observed in subjects themselves.
    reference: doi:10.1038/s41598-018-21200-8
  - snippet: As an optional addition, organoids could be integrated into microfluidic devices
      as recently described.
    reference: pmid:30414038
limitations:
- description: >-
    Most of the evidence is not for a bioprinted system. Every full-text
    study used here (appendiceal, colorectal/HIPEC, sarcoma, lung) made the
    organoids by pipetting hydrogel droplets by hand; bioprinting of these
    PTOs rests on two abstract-only papers covering glioblastoma/glioma,
    sarcoma and one lung-adenocarcinoma brain metastasis. Success rates,
    timelines and response patterns from the hand-deposited studies have not
    been shown to carry over to bioprinted organoids.
  source_urls:
