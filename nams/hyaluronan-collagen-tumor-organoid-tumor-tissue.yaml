    reference: pmid:35780216
- description: >-
    Comparing intraperitoneal (HIPEC) perfusion regimens patient by patient:
    PTOs from 15 appendiceal and 8 colon cancers with peritoneal spread were
    exposed to mitomycin C and two oxaliplatin regimens at 37 and 42 °C. The
    high-dose 30-minute oxaliplatin regimen was the least effective in both
    tumour types, and the benefit of hyperthermia varied between patients.
