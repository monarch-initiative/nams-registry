  quotes:
  - snippet: An adequate organoid number was generated for 75% (6/8) of colon and 73% (11/15)
      of appendiceal patients.
    reference: pmid:32632882
  - snippet: These data demonstrate that the 460 mg/m2/30 min oxaliplatin regimen is ineffective
      in both colon and appendiceal PTOs.
    reference: pmid:32632882
- description: >-
    Lung adenocarcinoma modelling and drug testing from malignant pleural
    effusion, a fluid routinely drained and otherwise discarded. Freshly
    isolated effusion cells in the hydrogel formed mucin-producing acinar
    structures containing tumour, fibroblast and CD45+ cells that persisted
    for up to 6 weeks, whereas cells first passaged on plastic formed
    smaller structures; the same patient's cells were less sensitive to
    cisplatin/pemetrexed and carboplatin/pemetrexed in 3D organoids than on
    2D plastic. The drug-tested specimen came from a patient whose
    adenocarcinoma was possibly a metastasis from pancreatic cancer.
  source_urls:
