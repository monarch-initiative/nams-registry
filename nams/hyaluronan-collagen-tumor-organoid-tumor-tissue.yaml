- description: >-
    Source coverage: statements resting on the bioprinting papers (Maloney
    2020, Clark 2023), the bioink preprint (Aleman 2021), the mesothelioma
    chip study (Mazzocchi 2018), the αCT1 GBM study (Che 2023) and the
    bioprinting-for-screening review (Mazzocchi, Soker & Skardal 2019) were
    made from their abstracts only. The appendiceal, colorectal/HIPEC,
    sarcoma and lung papers were read in full text. The Anderson et al. 2023
    review's full text was read on the publisher's page but is not openly
    licensed, so only its abstract is cached and quoted.
