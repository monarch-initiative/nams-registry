applications:
- description: >-
    Personalised chemotherapy screening on a patient's own tumour before or
    alongside treatment, with results inside a clinically usable window:
    drug testing starts about 7 days after organoid fabrication and the full
    panel is complete in under 12 days. In 12 appendiceal cancers (3
    high-grade, 9 low-grade) 9 organoid sets were established (75%);
    high-grade sets responded variably between patients while low-grade sets
    did not respond to any regimen, matching the clinical pattern. In 16
    sarcomas of several subtypes, organoids were made from every specimen
    and 12 had enough cells for chemotherapy screening, with doxorubicin the
    most often effective agent.
  source_urls:
  - https://pubmed.ncbi.nlm.nih.gov/30414038/
  - https://pubmed.ncbi.nlm.nih.gov/35780216/
  - https://doi.org/10.1557/s43577-023-00559-8
  supporting_references:
  - pmid:30414038
  - pmid:35780216
  quotes:
  - snippet: Successful establishment rate of viable organoid sets was 75% (9/12). Average time
      from organoid development to chemotherapy testing was 7 days.
    reference: pmid:30414038
  - snippet: The time needed to engineer patient-specific tumor organoids and complete chemosensitivity
      panels is less than 12 days
    reference: pmid:30414038
  - snippet: HGA tumor organoids derived from different patients demonstrated variable chemotherapy
      tumor-killing responses, whereas LGA organoids tested with the same regimens showed no response
      to chemotherapy.
    reference: pmid:30414038
  - snippet: Sixteen sarcomas were biofabricated into three-dimensional (3D) patient-specific sarcoma
      organoids with a 100% success rate.
    reference: pmid:35780216
- description: >-
    Modelling rare and low-cellularity tumours for which cell lines and 2D
    cultures are hard to establish, such as low-grade mucinous appendiceal
    tumours and rare sarcoma subtypes, without expanding the cells; of the
    appendiceal specimens only one cell population adhered to 2D plastic,
    and unexpanded sarcoma PTO cells kept a drug response that expanded or
    immortalised cells from the same patient lost over passages.
