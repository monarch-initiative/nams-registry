  quotes:
  - snippet: Our results show that cells in 2D culture were more sensitive to treatment when compared
      with 3D organoids.
    reference: pmid:31723594
  - snippet: On the other hand, cells first grown in plastic dishes and then cultured in 3D did
      not create similar structures.
    reference: pmid:31723594
- description: >-
    Higher-throughput, bioprinted PTO drug screening in 96-well plates.
    Immersion bioprinting of an HA/collagen bioink into a support bath keeps
    each organoid from touching the well wall and spreading into a 2D
    layer. It was validated with cancer cell lines and then used to screen
    patient glioblastoma and sarcoma specimens (gelatin bath), and later
    glioma and lung-adenocarcinoma-brain-metastasis PTOs against
    temozolomide and an experimental p53 activator (hyaluronic acid bath).
  source_urls:
