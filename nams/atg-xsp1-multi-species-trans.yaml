model:
  id: atg-xsp1-multi-species-trans
  name: ATG_XSP1_multi-species_TRANS
  description: 'ATG_XSP1_multi-species_TRANS is a cell-based, multiplexed assay created by
    modifying the existing Attagene TRANS-FACTORIAL system to include a panel of nuclear receptors
    from some or all the following species: human (Homo sapiens), mouse (Mus musculus), frog
    (Xenopus laevis), zebrafish (Danio rerio), chicken (Gallus gallus), and turtle (Chrysemys
    picta). The ECOTOX-FACTORIAL format uses HepG2, a human liver cell line, with measurements
    taken at 24 hours after chemical dosing in a 24-well plate. Xsp1 included 3 nM 6-alpha-fluorotestosterone
    to partially stimulate the androgen receptor.'
  description_scope: METHOD
