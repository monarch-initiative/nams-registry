model:
  id: ace-inhibition-ga-mlr-2d-qsar-in-silico
  type: QSARModel
  name: GA-MLR 2D-QSAR model for angiotensin-converting-enzyme inhibition
  description: >-
    A quantitative structure-activity relationship model that predicts
    angiotensin-converting-enzyme (ACE) inhibitory activity from
    two-dimensional molecular descriptors. Genetic algorithm-multiple linear
    regression (GA-MLR) is fitted to a dataset of 255 structurally diverse,
    experimentally validated ACE inhibitors, yielding models that conform to
    the OECD principles for QSAR validation (reported R2 = 0.70-0.75,
    Q2LOO = 0.67-0.73, Q2LMO = 0.66-0.72, CCCex = 0.70-0.78). The descriptors
    are Padel, Estate and PyDescriptors chosen to be simply illustratable, and
    they correlate the structural scaffold required for ACE inhibition. In the
    same study the model drives a QSAR-based virtual screen of 102 thiadiazole
    derivatives, alongside constraint-based molecular docking against ACE,
    molecular dynamics and ADMET analysis, nominating two computational leads
    (D24, D40). Its output is predicted ACE-inhibition activity, not a
    mechanism of cardiovascular disease, which the paper names only as
    motivation. Recorded in the registry from the primary paper, Shah et al.
    2023/2024 (doi:10.1080/07391102.2023.2203261), found through the
    Complement-ARIE Landscape Analysis disease-paper corpus.
  description_scope: METHOD
  biological_organization_level: SUBCELLULAR
  spatial_context: >-
    None for the QSAR itself: it operates on chemical structure alone and
    simulates no biological system. The constraint-based molecular docking
    reported alongside it represents the ACE active site to characterise
    ligand-enzyme binding, but the predictive model is structure-based QSAR.
  complexity_level: LOW
  computational_method: >-
    Genetic algorithm-multiple linear regression (GA-MLR) over selected
    two-dimensional molecular descriptors, with constraint-based molecular
    docking, molecular dynamics and ADMET analysis used to triage the
    virtual-screening hits.
  prediction_scope: >-
    ACE-inhibition activity for an organic chemical from its two-dimensional
    structure, used to rank and virtually screen candidate inhibitors. It
    predicts a drug-target activity endpoint, not the mechanism by which ACE
    inhibition modifies cardiovascular disease.
  molecular_descriptors:
  # The abstract names the descriptor classes, not the individual descriptors.
  - Padel descriptors (2D)
  - Estate descriptors (2D)
  - PyDescriptors (2D)
  activity_endpoint: >-
    Angiotensin-converting-enzyme (ACE) inhibitory activity
  references:
  - id: pmid:37128759
    title: >-
      In silico study to recognize novel angiotensin-converting-enzyme-I
      inhibitors by 2D-QSAR and constraint-based molecular simulations
    authors:
    - Sagar Shah
    - Dinesh Chaple
    - Vijay H. Masand
    - Magdi E. A. Zaki
    - Sami A. Al-Hussain
    - Abhay Shah
    - Sumit Arora
    - Rahul Jawarkar
    - Mohd Tauqeer
    journal: Journal of Biomolecular Structure and Dynamics
    year: 2024
    url: https://doi.org/10.1080/07391102.2023.2203261
