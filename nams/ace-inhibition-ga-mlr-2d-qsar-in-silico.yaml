    reference: pmid:37128759
limitations:
- description: >-
    The model's output is predicted ACE-inhibition activity, a drug-target
    endpoint, so it identifies no disease mechanism. Cardiovascular disease is
    the stated motivation, not something the model represents; this is why the
    NAM has no DisMech mechanism anchor (monarch-initiative/dismech#16882).
  source_urls:
  - https://doi.org/10.1080/07391102.2023.2203261
  supporting_references:
  - pmid:37128759
- description: >-
    The two nominated leads (D24, D40) are computational predictions from
    docking, molecular dynamics and ADMET with no wet-lab confirmation
    reported. Docking against a known target to confirm candidate binding sits
    at the edge of the unsettled question of how far a simulation-only target
    claim can be trusted (monarch-initiative/dismech#16883); here ACE is an
    established target, so the docking is confirmatory within the screen rather
    than a new target proposal.
  source_urls:
  - https://doi.org/10.1080/07391102.2023.2203261
  supporting_references:
  - pmid:37128759
- description: >-
    Only the paper's abstract is cached here, so the individual descriptors
    are not itemised, the ACE structure used as the docking receptor is not
    named, and no experimental validation of the virtual-screening hits is
    available in this record.
  supporting_references:
  - pmid:37128759
