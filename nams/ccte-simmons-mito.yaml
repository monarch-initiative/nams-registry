model:
  id: ccte-simmons-mito
  name: CCTE_Simmons_MITO
  description: 'CCTE_Simmons_MITO is cell-based, respirometric assay using HepG2 cells and
    a Seahorse XF Analyzer to measure oxygen consumption rates over four temporal phases spanning
    a total of 72 minutes: pre-injection (pre-treatment), basal (following test compound injection),
    maximal (following FCCP uncoupler injection), and inhibited (following rotenone/antimycin
    A injection)'
