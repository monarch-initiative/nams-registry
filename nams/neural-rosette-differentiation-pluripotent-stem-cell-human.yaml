model:
  id: neural-rosette-differentiation-pluripotent-stem-cell-human
  type: TwoDCellCulture
  name: ReproTracker neural rosette differentiation biomarker assay
  description: >-
    The neuroectodermal arm of ReproTracker, a commercial human iPSC biomarker
    assay for teratogenic potential (Toxys). Human induced pluripotent stem
    cells are differentiated towards neural rosettes over an adherent
    protocol, with the test compound present from day 0 and renewed at each
    medium change, and the differentiation is tracked by quantitative
    expression of the neural ectoderm biomarker PAX6 and the neural
    rosette-specific biomarker Nestin. A concentration-dependent fall in
    biomarker expression below the control threshold, at non-cytotoxic
    concentrations, classifies the compound as a teratogen. The companion
    records cardiomyocyte-differentiation-pluripotent-stem-cell-human and
    hepatocyte-differentiation-pluripotent-stem-cell-human run the same cells
    and the same classification rule towards the other two germ layers; the
    three are read together, and a compound is called a teratogen if any one
    of them drops. This arm is the one that discriminated between the two
    compounds in the source study: carbamazepine lowered PAX6 and disrupted
    rosette morphology, while thalidomide left the arm untouched by the
    classification rule and moved PAX6 in the opposite direction. Recorded in
    the registry from the primary paper, Moreau et al. 2023
    (doi:10.1016/j.tox.2023.153684), in the Toxicology special issue "New
    approach methodologies: from conceptual development to regulatory
    application".
  biological_organization_level: CELLULAR_NEIGHBORHOOD
  spatial_context: >-
    An adherent culture in a multi-well plate in which differentiating
    neuroepithelial cells self-organise into radial rosettes, so unlike the
    other two arms the endpoint has a local multicellular arrangement as well
    as a transcript level. It is still a flat culture: there is no neural tube
    closure, no dorsoventral patterning, no neural crest emigration and no
    non-neural tissue.
  complexity_level: LOW
  cell_types:
  - id: CL:0002248
    name: pluripotent stem cell
  - id: CL:0000710
    name: neurecto-epithelial cell
  cell_source: >-
    Human induced pluripotent stem cells, differentiated towards neural
    rosettes through an early neural ectoderm intermediate.
  substrate_type: multi-well tissue culture plate
  culture_conditions: >-
    Compound added on day 0 in differentiation medium at 0.1% v/v final DMSO,
    at five concentrations, and renewed at each medium change (days 3, 7 and
    10). The top concentration comes from a prior AlamarBlue dose-finding in
    undifferentiated hiPSCs: "The lowest concentration that induced
    cytotoxicity (max 20-40%) in the dose finding was applied as the top
    concentration for the differentiation experiment."
  references:
  - id: doi:10.1016/j.tox.2023.153684
    title: 'Animal-free assessment of developmental toxicity: Combining PBPK modeling
      with the ReproTracker assay'
    authors:
    - Marjory Moreau
    - Amer Jamalpoor
    - John Carter Hall
    - Jeffrey Fisher
    - Sabine Hartvelt
    - Giel Hendriks
    - Andy Nong
    journal: Toxicology
    year: 2023
synonyms:
- ReproTracker neural rosette differentiation assay
- ReproTracker neuroectodermal arm
species:
- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: >-
    Identifying teratogenic potential of pharmaceuticals and chemicals in a
    human cell system, without animals. Carbamazepine disrupted rosette
    morphology at 15.6 micromolar and lowered PAX6 in a concentration-dependent
    way.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153684
  supporting_references:
  - doi:10.1016/j.tox.2023.153684
- description: >-
    Distinguishing compounds that a single-lineage assay would score alike.
    Thalidomide and carbamazepine are both teratogens and both were detected
    by the panel, but only carbamazepine affected this arm, so the three-arm
    profile separates them where the overall call does not.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153684
  supporting_references:
  - doi:10.1016/j.tox.2023.153684
limitations:
- description: >-
    The readout identifies no mechanism. It records that neuroectodermal
    identity was or was not acquired, not what was perturbed upstream or why.
    The source publication asserts no pathway for either compound.
- description: >-
    A marker can rise, and the classification rule does not act on it. In the
    source study "Thalidomide, however, increased the gene expression of
    neural ectoderm biomarker gene (PAX6) in a dose-dependent manner", while
    the same compound had "no effect on the morphology of neural rosettes, nor
    on expression pattern of the neural rosette-specific biomarker gene,
    NESTIN". A concentration-dependent increase in a lineage marker is a real
    observation that this arm reports and then discards, because
    classification is by reduction only.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153684
  supporting_references:
  - doi:10.1016/j.tox.2023.153684
- description: >-
    A negative result here is not evidence that a compound spares the nervous
    system. The arm covers gastrulation-stage neuroectoderm only, so later
    neurodevelopmental processes, and any effect needing cell types absent
    from the culture, are outside it.
- description: >-
    A compound that disrupts the cells without moving the two marker genes is
    scored negative by design: "a compound affecting only
    morphology/functionality of the differentiated cells without having any
    effect on the selected biomarker genes, was a non-developmental toxicant
    in ReproTracker". Morphology is also scored subjectively.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153684
  supporting_references:
  - doi:10.1016/j.tox.2023.153684
- description: >-
    Exposure is nominal, not free, concentration. The source study records
    that binding to plastics and serum proteins was not accounted for: "This
    aspect was not taken into consideration in this analysis."
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153684
  supporting_references:
  - doi:10.1016/j.tox.2023.153684
