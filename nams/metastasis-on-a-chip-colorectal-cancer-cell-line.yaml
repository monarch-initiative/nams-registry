applications:
- description: >-
    Modelling the migratory events of metastasis in vitro: fluorescent
    colorectal cancer cells are tracked in real time as they leave a
    hydrogel-fabricated gut/tumour construct, enter circulation, and reach a
    downstream liver construct within a circulatory fluidic device, mimicking
    stages of human metastasis.
  source_urls:
  - https://doi.org/10.1002/bit.25950
  supporting_references:
  - doi:10.1002/bit.25950
  quotes:
  - snippet: >-
      Here we describe a "metastasis‐on‐a‐chip" system allowing real time tracking
      of fluorescent colon cancer cells migrating from hydrogel‐fabricated gut
      constructs to downstream liver constructs within a circulatory fluidic
      device system that responds to environmental manipulation and drug
      treatment.
    reference: doi:10.1002/bit.25950
  - snippet: >-
      Metastatic tumor foci grew in size, eventually disseminating from the
      intestine construct and entering circulation, subsequently reaching in the
      liver construct, thus mimicking some of the migratory events observed
      during metastasis.
    reference: doi:10.1002/bit.25950
- description: >-
    Assessing organ-specific metastatic preference: in the multi-site device, a
    colorectal cancer organoid is connected to downstream liver, lung, and
    endothelial constructs, and HCT116 CRC cells preferentially home to the
    liver and lung — the organs CRC metastasises to most in human patients.
  source_urls:
  - https://doi.org/10.1002/bit.26871
  supporting_references:
  - doi:10.1002/bit.26871
  quotes:
  - snippet: >-
      Specifically, cancer cells begin in colorectal cancer (CRC) organoid, which
      resides in a single microfluidic chamber connected to multiple downstream
      chambers in which liver, lung, and endothelial constructs are housed.
    reference: doi:10.1002/bit.26871
  - snippet: >-
      Importantly, we describe that in the current version of this platform,
      HCT116 CRC cells preferentially home to the liver and lung constructs; the
      corresponding organs of which CRC metastases arise the most in human
      patients.
    reference: doi:10.1002/bit.26871
- description: >-
    Drug screening and microenvironment manipulation: the platform allows
    chemical modulation of hydrogel mechanical properties and administration of
    chemotherapeutic agents, with the effects on invasive tumour migration
    evaluated under flow.
  source_urls:
  - https://doi.org/10.1002/bit.25950
  supporting_references:
  - doi:10.1002/bit.25950
  quotes:
  - snippet: >-
      we demonstrated the ability to manipulate the system, including chemically
      modulating the hydrogel system mechanical properties and administering
      chemotherapeutic agents, and evaluated the effects of these parameters on
      invasive tumor migration.
    reference: doi:10.1002/bit.25950
- description: >-
    In the precursor static liver-tumour hybrid organoid (Skardal et al. 2015),
    colon carcinoma cells acquired a mesenchymal/metastatic phenotype only once
    transferred from 2D into the 3D liver organoid, and WNT-pathway modulation
    changed their sensitivity to the chemotherapeutic 5-fluorouracil, serving as
    a model for metastatic tumour growth and drug response.
  source_urls:
  - https://pubmed.ncbi.nlm.nih.gov/25777294/
  supporting_references:
  - pmid:25777294
  quotes:
  - snippet: >-
      In 2D they displayed an epithelial phenotype, and only after transition to
      the organoids did the cells present with a mesenchymal phenotype.
    reference: pmid:25777294
  - snippet: >-
      Manipulating the WNT pathway with an agonist and antagonist showed
      significant changes in sensitivity to the anti-proliferative drug
      5-fluoruracil.
    reference: pmid:25777294
limitations:
- description: >-
    An early-stage model that reproduces only some characteristics of human
    metastasis: the authors present the two-chamber device as modelling several
    important characteristics of metastasis rather than the full process.
  source_urls:
  - https://doi.org/10.1002/bit.25950
  supporting_references:
  - doi:10.1002/bit.25950
  quotes:
  - snippet: >-
      These results describe the capability of this early stage metastasis‐on‐a‐chip
      system to model several important characteristics of human metastasis,
      thereby demonstrating the potential of the platform for making meaningful
      advances in cancer investigation and drug discovery.
    reference: doi:10.1002/bit.25950
    note: >-
      The authors' own framing of the 2016 device as an early-stage model of
      selected metastatic characteristics.
- description: >-
    Both the tumour and the host liver tissue are transformed human cell lines
    rather than primary cells: the tumour is the HCT-116 colon carcinoma line,
    and the precursor system's liver construct used the HepG2 hepatoma line
    chosen as a liver mimetic, which limits physiological fidelity of the host
    tissue.
  source_urls:
  - https://pubmed.ncbi.nlm.nih.gov/25777294/
  supporting_references:
  - pmid:25777294
  quotes:
  - snippet: >-
      For this particular model, HepG2 hepatoma cells were chosen to act as a
      liver mimetic
    reference: pmid:25777294
- description: >-
    Not every metastasis-on-a-chip configuration incorporates an endothelial
    barrier between the circulating compartment and the tissue constructs; the
    review notes this gap across bioprinted tumour organ-on-a-chip models, so
    intravasation and extravasation across a vascular barrier are not captured
    by versions that omit an endothelial construct.
  source_urls:
  - https://doi.org/10.1557/s43577-023-00559-8
  supporting_references:
  - doi:10.1557/s43577-023-00559-8
- description: >-
    Evidence from the two primary chip papers (Skardal et al. 2016,
    doi:10.1002/bit.25950; Aleman & Skardal 2019, doi:10.1002/bit.26871) rests
    on their abstracts only, which are all that could be cached; the full texts
    were not available. The review (Anderson et al. 2023,
    doi:10.1557/s43577-023-00559-8) is free to read but not openly licensed, so
    its full text was read on the publisher page and cannot be cached — only its
    abstract is quotable. The precursor liver-tumour organoid paper (Skardal et
    al. 2015, pmid:25777294) was available as full text.
  source_urls:
  - https://doi.org/10.1557/s43577-023-00559-8
  supporting_references:
  - doi:10.1002/bit.25950
  - doi:10.1002/bit.26871
  - doi:10.1557/s43577-023-00559-8
