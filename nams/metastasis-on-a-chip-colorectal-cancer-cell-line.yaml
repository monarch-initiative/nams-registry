model:
  id: metastasis-on-a-chip-colorectal-cancer-cell-line
  type: OrganOnChip
  name: Metastasis-on-a-chip (colorectal cancer cell line)
  description: >-
    A microfluidic "metastasis-on-a-chip" platform developed by the Skardal
    laboratory, in which a tumour construct is connected by recirculating fluid
    flow to one or more downstream healthy-tissue constructs, so that
    fluorescently labelled tumour cells can be tracked as they leave the primary
    site, enter circulation, and colonise the downstream organs. Tumour and host
    tissues are biofabricated in hyaluronic-acid/gelatin hydrogels. In the
    two-chamber version (Skardal et al. 2016), red-fluorescent HCT-116
    colorectal carcinoma cells seeded in a gut construct disseminate under flow
    to a downstream liver construct; the system responds to hydrogel-stiffness
    modulation and to chemotherapeutic agents. In the multi-site version (Aleman
    & Skardal 2019), a colorectal cancer (CRC) organoid in a single upstream
    microfluidic chamber is connected to multiple downstream chambers housing
    liver, lung, and endothelial constructs built by 3D photopatterning, and
    HCT116 CRC cells preferentially home to the liver and lung constructs — the
    organs to which human CRC most often metastasises. The platform is reviewed
    as an organ-on-a-chip cancer model in Anderson et al. 2023 (Figure 3c).

    The static liver-tumour hybrid-organoid system of Skardal et al. 2015
    (doi:10.1007/s10439-015-1298-3) is the conceptual precursor: HepG2
    hepatoma cells and RFP-labelled HCT-116 colon carcinoma cells were
    co-cultured in hyaluronic-acid/gelatin microcarriers in a rotating-wall-
    vessel bioreactor to form liver organoids carrying colon-carcinoma tumour
    foci, and the tumour cells shifted from an epithelial phenotype in 2D to a
    mesenchymal/metastatic phenotype inside the organoid. That system has no
    microfluidic device and no gut-to-liver flow; it is a single combined
    organoid rather than connected chambers, so it may warrant its own record
    (NAMO Organoid rather than OrganOnChip). It is described here as the
    precursor to the chip rather than curated separately.
  biological_organization_level: ORGAN
  spatial_context: >-
    A circulatory microfluidic device of separate chambers connected in series
    by fluid flow: an upstream tumour/gut construct (colorectal cancer cells)
    and one or more downstream healthy-tissue constructs (liver, and in the
    multi-site version lung and endothelium), each a 3D hydrogel construct.
  complexity_level: HIGH
  organ_modeled:
    id: UBERON:0001155
    name: colon
  cell_types:
  - id: CL:0002253
    name: epithelial cell of large intestine
  - id: CL:0000182
    name: hepatocyte
  - id: CL:0000115
    name: endothelial cell
  cell_source: >-
    Human cancer cell lines and biofabricated host-tissue constructs: HCT-116
    red-fluorescent-protein-labelled colorectal carcinoma cells as the tumour,
    with liver (HepG2 hepatoma in the precursor system), lung, and endothelial
    constructs as downstream host tissues.
  perfusion_system: >-
    A circulatory device of chambers connected in series by recirculating fluid
    flow, which carries tumour cells from the primary construct into circulation
    and on to the downstream constructs. Two chambers (gut and liver) in Skardal
    et al. 2016; a single upstream microfluidic chamber connected to multiple
    downstream chambers (liver, lung, endothelium) in Aleman & Skardal 2019.
