model:
  id: intestinal-organoid-suspension-adult-tissue
  type: Organoid
  name: Intestinal organoids in dilute-Matrigel suspension culture
  description: An alternative, dome-free format in which intestinal organoids grow suspended in dilute
    Matrigel, enabling both scale-up and scale-down beyond the limits of dome culture. Morphology of organoids
    from ileum, duodenum and colon in suspension is compared directly with embedded dome culture at day
    7, and seeding densities from 3,000 to 50,000 fragments per 5 mL suspension are shown. Each well of
    a 6-well suspension plate yields at least as many organoids as 18 wells of a 24-well dome plate (1800-2400
    organoids).
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0000160
    name: intestine
  cell_types:
  - id: CL:0002250
    name: intestinal crypt stem cell
  - id: CL:0000584
    name: enterocyte
  - id: CL:0000160
    name: goblet cell
  - id: CL:0000164
    name: enteroendocrine cell
  cell_source: adult tissue
  differentiation_method: Intestinal organoid fragments are generated by passaging from Matrigel dome
    cultures (or from an existing suspension culture) with Gentle Cell Dissociation Reagent and trituration
    in ice-cold DMEM with 1% BSA, counted, and resuspended in medium containing 5% v/v Matrigel rather
    than being embedded in a dome. An earlier IntestiCult Organoid Growth Medium (Human) version of the
    protocol instead resuspends fragments in 500 uL cold undiluted Matrigel, which is pipetted into medium
    in an ultra-low adherent plate where it solidifies and remains suspended.
  culture_system: Static suspension in 5% Matrigel, scalable from 96-well plates to 24-, 12- and 6-well
    plates and T25 or T75 flasks; larger plates and flasks coated with Anti-Adherence Rinsing Solution
    (96-well and Organoid Culture Plates deliberately not coated so organoids adhere gently for medium
    changes). Full medium change with Balance medium every 2-3 days; passaged when organoids are fully
    matured at 5-8 days. Optimized for IntestiCult Plus. The earlier IntestiCult OGM (Human) version uses
    6-well ultra-low adherent plates with half-medium changes every 2-3 days for up to 7 days.
  references:
  - id: doi:10.1016/j.isci.2026.117654
    title: Proteomic and functional profiling of suspended jejunal enteroids reveals pharmacokinetic fidelity
      to native intestine
