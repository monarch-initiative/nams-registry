  name: Homo sapiens
applications:
- description: Large-scale expansion, higher throughput and improved operational efficiency, for screening-based
    studies, assay development in smaller well formats, and designs where Matrigel domes are not practical.
  source_urls:
  - https://www.stemcell.com/intestinal-organoid-scale-up-suspension-culture.html
- description: Generating the large organoid numbers needed to seed many organoid-derived monolayers or
    96-well plates, reducing the hands-on work for high-throughput drug screening.
  source_urls:
  - https://www.stemcell.com/intestinal-organoid-suspension-culture-protocol.html
  - https://www.stemcell.com/how-to-generate-human-intestinal-organoid-derived-monolayers-using-intesticult.html
limitations:
- description: 'Stated as a workaround for an acknowledged constraint of the standard format: organoids
    must be grown within an extracellular matrix such as Matrigel, which makes working with larger numbers
    of organoids labour intensive.'
  source_urls:
  - https://www.stemcell.com/intestinal-organoid-suspension-culture-protocol.html
- description: 'Handling constraints: organoid cultures with thicker epithelia need more triturations;
    some organoids remain loosely adherent to the well or flask bottom during medium changes even when
    anti-adherence solution is used; cultures in the older IntestiCult OGM (Human) version can be maintained
    only up to 7 days.'
  source_urls:
  - https://www.stemcell.com/intestinal-organoid-scale-up-suspension-culture.html
  - https://www.stemcell.com/intestinal-organoid-suspension-culture-protocol.html
- description: Still an epithelium-only, matrix-dependent 3D culture; it inherits the limitations of the
    parent adult-tissue organoid system, including the closed lumen and the HUB research-use-only licence.
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
