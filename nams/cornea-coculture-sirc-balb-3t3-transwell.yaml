model:
  id: cornea-coculture-sirc-balb-3t3-transwell
  type: CoCulture
  name: SIRC / BALB-3T3 two-layer corneal co-culture on Transwell
  description: >-
    A two-layer co-culture built to resemble the epithelial-fibroblast interaction
    of corneal tissue: SIRC rabbit corneal cells over a BALB/3T3 clone A31 mouse
    fibroblast feeder, on a porous Transwell insert, seeded in both in-contact and
    non-contact configurations. It is the ocular arm of a paired comparison against
    the SIRC monolayer (cornea-monolayer-sirc-cell-line). For this construct the
    abstract reports that the non-contact seeding was more PM-resistant than the
    in-contact seeding. It is doubly mixed-species — a rabbit epithelial layer over a
    mouse feeder — and so the sharpest case for the open question of how a single
    species and fidelity descriptor should apply to a multi-species construct.
    Recorded in the registry from the primary paper, Guerra-Flórez et al. 2023
    (doi:10.1016/j.tox.2023.153685), in the Toxicology special issue "New approach
    methodologies: from conceptual development to regulatory application". Only the
    abstract was retrievable, so this record is bounded to what it reports.
  biological_organization_level: CELLULAR_NEIGHBORHOOD
  coculture_configuration: TRANSWELL
  cell_types:
  - id: CL:0000575
    name: corneal epithelial cell
  - id: CL:0000057
    name: fibroblast
  cell_source: >-
    SIRC (Statens Seruminstitut Rabbit Cornea) rabbit corneal cells over a BALB/3T3
    clone A31 mouse embryonic fibroblast feeder layer. The construct is doubly
    non-human: a rabbit epithelial layer and a mouse feeder. The SIRC cell-type
    binding is provisional, as the line's epithelial-versus-fibroblastic identity is
    debated.
  culture_conditions: >-
    Two-cell-layer construct on a porous Transwell insert, seeded in both in-contact
    and non-contact configurations, with a BALB/3T3 clone A31 feeder layer. Exposed
    to coarse and fine PM extracts at 1, 2 and 5 mg/mL, with viability read at 24
    hours by MTT. Finer detail is in the full text, which was not retrievable here.
  references:
  - id: doi:10.1016/j.tox.2023.153685
    title: 'In vitro toxicity of fine and coarse particulate matter on the skin, ocular
      and lung microphysiological cell-culture systems.'
    authors:
    - Guerra-Flórez DY
    - Valencia-Osorio LM
    - Zapata-González AF
    - Álvarez-Láinez ML
    - Cadavid-Torres E
    - Meneses-Ramírez EA
    - Torres-Osorio V
    - Botero-Valencia JS
    - Pareja-López A
    journal: Toxicology
    year: 2023
    url: https://doi.org/10.1016/j.tox.2023.153685
species:
- id: NCBITaxon:9986
  name: Oryctolagus cuniculus
- id: NCBITaxon:10090
  name: Mus musculus
applications:
- description: >-
    Cytotoxicity screening of airborne particulate matter in a two-layer corneal
    architecture. The paper reports multilayer models as more PM-resistant than
    monolayers across the models tested, and for this construct reports non-contact
    seeding as more PM-resistant than in-contact.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
- description: >-
    A test bed for whether seeding configuration changes a PM cytotoxicity call: for
    SIRC the non-contact and in-contact seedings gave different resistance, a
    property of the test system rather than of the biology.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
limitations:
- description: >-
    The only endpoint is MTT viability at 24 hours, an apical measure of cell death
    that identifies no mechanism. The abstract proposes possible epithelial-fibroblast
    interactions rather than measuring any.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
- description: >-
    Doubly mixed-species construct: a rabbit SIRC epithelial layer over a mouse
    BALB/3T3 feeder, with no human layer at all. A single species or fidelity
    descriptor cannot describe a construct whose two layers come from two non-human
    species.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
- description: >-
    Abstract-only record. The full text was not retrievable in the curation
    environment, so quantitative dose-response, replicate structure and PM
    characterisation are not captured here.
