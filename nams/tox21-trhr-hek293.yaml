model:
  id: tox21-trhr-hek293
  name: TOX21_TRHR_HEK293
  description: TOX21_TRHR_HEK293 assay is a cell-based assay, single-readout assay that uses
    HEK293T, a human kidney cell line, with measurements taken at 24 hours after chemical
    dosing in a 1536-well plate. It has the potential to screen G protein-coupled receptors.
    A compound/drug can either activate (agonist) or suppress (antagonist) GPCRs that can
    be monitored by levels of intracellular calcium. Using this assay, the Tox21 10K compound
    library was screened to identify potential TRHR agonists. See tox21-trhr-hek293-p1.
  description_scope: METHOD
