model:
  id: immune-enhanced-tumor-organoid-tumor-tissue
  type: CoCulture
  name: Immune-enhanced patient-derived tumor organoids (iPTOs)
  description: >-
    Patient-derived tumor organoids (PTOs) into which immune cells from the
    same patient are mixed, so that a patient's tumour, stroma and immune
    system are screened together against immunotherapies. Unsorted,
    non-expanded cells from an enzymatically digested surgical tumour
    specimen are combined with cells from a lymph node of the same patient
    (node-enhanced iPTOs) or, where no node is available, with peripheral
    blood mononuclear cells (blood iPTOs), suspended in a photo-crosslinkable
    hyaluronic acid/collagen hydrogel and formed into 5 uL organoid droplets.
    Tumour-only PTOs from the same specimen are run in parallel as the
    non-immune-enhanced comparator. After about 7 days in culture the
    organoids are treated for 72 h with checkpoint inhibitors (pembrolizumab,
    nivolumab, ipilimumab) and, in parallel, targeted or chemotherapy agents,
    and response is read by ATP-based viability, LIVE/DEAD imaging, LDH
    release and immunohistochemistry. Reported by the Votanopoulos and
    Skardal groups (Wake Forest) for stage III/IV melanoma (Votanopoulos et
    al. 2020) and Merkel cell carcinoma (Forsythe et al. 2022), and reviewed
    in Anderson et al. 2023 (doi:10.1557/s43577-023-00559-8), which presents
    immune-enhanced PTOs as organoids imbued with immune cells from lymph
    nodes or other immune-rich tissue of the same patient, for testing
    checkpoint inhibitors and cell therapies. The NAMO class mirrors the
    related colorectal-cancer-organoid-t-cell-coculture-tumor-tissue record
    (CoCulture); the cells are encapsulated in a hydrogel droplet rather than
    self-organising, and the two cell populations are in direct contact. The
    tumour-only platform used for chemotherapy screening is recorded
    separately as hyaluronan-collagen-tumor-organoid-tumor-tissue.
  biological_organization_level: TISSUE
  complexity_level: MODERATE
  spatial_context: >-
    Mixed tumour/immune organoid: unsorted tumour cells with their stroma and
    tumour-infiltrating leucocytes, plus patient-matched lymph node cells or
    PBMCs, dispersed in a 5 uL hyaluronic acid/collagen hydrogel droplet.
  cell_types:
  - id: CL:0001064
    name: malignant cell
  - id: CL:0000084
    name: T cell
  - id: CL:0000492
    name: CD4-positive helper T cell
  - id: CL:0000910
    name: cytotoxic T cell
  - id: CL:0000145
    name: professional antigen presenting cell
  - id: CL:2000001
    name: peripheral blood mononuclear cell
  - id: CL:0000499
    name: stromal cell
  cell_source: tumor tissue
  coculture_configuration: DIRECT_CONTACT
  interaction_mechanisms:
  - >-
    Checkpoint-inhibitor-dependent killing of tumour cells by patient-matched
    T cells within the organoid, read as loss of viability relative to the
    matched tumour-only PTO and as granzyme B staining.
  - >-
    Presentation of tumour antigens by lymph-node-derived antigen-presenting
    cells (MHC class I and II), proposed by Votanopoulos et al. as the
    advantage of node-enhanced over PBMC-enhanced organoids.
  culture_conditions: >-
    Melanoma (Votanopoulos et al. 2020): tumour and lymph node specimens
    minced and digested in collagenase/hyaluronidase, red cells lysed;
    thiolated HA (Glycosil) and methacrylated collagen mixed 3:1 by volume
    with photoinitiator; unsorted cells at 10 million cells/mL; 5 uL droplets
    pipetted into PDMS-coated 48-well plates and UV-crosslinked (365 nm, 1 s);
    DMEM with 10% FBS, 1% penicillin-streptomycin, 1% L-glutamine; lymph node
    cells added 1:1 to tumour cells, or Ficoll-isolated PBMCs where no node
    was available; 75-100 organoids per specimen, split between PTOs and
    iPTOs; drugs from day 7 for 72 h (pembrolizumab, nivolumab, ipilimumab
    100 nM; dabrafenib 40 uM with trametinib 2 uM; cisplatin when yield
    allowed); histology on day 10. Merkel cell carcinoma (Forsythe et al.
    2022): digestion with collagenase HA, protease and DNase; thiol-modified
    hyaluronan/heparin (Heprasil) with 3 mg/mL methacrylated collagen
    (PhotoCol) in a 1:3 volume ratio at 10 million cells/mL; 5 uL droplets in
    96-well non-tissue-culture plates, UV-crosslinked; DMEM-F12 with 5% FBS,
    EGF 50 ng/mL and Y-27632 10 uM; immune cells from blood or lymph node
    combined with tumour cells at 3:1-5:1 according to cell yield; 7 days of
    culture, then 72 h of treatment (checkpoint inhibitors at 100 nM on iPTOs
    and PTOs in parallel; cisplatin, doxorubicin, vincristine, etoposide and
    combinations on PTOs); results within 10 days of surgery. Optionally the
    organoids can be integrated into microfluidic devices.
  references:
  - id: pmid:31858299
    title: 'Model of Patient-Specific Immune-Enhanced Organoids for Immunotherapy Screening:
