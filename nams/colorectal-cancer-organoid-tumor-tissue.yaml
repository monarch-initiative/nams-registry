  name: Homo sapiens
applications:
- description: 'Dose-dependent drug sensitivity testing: CRC organoids from four donors were treated with
    increasing concentrations of 5-FU, flavopiridol, gefitinib or irinotecan for 5 days alongside organoids
    from a healthy colon donor, with viability read on day 7 by CellTiter-Glo.'
  source_urls:
  - https://www.stemcell.com/products/intesticult-ogm-human-basal-medium.html
- description: Studying cancer biology, disease progression, affected signaling pathways and the niche
    requirements of the tumor; also preclinical high-throughput drug screening, target validation and
    predictive toxicology as part of new approach methodologies.
  source_urls:
  - https://www.stemcell.com/culturing-intestinal-cancer-derived-organoids.html
  - https://www.stemcell.com/culturing-cancer-derived-organoids-using-intesticult-organoid-growth-medium-human.html
  supporting_references:
  - doi:10.1016/j.stem.2016.04.003
- description: Predicting patient-specific treatment outcomes; the drug discovery review states patient-derived
    tumor organoids predicted treatment response in more than 80% of metastatic colorectal cancer patients
    treated with irinotecan-based chemotherapy (accuracy 80%), that patient-derived rectal cancer organoids
    predicted chemoradiation response using organoid size as the readout (accuracy 84.43%, sensitivity
    78.01%, specificity 91.97%), and that organoids from metastatic gastrointestinal cancers predicted
    response to targeted agents or chemotherapy in clinical trials (sensitivity 100%, specificity 93%).
  source_urls:
  - https://www.stemcell.com/improving-drug-discovery-with-organoids.html
  supporting_references:
  - doi:10.1126/scitranslmed.aay2574
  - doi:10.1016/j.stem.2019.10.010
  - doi:10.1126/science.aao2774
- description: Paired healthy/tumor comparison from the same patient, enabling evaluation of the disease
    state while controlling for the donor's genetic background, and correlation of organoid phenotype
    with specific mutation combinations (APC, KRAS, SMAD4, TP53); CRISPR/Cas9 editing of normal human
    intestinal organoids has also been used to model the adenoma-carcinoma sequence.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/intestinal-research/mini-review.html
  supporting_references:
  - doi:10.1038/nature14415
  - doi:10.1038/nm.3802
- description: Supporting immune co-culture systems, enabling study of tumor-T cell interactions for immunotherapy
    research, and activating and expanding tumor-reactive T cell populations.
  source_urls:
  - https://www.stemcell.com/culturing-cancer-derived-organoids-using-intesticult-organoid-growth-medium-human.html
  - https://www.stemcell.com/culturing-intestinal-cancer-derived-organoids.html
  supporting_references:
  - doi:10.1016/j.cell.2018.07.009
limitations:
- description: 'Restricted to Wnt-independent tumors: tumors that do not carry an activating mutation
    of the Wnt pathway cannot be maintained as organoids using this method.'
  source_urls:
  - https://www.stemcell.com/culturing-cancer-derived-organoids-using-intesticult-organoid-growth-medium-human.html
- description: Cancer heterogeneity means a single medium composition does not fit all samples; because
    some colon cancers carry Wnt pathway mutations, the medium composition required may differ from what
    is currently known and from what the standard human medium was designed for.
  source_urls:
  - https://www.stemcell.com/human-intestinal-organoid-faqs.html
- description: 'Processing is harder than for healthy tissue: tumor biopsies are generally tougher and
    may need physical breaking up with a scalpel or razor and longer Gentle Cell Dissociation Reagent
    incubation than the standard protocol specifies.'
  source_urls:
  - https://www.stemcell.com/human-intestinal-organoid-faqs.html
- description: 'Morphology and differentiation are limited and donor dependent: CRC organoids in IntestiCult
    Plus Basal Medium are dense and lack a defined single-cell columnar epithelium, with MUC2 present
    but no identifiable goblet cells or other specialized cell types; across donors some lines are polarized
    with hollow lumens while others are dense and unpolarized.'
  source_urls:
  - https://www.stemcell.com/products/intesticult-plus-organoid-growth-media.html
  - https://www.stemcell.com/products/intesticult-ogm-human-basal-medium.html
- description: 'Slow establishment from single cells: primary colon cancer organoids seeded as single
    cells need ROCK inhibitor until established and take longer to reach maturity than cultures seeded
    as fragments.'
  source_urls:
  - https://www.stemcell.com/human-intestinal-organoid-faqs.html
- description: Research-use-only HUB licence restriction applies, excluding commercial drug screening,
    equipment validation and biobanking without a further licence.
  source_urls:
  - https://www.stemcell.com/products/intesticult-ogm-human-basal-medium.html
