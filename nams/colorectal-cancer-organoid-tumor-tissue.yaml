model:
  id: colorectal-cancer-organoid-tumor-tissue
  type: Organoid
  name: Colorectal cancer-derived organoids (tumoroids)
  description: Patient-derived tumor organoids from colorectal cancer tissue, presented as retaining the
    tissue architecture, cellular heterogeneity and morphology of the original tumor and the characteristics
    of the tumor of origin. Confocal imaging of organoids from four donors shows donor-specific differences,
    some with polarization and hollow lumens and others as denser structures lacking distinct epithelial
    polarization. The protocol was developed in collaboration with Hubrecht Organoid Technology.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0012652
    name: colorectum
  cell_types:
  - id: CL:0001064
    name: malignant cell
  cell_source: tumor tissue
  differentiation_method: 'Colorectal tumor biopsy tissue is washed in ice-cold PBS, minced with sterile
    scissors into ~5 mm pieces and digested in Gentle Cell Dissociation Reagent at 37 C with rocking for
    60 minutes, then triturated in ice-cold DMEM with 1% BSA and passed through a 70 um strainer before
    plating in Matrigel. Growth uses a Wnt-free formulation: IntestiCult OGM Human Basal Medium (Cat #100-0190)
    mixed 1:1 with DMEM/F-12 with 15 mM HEPES, or IntestiCult Plus Basal Medium alone. The Wnt-free formulation
    selects against Wnt-dependent normal intestinal cells so they do not contaminate the tumoroid culture.'
  culture_system: Matrigel domes in pre-warmed tissue culture-treated 24-well plates (or 24-well Organoid
    Culture Plates, which need no pre-warming); medium replaced every 2 days and cultures passaged every
    6-12 days.
  references:
