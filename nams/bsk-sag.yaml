  name: BSK_SAg
  description: BSK_SAg is a cell-based, multiplexed-readout assay that uses umbilical vein
    endothelium and peripheral blood mononuclear cells, a human vascular primary cell co-culture,
    with measurements taken at 24 hours after chemical dosing in a 96-well plate.
