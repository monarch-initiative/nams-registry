model:
  id: osteoarthritis-zebrafish
  type: AnimalModel
  name: Zebrafish model of osteoarthritis
  description: >-
    A zebrafish model of osteoarthritis (OA), named in the review by Manivong et
    al. 2023 (doi:10.1016/j.drudis.2023.103488) as the small relevant animal
    model for evaluating new OA therapeutic strategies, alongside a large
    (horse) model. Recorded from the abstract alone: the abstract does not say
    how OA arises or is induced in the zebrafish, which joints or life stages
    are used, or what is read out. NAM-adjacent: an animal model, which the
    registry collects alongside non-animal methods.
  description_scope: METHOD
  species:
    id: NCBITaxon:7955
    name: Danio rerio
applications:
- description: >-
    Evaluating new therapeutic strategies for osteoarthritis, as a small
    animal model.
  source_urls:
  - https://doi.org/10.1016/j.drudis.2023.103488
  supporting_references:
  - doi:10.1016/j.drudis.2023.103488
  quotes:
  - snippet: >-
      using either large (horse) or small (zebrafish) relevant animal models to
      evaluate new therapeutic strategies
    reference: pmid:36623796
limitations:
- description: >-
    Abstract-only record. The full text of Manivong et al. 2023 is subscription-
    only and was not available to the curator, so this record holds only what
    the abstract states. How the model is made, the readouts used and its
    fidelity to human osteoarthritis are not captured; seek the full text and
    revisit.
  source_urls:
  - https://doi.org/10.1016/j.drudis.2023.103488
  supporting_references:
  - doi:10.1016/j.drudis.2023.103488
