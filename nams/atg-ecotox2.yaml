model:
  id: atg-ecotox2
  name: ATG_EcoTox2
  description: 'ATG_EcoTox2 is a cell-based, multiplexed assay created by modifying the existing
    Attagene TRANS-FACTORIAL system to include a panel of nuclear receptors from some or all
    the following species: human (Homo sapiens), african clawed frog (Xenopus laevis), rainbow
    trout (Oncorhynchus mykiss), japanese medaka (Oryzias latipes), and zebrafish (Danio rerio).
    The ECOTOX2-FACTORIAL format uses HepG2, a human liver cell line, with measurements taken
    at 24 hours after chemical dosing in a 24-well plate.'
