model:
  id: pancreatic-tumor-organoid-tumor-tissue
  type: Organoid
  name: Pancreatic ductal adenocarcinoma (PDAC) organoids
  description: Long-term, genetically stable cultures of pancreatic tumour epithelium derived from normal
    or diseased donor tissue. PDAC organoid lines can be maintained and expanded in PancreaCult Organoid
    Growth Medium (Human) for at least 10 passages and retain the somatic SNPs and indels in oncogenic
    driver and tumour suppressor genes of the parent line after 5 passages (whole-exome sequencing; in
    one line TP53 reads were undetectable, indicating gene deletion). Lines differ from one another in
    GATA6 expression, morphology and chemotherapy response.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0001264
    name: pancreas
  cell_types:
  - id: CL:0001064
    name: malignant cell
  - id: CL:0002079
    name: pancreatic ductal cell
  cell_source: tumor tissue
  differentiation_method: Organoids are established from dissociated primary PDAC tissue or from cryopreserved
    PDAC cells in PancreaCult Organoid Initiation Medium (Human) and maintained in PancreaCult Organoid
    Growth Medium (Human); pre-established PDAC lines can be transferred directly into Growth Medium.
    Expansion of some lines required reduced (5%) oxygen. Removing EGF from the medium depletes normal
    cells, since KRAS-activated tumour organoids keep growing without EGF for at least 2 passages while
    normal ductal organoids do not. Mouse carcinoma organoids are grown in PancreaCult Organoid Growth
    Medium (Mouse) from ducts isolated from KPC mice (Kras+/LSL-G12D; Trp53+/LSL-R172H; Pdx1-Cre), retaining
    the activated KRAS genotype in culture.
  culture_system: Matrigel domes (40 uL, 24-well) for expansion, with a recommended 1:1 pre-passaging
    step using GCDR digestion 5 - 7 days into culture to remove shed cells and normalize organoid size
    (target 50 - 200 um fragments). For drug screens, 300 organoids per well of a 96-well plate (or per
    384-well) as 2% Matrigel pre-coated layer cultures (recommended) or 6 uL domes; 3 days of drug exposure
    with daily medium changes, readout 24 h after the last treatment (72 h total).
