limitations:
- description: Tumour epithelium only - no stroma, immune or vascular compartment is described, although
    the cited work makes clear the tumour microenvironment contributes cytokines in vivo; the cited cholangiocarcinoma/PDAC
    studies pair organoids with separate cancer-associated fibroblast cultures rather than co-culturing
    them.
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
  - https://www.stemcell.com/improving-drug-discovery-with-organoids.html
- description: 'Culture health degrades within a passage: after 5 - 7 days PDAC organoids often show an
    accumulation of shed cells and become variable in size, so a 1:1 pre-passaging step is recommended
    before drug assays.'
  source_urls:
  - https://www.stemcell.com/drug-screening-with-human-pancreatic-organoid-cultures.html
- description: 'Assay conditions are not transferable between lines or compounds: drug efficacies and
    toxicities vary widely with the drug, its delivery and the organoid line (normal or diseased), so
    dilution ranges and exposure times must be optimized empirically, and daily medium changes are needed
    to limit drug degradation and culture decline.'
  source_urls:
  - https://www.stemcell.com/drug-screening-with-human-pancreatic-organoid-cultures.html
- description: 'Some lines need non-standard conditions: one PDAC line''s expansion was facilitated by
    reduced (5%) oxygen culture and maintenance in the absence of EGF.'
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
- description: 'Licence restriction: PancreaCult media are research use only under the HUB licence, and
    purchase does not include the right to use them for drug screening aiming for commercial gain, equipment
    validation or biobanking - a direct constraint on the commercial precision-medicine and screening
    uses the pages describe.'
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
