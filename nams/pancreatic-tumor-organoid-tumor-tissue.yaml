applications:
- description: Efficacy and toxicity testing of candidate therapeutics with dose-response curves and IC50
    values; STEMCELL shows line-specific differences in response to irinotecan and 5-fluorouracil in both
    layer and dome formats, in 96-well and 384-well plates.
  source_urls:
  - https://www.stemcell.com/drug-screening-with-human-pancreatic-organoid-cultures.html
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
- description: 'Precision medicine: the protocol page states patient-derived PDAC organoids have been
    shown to predict chemotherapy sensitivity in pancreatic cancer patients, making them a model for advancing
    precision medicine.'
  source_urls:
  - https://www.stemcell.com/drug-screening-with-human-pancreatic-organoid-cultures.html
- description: Pancreatic cancer biology, including KRAS-driven metabolic reprogramming, marker discovery
    and modelling of pancreatic carcinomas from genetically engineered KPC mice.
  source_urls:
  - https://www.stemcell.com/products/pancreacult-organoid-media-human.html
  - https://www.stemcell.com/products/pancreacult-organoid-growth-medium-mouse.html
