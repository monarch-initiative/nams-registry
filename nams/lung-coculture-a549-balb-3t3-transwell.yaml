model:
  id: lung-coculture-a549-balb-3t3-transwell
  type: CoCulture
  name: A549 / BALB-3T3 two-layer lung co-culture on Transwell
  description: >-
    A two-layer co-culture built to resemble the epithelial-fibroblast interaction
    of lung tissue: A549 human lung adenocarcinoma epithelium over a BALB/3T3 clone
    A31 mouse fibroblast feeder, on a porous Transwell insert. It was run in two
    seeding configurations, in-contact and non-contact, and is the lung arm of a
    paired comparison against the A549 monolayer
    (lung-monolayer-a549-cell-line). For the A549 arm the abstract reports the
    seeding configuration effect only indirectly: it states the seeding effect
    (non-contact more PM-resistant than in-contact) for the SIRC and HEK001
    constructs, and reports the A549 monolayer as showing the highest viability
    response, without a stated A549 contact-versus-non-contact result. Recorded in
    the registry from the primary paper, Guerra-Flórez et al. 2023
    (doi:10.1016/j.tox.2023.153685), in the Toxicology special issue "New approach
    methodologies: from conceptual development to regulatory application". Only the
    abstract was retrievable, so this record is bounded to what it reports.
  biological_organization_level: CELLULAR_NEIGHBORHOOD
  coculture_configuration: TRANSWELL
  cell_types:
  - id: CL:0000082
    name: epithelial cell of lung
  - id: CL:0000057
    name: fibroblast
  cell_source: >-
    A549 immortalised human lung adenocarcinoma epithelium over a BALB/3T3 clone A31
    mouse embryonic fibroblast feeder layer. The construct is therefore mixed-species:
    a human epithelial layer and a non-human feeder.
  culture_conditions: >-
    Two-cell-layer construct on a porous Transwell insert, seeded in both in-contact
    and non-contact configurations, with a BALB/3T3 clone A31 feeder layer. Exposed
    to coarse and fine PM extracts at 1, 2 and 5 mg/mL, with viability read at 24
    hours by MTT. Finer detail is in the full text, which was not retrievable here.
  references:
  - id: doi:10.1016/j.tox.2023.153685
    title: 'In vitro toxicity of fine and coarse particulate matter on the skin, ocular
      and lung microphysiological cell-culture systems.'
    authors:
    - Guerra-Flórez DY
    - Valencia-Osorio LM
    - Zapata-González AF
    - Álvarez-Láinez ML
    - Cadavid-Torres E
    - Meneses-Ramírez EA
    - Torres-Osorio V
    - Botero-Valencia JS
    - Pareja-López A
    journal: Toxicology
    year: 2023
    url: https://doi.org/10.1016/j.tox.2023.153685
species:
- id: NCBITaxon:9606
  name: Homo sapiens
- id: NCBITaxon:10090
  name: Mus musculus
applications:
- description: >-
    Cytotoxicity screening of airborne particulate matter in a two-layer tissue
    architecture. The paper reports multilayer models as more PM-resistant than
    monolayers across the models tested; the A549-specific monolayer-versus-co-culture
    comparison is not resolvable from the abstract, since the A549 monolayer showed
    the highest viability of the formats reported.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
- description: >-
    A test bed for whether tissue architecture and seeding configuration change a PM
    cytotoxicity call relative to a monolayer. For this lung construct the abstract
    does not report a contact-versus-non-contact result; it reports that effect for
    the SIRC and HEK001 constructs.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
limitations:
- description: >-
    The only endpoint is MTT viability at 24 hours, an apical measure of cell death
    that identifies no mechanism. The abstract proposes possible epithelial-fibroblast
    interactions behind the cytotoxic response rather than measuring any.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
- description: >-
    Mixed-species construct: a human A549 epithelial layer over a mouse BALB/3T3
    feeder. A single statement of species or of fidelity to human lung cannot
    describe both layers at once.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
- description: >-
    Abstract-only record. The full text was not retrievable in the curation
    environment, so quantitative dose-response, seeding-configuration detail for the
    A549 arm, replicate structure and PM characterisation are not captured here.
