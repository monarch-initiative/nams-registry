- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: Assessment of drug-induced liver injury (DILI) and hepatotoxicity, and evaluation of human-specific
    metabolic profiles, in a 3D system; the hepatotoxicity screening protocol (96-well, CellTiter-Glo
    3D, IC50) explicitly supports hPSC-derived hepatic organoids as an alternative to tissue-derived ones.
  source_urls:
  - https://www.stemcell.com/products/human-ipsc-derived-hepatic-organoids.html
  - https://www.stemcell.com/performing-toxicity-screening-hepaticult-organoids.html
- description: CYP3A4 and other CYP activity assays (LC-MS or luminescence) and albumin production assays
    as functional readouts of hepatic phenotype, supporting ADME/DMPK and compound evaluation.
  source_urls:
  - https://www.stemcell.com/how-to-detect-cyp-activity-in-human-hepatic-organoids.html
  - https://www.stemcell.com/how-to-detect-albumin-production-in-human-hepatic-organoids.html
- description: Assays modelling drug toxicity, CYP3A4 modulation and cholestasis, presented in an ISSCR
    2025 webinar on STEMdiff Hepatic Organoid Media.
  source_urls:
  - https://www.stemcell.com/isscr-2025-advancing-organoid-models-for-intestinal-and-hepatic-research.html
- description: Developmental biology and disease modelling of the liver, and genome editing, without needing
    primary human liver tissue sourcing.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-hepatic-organoid-media.html
  - https://www.stemcell.com/products/human-ipsc-derived-hepatic-organoids.html
limitations:
- description: 'Fetal/immature starting phenotype: proliferating organoids express the fetal serum protein
    marker AFP, which is only reduced (not eliminated) on differentiation, and some organoid regions retain
    hepatic progenitor/ductal markers AFP and CK19 after differentiation.'
  source_urls:
  - https://www.stemcell.com/products/stemdiff-hepatic-organoid-media.html
- description: 'Establishment efficiency depends on the starting cell stage: Growth Medium supports significantly
    more efficient organoid establishment from HLCs than from HPs (p < 0.0001), which is why HLCs are
    the recommended input.'
  source_urls:
  - https://www.stemcell.com/products/stemdiff-hepatic-organoid-media.html
- description: The overview page states that hepatic organoids differentiated from hPSCs share the drawback
    of lacking the complete functional repertoire of primary hepatocytes, and that hiPSC-derived cells
    are exposed to genetic modification through reprogramming factors and commonly exhibit genomic instability,
    particularly in long-term cultures - a caveat adult tissue-derived stem cells avoid.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/hepatic-research/overview.html
  supporting_references:
  - doi:10.1242/dev.118570
- description: Epithelial only - no immune, stromal or vascular compartment is described, and the general
    organoid review states organoids lack blood vessels and immune cells and do not fully replicate in
    vivo tissue complexity.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-hepatic-organoid-media.html
  - https://www.stemcell.com/improving-drug-discovery-with-organoids.html
- description: 'Multi-week workflow before assays: 2D hepatocyte differentiation takes 10 (HP) to 21 (HLC)
    days, organoid establishment a further 7 - 14 days, then at least one passage before differentiation,
    which itself runs ~10 - 19 days.'
  source_urls:
  - https://www.stemcell.com/products/stemdiff-hepatic-organoid-media.html
  - https://www.stemcell.com/products/human-ipsc-derived-hepatic-organoids.html
- description: Both the media and the cryopreserved organoids are research use only and not intended for
    human or animal diagnostic or therapeutic uses; the cryopreserved organoids are available only in
    select territories. Unlike the HepatiCult products, consent has been given for both academic and commercial
    use of the iPSC-derived organoid product and no HUB licence statement is given.
  source_urls:
  - https://www.stemcell.com/products/human-ipsc-derived-hepatic-organoids.html
  - https://www.stemcell.com/products/stemdiff-hepatic-organoid-media.html
