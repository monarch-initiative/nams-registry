model:
  id: hepatic-organoid-pluripotent-stem-cell
  type: Organoid
  name: Hepatic organoids from human pluripotent stem cells
  description: Liver organoids generated from hPSC-derived hepatic cells rather than from donor liver
    tissue. Proliferating organoids express EPCAM, KI67, CK19, SOX9 and the fetal serum protein AFP; after
    differentiation they express ALB, A1AT, HNF4A, ASGR1, CYP3A4, CPS1, BSEP, and (per RNA-seq) genes
    for phase 1 and 2 drug metabolism (CYP2B6, CYP2C9, CYP3A4, UGT1A1, GSTA1), glucose metabolism (SLC2A2,
    GYS1, G6PC), lipid and cholesterol metabolism (FASN, PLIN2, NR1H3), bile acid synthesis (CYP27A1,
    BAAT) and urea synthesis (OTC, ARG1), with reduced AFP. Retained KRT19 and E-cadherin expression is
    described as indicating a hepatobiliary phenotype. ALB, ASGR1 and CYP3A4 expression after differentiation
    is reported as comparable to primary human hepatocytes. A pre-made cryopreserved version (Human iPSC-Derived
    Hepatic Organoids, from healthy control iPSC lines such as SCTi003-A) is sold.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0002107
    name: liver
  cell_types:
  - id: CL:0000068
    name: duct epithelial cell
  cell_source: pluripotent stem cells
  differentiation_method: hPSCs maintained in mTeSR1, mTeSR Plus or eTeSR are first differentiated in
    2D to hepatic progenitors (HPs, ~day 10) or hepatocyte-like cells (HLCs, ~day 21) with the STEMdiff
    Hepatocyte Kit. HLCs (recommended) or HPs are then mechanically dissociated and replated as fragments
    in Matrigel domes in STEMdiff Hepatic Organoid Growth Medium, giving confluent organoid cultures in
    7 - 14 days. After at least one passage, cultures are switched to STEMdiff Hepatic Organoid Differentiation
    Medium for maturation (gene-expression data reported at day 19 of differentiation; immunofluorescence
    at day 10).
  culture_system: Matrigel domes for establishment and expansion, passaged as fragments every 6 - 8 days
    (6 - 10 days post-thaw for the cryopreserved product); organoids can be cryopreserved as fragments
    with high post-thaw recovery and expanded for at least 9 - 10 passages. Adaptable to 96- and 384-well
    plate assays, suspension cultures, genome editing and 2D organoid-derived monolayers.
