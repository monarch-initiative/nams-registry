model:
  id: tox21-trb-coa-agonist-followup
  name: TOX21_TRB_COA_Agonist_Followup
  description: TOX21_TRb_COA_Agonist_Followup is a secondary assay for specificity for the
    TOX21_TR_GH3_LUC_Agonist assay. The LanthaScreen TR-FRET TR coactivator assay kits were
    used to determine TR activity in a cell-free functional assay. A time-resolved fluorescence
    resonance energy transfer (TR-FRET) signal was indicative of coactivator (SRC-2) recruitment.
