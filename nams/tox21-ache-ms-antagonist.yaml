model:
  id: tox21-ache-ms-antagonist
  name: TOX21_AChE_ms_Antagonist
  description: TOX21_AChE_ms_Antagonist is a cell-free assay that uses recombinant human AChE
    (acetylcholinesterase) mixed with human liver microsomes as a source for enzyme to evaluate
    compounds that need metabolic activation for AChE inhibition, with measurements taken
    30 minutes after compound dosing in a 1536-well plate. See tox21-ms-ache-p2.
  description_scope: METHOD
