model:
  id: airway-epithelium-ali-large-airway-adult-tissue
  type: TwoDCellCulture
  name: Large airway (bronchial and nasal) epithelium at the air-liquid interface
  description: 'The most well-characterized in vitro lung model: primary large airway epithelial cells
    differentiated on a permeable insert with their apical surface exposed to air. The result is a pseudostratified
    columnar epithelium with beating cilia, mucus secretion, tight-junction barrier properties and repair/remodeling
    behaviour like the native human airway, with approximately 20 - 30% basal cells, approximately 50%
    ciliated cells and approximately 5 - 10% goblet cells; rarer cell types such as ionocytes have also
    been reported. Both the apical and basolateral sides are accessible. It is not an organoid, but it
    is presented alongside the airway organoid systems as the alternative format for the same cells.'
  models:
  - biological_system_modeled: UBERON:0002185
  cell_types:
  - id: CL:0002633
    name: respiratory basal cell
  - id: CL:0000067
    name: ciliated epithelial cell
  - id: CL:0002370
    name: respiratory tract goblet cell
  - id: CL:0017000
    name: pulmonary ionocyte
  cell_source: adult tissue
  culture_conditions: 'Primary human bronchial epithelial cells (from bronchial brushings or cadaveric
    donor tissue) or human nasal epithelial cells are expanded in submerged 2D culture in PneumaCult-Ex,
    PneumaCult-Ex Plus (passaged at 50 - 70% confluence) or PneumaCult-NGEx, then seeded on permeable
    inserts and grown submerged in expansion medium for typically 2 - 4 days until 100% confluent. The
    culture is then air-lifted by removing medium from both chambers and feeding PneumaCult-ALI Medium
    to the basal chamber only; apical exposure to air plus basolateral specialized medium drives differentiation
    to a pseudostratified columnar mucociliary epithelium over 21 - 28 days. Transwell-type permeable
    inserts, 0.4 um pore polyester membranes (Costar 6.5 mm #38024 for 24-well, 12 mm #38023 for 12-well;
    HTS Transwell-96 #100-0419 for 96-well high-throughput). Collagen coating is not required. Basal medium
    changed every 2 days; mucus washed off weekly from week 3 (or from 2 weeks at ALI). Differentiated
    cultures have been maintained in-house for up to 5 years.'
  references:
  - id: doi:10.1007/bf02628493
    title: A biphasic chamber system for maintaining polarity of differentiation of culture respiratory
      tract epithelial cells
    authors:
