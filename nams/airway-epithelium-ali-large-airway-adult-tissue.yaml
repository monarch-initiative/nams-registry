  - doi:10.1152/ajplung.00181.2012
- description: 'Electrophysiological assessment of ion channel function in Ussing chambers: baseline short
    circuit current challenged with amiloride (ENaC blocker), IBMX plus forskolin (CFTR activators), genistein
    (CFTR potentiator), CFTRinh-172 (CFTR inhibitor) and UTP (calcium-activated chloride channel activator),
    giving CFTR induction and inhibition measures.'
