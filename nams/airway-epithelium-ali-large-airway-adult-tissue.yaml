limitations:
- description: Limited for use at high-throughput scales; this is given as the drawback of ALI culture,
    against the sphere/organoid formats which need no inserts and are described as attractive for high-throughput
    screening. A miniaturized 96-Transwell format has been published for the small airway model and tested
    in-house for bronchial cells.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/pulmonary-organoids/overview.html
  - https://www.stemcell.com/air-liquid-interface-faqs.html
  supporting_references:
  - doi:10.1038/s41598-020-69948-2
- description: Works for the proximal airway but not the distal airway, likely because of the higher complexity
    of the alveolar stem cell niche and the requirement for stromal cell support for alveolar structure.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/pulmonary-organoids/overview.html
- description: Epithelial cells grown in ALI culture are not passageable, so the culture is an endpoint
    rather than an expandable resource.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/pulmonary-organoids/overview.html
- description: 'Differentiation potential declines with passage of the starting primary cells: in PneumaCult-Ex,
    potential to form ciliated and mucus-producing cells may decline as early as passage 4; with Ex Plus,
    early passage (P3/P4) gives the most optimal morphology and a differentiation assay should not be
    started after P7/P8. Obtaining truly differentiated ALI cultures with optimal morphology and functional
    readouts is described as challenging with primary cells because of their limited expansion and differentiation
    potential.'
  source_urls:
  - https://www.stemcell.com/critical-points-for-culturing-human-bronchial-epithelial-cells-at-air-liquid-interface.html
  - https://www.stemcell.com/air-liquid-interface-faqs.html
  - https://www.stemcell.com/optimization-of-normal-human-bronchial-epithelial-cell-3d-cultures-for-in-vitro-lung-model-studies.html
  - https://www.stemcell.com/products/brands/pneumacult-airway-epithelial-culture.html
- description: 'Procedurally demanding and slow: the submerged culture must reach 100% confluence before
    air-lifting, transitioning cultures under 80% confluent is not recommended, differentiation takes
    21 - 28 days, medium must be changed every 2 days, and accumulated mucus must be washed off weekly.'
  source_urls:
  - https://www.stemcell.com/critical-points-for-culturing-human-bronchial-epithelial-cells-at-air-liquid-interface.html
  - https://www.stemcell.com/air-liquid-interface-faqs.html
- description: Donor variability is expected throughout, and some donors need extended time in the expansion
    phase; collagen coating may improve differentiation for some donors or freshly isolated cells even
    though it is not generally required.
  source_urls:
  - https://www.stemcell.com/air-liquid-interface-faqs.html
  - https://www.stemcell.com/critical-points-for-culturing-human-bronchial-epithelial-cells-at-air-liquid-interface.html
- description: 'Epithelium only as standard: no immune, stromal, endothelial or vascular compartment,
    and no microbiome. The overview text notes the epithelial sheet does not function as an independent
    entity in vivo but as an interdependent unit with mesenchymal cells, endothelial cells and the extracellular
    matrix, and immune cells must be added as a deliberate co-culture.'
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/pulmonary/airway-modeling/overview.html
  - https://www.stemcell.com/airway-immune-cell-coculture-rsv-infection-protocol.html
- description: 'Species coverage is indirect: the manufacturer has not tested murine airway epithelial
    cells in-house, and mouse use rests on third-party publications. Nasal epithelial cells were likewise
    not directly tested in-house at the time of the FAQ.'
  source_urls:
