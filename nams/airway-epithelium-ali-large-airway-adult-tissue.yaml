  - https://www.stemcell.com/products/pneumacult-ngex-medium.html
- description: Pre-clinical testing of CFTR modulators on cells from cystic fibrosis donors, and barrier
    function measurement by transepithelial electrical resistance (TEER), which can be repeated weekly
    without damaging the culture.
