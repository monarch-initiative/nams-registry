  name: ACEA_AR_antagonist
  description: ACEA_AR_antagonist is a cell-based, single-readout assay that uses 22Rv1, a
    human prostate cancer cell line, with measurements taken at 80 hours after chemical dosing
    in a 384-well plate, although TO5 and TO6 (mc0.srcf) used a 96-well plate. Differences
    in plate size can be ignored given data normalization.
