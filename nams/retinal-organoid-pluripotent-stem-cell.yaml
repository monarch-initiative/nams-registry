  type: Organoid
  name: Retinal organoids (optic cup) from pluripotent stem cells
  description: Retinal organoids appear in an LSCN 2022 workshop talk by Dr. Rachael Pearson and in literature
    citations (the landing page names "optic cup" among tissues with organoid systems). STEMCELL lists
    no retinal organoid product.
  three_d_architecture: ORGANOID
