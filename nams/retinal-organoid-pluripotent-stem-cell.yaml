  name: Homo sapiens
applications:
- description: Developing photoreceptor replacement therapy for advanced retinal degeneration, the leading
    cause of untreatable blindness in the developed world.
  source_urls:
  - https://www.stemcell.com/lscn-2022-using-organoids-for-retinal-repair.html
- description: >-
    In vitro modelling of retinal neuron differentiation and retinal disease,
    and a source of photoreceptors and RGCs for replacement-therapy research.
    Single-cell RNA sequencing shows hPSC-derived retinal organoids and
    retinospheres closely resemble human fetal retina in cellular composition
    and gene expression.
  source_urls:
  - https://doi.org/10.3390/ijms241713652
  supporting_references:
  - doi:10.3390/ijms241713652
limitations:
- description: >-
    Single-cell RNA sequencing finds some differences in the developmental
    trajectories of specific cell types, photoreceptors among them, between the
    organoids and human fetal retina: composition is fetal-like but the
    trajectory is not fully matched, and the organoids are developmentally
    immature.
  source_urls:
  - https://doi.org/10.3390/ijms241713652
  supporting_references:
  - doi:10.3390/ijms241713652
- description: >-
    Modelling multifactorial retinal disease such as age-related macular
    degeneration or diabetic retinopathy may require more complicated culture
    conditions, such as co-culture with retinal pigment epithelium or the
    incorporation of a vascular network; a bare organoid omits the
    RPE-vascular-immune interface.
  source_urls:
  - https://doi.org/10.3390/ijms241713652
  supporting_references:
  - doi:10.3390/ijms241713652
