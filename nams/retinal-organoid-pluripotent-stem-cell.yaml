model:
  id: retinal-organoid-pluripotent-stem-cell
  type: Organoid
  name: Retinal organoids (optic cup) from pluripotent stem cells
  description: Retinal organoids appear in an LSCN 2022 workshop talk by Dr. Rachael Pearson and in literature
    citations (the landing page names "optic cup" among tissues with organoid systems). STEMCELL lists
    no retinal organoid product.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0000966
    name: retina
  cell_types:
  - id: CL:0000210
    name: photoreceptor cell
  - id: CL:0002586
    name: retinal pigment epithelial cell
  cell_source: pluripotent stem cells
  differentiation_method: Self-organizing optic-cup morphogenesis in 3D culture (Eiraku 2011, cited);
    neuroepithelial culture from hESCs with conversion to retinal pigment epithelium (Zhu 2013, listed
    under "Retinal Spheroids"). No protocol or product is in the corpus.
  culture_system: Not described in the corpus.
