model:
  id: the-kinetic-direct-peptide-reactivity-assay-kdpra
  type: PeptideReactivityAssay
  name: The kinetic Direct Peptide Reactivity Assay (kDPRA)
  description: >-
    A cell-free, in chemico assay for skin sensitization that extends the DPRA
    into a kinetic reading to assess potency, not just hazard. A test chemical
    is incubated with the synthetic cysteine-containing model peptide across
    several concentrations and several reaction times; the reaction is stopped
    by adding monobromobimane, which forms a fluorescent complex with the
    peptide's remaining free cysteine, and the non-depleted peptide is
    quantified by fluorescence. From the depletion-versus-concentration-and-
    time matrix a kinetic rate constant (log kmax) is derived, and that rate
    constant -- rather than a single depletion value -- is used to separate UN
    GHS sub-category 1A (strong) sensitizers from 1B/not-classified chemicals,
    because protein-reaction rate tracks sensitizer potency. The kinetic
    reading was introduced by Wareing et al. 2017 as a modification of the
    DPRA, its reproducibility established in a seven-laboratory ring trial
    (Wareing et al. 2020) with intra- and inter-laboratory reproducibility of
    96% and 88%, and after independent peer review it was accepted for
    identifying GHS 1A sensitizers. It reads the same molecular initiating
    event as the DPRA (AOP 40, Key Event 396) and is one of the in chemico
    methods of OECD Test Guideline 442C, alongside DPRA and ADRA.
  description_scope: METHOD
  references:
  - id: pmid:32521036
    title: >-
      The kinetic direct peptide reactivity assay (kDPRA): Intra- and
      inter-laboratory reproducibility in a seven-laboratory ring trial.
    journal: ALTEX
    year: 2020
    url: https://doi.org/10.14573/altex.2004291
  - id: pmid:28882705
    title: Prediction of skin sensitization potency sub-categories using peptide reactivity data.
    journal: Toxicol In Vitro
    year: 2017
    url: https://doi.org/10.1016/j.tiv.2017.08.015
  - id: pmid:27070937
    title: Assessment of Pre- and Pro-haptens Using Nonanimal Test Methods for Skin Sensitization.
    journal: Chem Res Toxicol
    year: 2016
    url: https://doi.org/10.1021/acs.chemrestox.6b00055
  - id: pmid:32840629
    title: Predictivity of the kinetic direct peptide reactivity assay (kDPRA) for sensitizer potency assessment and GHS subclassification.
    journal: ALTEX
    year: 2020
    url: https://doi.org/10.14573/altex.2004292
  - id: doi:10.1787/9789264229709-en
    title: 'Test No. 442C: In Chemico Skin Sensitisation'
    url: https://doi.org/10.1787/9789264229709-en
synonyms:
- kDPRA
- kinetic direct peptide reactivity assay
measured_targets:
- name: cysteine-containing synthetic peptide
  measurement: >-
    kinetic rate constant (log kmax) of peptide depletion, from fluorescence
    of remaining free cysteine (monobromobimane) across concentrations and
    reaction times
  notes: >-
    A synthetic model peptide, not a gene product. The kDPRA uses only the
    cysteine peptide; the readout is a rate constant, giving potency rather
    than a hazard call.
applications:
- description: >-
    Potency sub-classification of skin sensitizers without animals:
    identifying UN GHS sub-category 1A (strong) sensitizers from the kinetic
    rate constant of cysteine-peptide depletion. Following peer review the
    kDPRA was accepted for this use, as a stand-alone assay or within a
    defined approach for quantitative potency assessment.
  source_urls:
  - https://doi.org/10.14573/altex.2004291
  supporting_references:
  - pmid:32521036
  quotes:
  - snippet: >-
      Following an independent peer review, the kDPRA was considered to be
      acceptable for the identification of GHS Cat 1A skin sensitizers.
    reference: pmid:32521036
- description: >-
    A continuous potency readout combinable with other in vitro assays in a
    defined approach. Natsch et al. built a database of rate constants for 180
    chemicals and set a threshold of log kmax -2, giving 85% balanced accuracy
    for predicting GHS 1A sensitizers against the local lymph node assay.
  source_urls:
  - https://doi.org/10.14573/altex.2004292
  supporting_references:
  - pmid:32840629
  quotes:
  - snippet: >-
      A threshold of log kmax -2 offers a balanced accuracy of 85% for
      predicting GHS 1A sensitizers according to the local lymph node assay.
    reference: pmid:32840629
limitations:
- description: >-
    No cells, so no xenobiotic metabolism. Like the DPRA and ADRA, the kDPRA
    reads direct protein reactivity and can miss pro-haptens, which become
    protein-reactive only after metabolic activation, and pre-haptens, which
    require abiotic transformation -- the missing-metabolism gap shared by all
    the cell-free peptide-reactivity assays of TG 442C.
  source_urls:
  - https://doi.org/10.1021/acs.chemrestox.6b00055
  supporting_references:
  - pmid:27070937
  quotes:
  - snippet: >-
      In contrast to in vivo methods, they lack or provide limited metabolic
      capacity. For this reason, identification of pro-haptens but also
      pre-haptens, which require molecular transformations to gain peptide
      reactivity, is a challenge for these methods.
    reference: pmid:27070937
- description: >-
    The potency readout is a reaction-rate constant for the molecular
    initiating event, not an apical potency. It is accepted for identifying
    GHS 1A sensitizers, and Natsch et al. propose it as a stand-alone assay
    only among chemicals already identified as sensitizers by other tests or
    defined approaches; otherwise it belongs within a defined approach
    rather than serving as a complete potency assessment on its own.
  source_urls:
  - https://doi.org/10.14573/altex.2004292
  supporting_references:
  - pmid:32840629
  quotes:
  - snippet: >-
      The kDPRA is proposed as a stand-alone assay for identification of GHS
      1A sensitizers among chemicals identified as sensitizers by other tests
      or defined approaches.
    reference: pmid:32840629
