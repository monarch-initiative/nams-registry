applications:
- description: Hepatotoxicity and cytotoxicity screening of compounds in 96-well format, with CellTiter-Glo
    3D viability readouts and IC50 determination; STEMCELL reports differentiated human organoids were
    more sensitive to ketoconazole-, troglitazone- and rifampicin-induced hepatotoxicity than undifferentiated
    organoids, HepG2 cells or primary human hepatocytes. The same workflow supports chronic toxicity testing
    with differentiation for up to 5 weeks and dosing for up to 4 weeks.
  source_urls:
  - https://www.stemcell.com/performing-toxicity-screening-hepaticult-organoids.html
  - https://www.stemcell.com/human-liver-organoid-faqs.html
  - https://www.stemcell.com/products/hepaticult-organoid-kit-human.html
  supporting_references:
  - doi:10.1007/s00204-020-02763-w
- description: Measurement of CYP3A4 activity as a functional readout of drug metabolism, by P450-Glo
    (Luciferin-IPA) luminescence or by LC-MS quantification of 1'-hydroxy midazolam formed from midazolam
    over 24 h; CYP2C9 (tolbutamide to OH-tolbutamide) and CYP2D6 (dextromethorphan to dextrorphan) activity
    are also detectable. Activity increases with time in differentiation medium and is induced by calcitriol
    and inhibited by ketoconazole in a dose-dependent manner.
  source_urls:
  - https://www.stemcell.com/how-to-detect-cyp-activity-in-human-hepatic-organoids.html
  - https://www.stemcell.com/products/hepaticult-organoid-kit-human.html
- description: 'Quantification of secreted and intracellular albumin (ELISA or MSD R-PLEX) as a functional
    marker of hepatic maturation, and as a toxicity endpoint: troglitazone, ketoconazole, rifampicin and
    acetaminophen at high concentrations reduced accumulated secreted albumin alongside reduced viability.'
  source_urls:
  - https://www.stemcell.com/how-to-detect-albumin-production-in-human-hepatic-organoids.html
  - https://www.stemcell.com/products/hepaticult-organoid-kit-human.html
- description: CRISPR-Cas9 gene editing of liver organoids by electroporation of Cas9 ribonucleoprotein
    into single cells dissociated from organoids, replated in Matrigel domes with growth medium plus CloneR2;
    editing efficiency read 7 - 10 days later by T7 endonuclease I assay or flow cytometry (demonstrated
    for B2M knockout across four healthy donor lines).
  source_urls:
  - https://www.stemcell.com/crispr-cas9-genome-editing-of-liver-organoids-using-arcitect-and-hepaticult.html
- description: Disease modelling of inherited liver disease from patient biopsies; the overview page cites
    confirmation of alpha-1-antitrypsin deficiency and Alagille syndrome pathogenesis in human liver organoids,
    and of copper storage disease in canine hepatic organoids.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/hepatic-research/overview.html
  supporting_references:
  - doi:10.1016/j.cell.2014.11.050
  - doi:10.1016/j.stemcr.2015.09.002
- description: Study of liver regeneration, hepatic stem/progenitor cell biology and cellular plasticity
    after injury, including long-term expansion of liver cells that retain physiological features and
    establish cellular polarity and ECM remodelling.
  source_urls:
  - https://www.stemcell.com/organoid-profiles-luigi-aloia.html
  - https://www.stemcell.com/nature-research-round-table-liver-organoids-for-the-study-of-liver-regeneration-and-disease.html
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/hepatic-research/overview.html
  supporting_references:
  - doi:10.1038/nature11826
- description: 'Liver cancer research, including cholangiocarcinoma: product pages cite patient-derived
    organoid work on HSF1 as a target in intrahepatic cholangiocarcinoma and primary liver cancer organoid
    cultures for disease modelling and drug screening.'
  source_urls:
  - https://www.stemcell.com/products/hepaticult-organoid-kit-human.html
  - https://www.stemcell.com/products/brands/hepaticult-organoid-culture-media.html
  supporting_references:
  - doi:10.1038/nm.4438
  - doi:10.1186/s13046-024-03177-7
- description: 'Reduction of animal use: mouse organoid culture is presented as enabling in vitro characterization
    of the hepatic epithelium that "reduces the need for animal use", and cryopreserved mouse hepatic
    organoids remove the need for access to fresh mouse tissue and for duct isolation.'
  source_urls:
  - https://www.stemcell.com/products/hepaticult-organoid-growth-medium-mouse.html
  - https://www.stemcell.com/products/mouse-hepatic-organoids.html
limitations:
- description: Contains only the hepatic epithelium. STEMCELL states it has not looked for non-parenchymal
    cells (sinusoidal, stellate, Kupffer cells) in human hepatic organoids, and the overview notes the
    liver in vivo also contains Kupffer, stromal, stellate and endothelial cells arranged into vasculature
    and biliary tree.
  source_urls:
  - https://www.stemcell.com/human-liver-organoid-faqs.html
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/hepatic-research/overview.html
- description: Only the epithelial compartment of liver disease can be modelled; Dr. Meritxell Huch states
    the pathogenesis of liver and pancreatic disease cannot yet be modelled in full and that mouse models
    are still needed to mimic the fibrosis and inflammation that occur in these diseases.
  source_urls:
  - https://www.stemcell.com/organoid-profiles-meritxell-huch.html
- description: Incomplete hepatocyte function after differentiation. The overview states current differentiation
    protocols yield organoids of which 30-50% fulfil hepatic characteristics, and that these organoids
    resemble primary hepatocytes but lack the complete functional repertoire of that target cell type
    - a drawback shared with hPSC-to-hepatocyte differentiation.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/hepatic-research/overview.html
- description: 'In expansion medium the organoids are ductal/progenitor rather than hepatocyte-like: albumin
    expression is minimal in growth medium, and unlike intestinal organoids liver organoids do not undergo
    spontaneous differentiation during maintenance, so a separate differentiation step is required.'
  source_urls:
  - https://www.stemcell.com/products/hepaticult-organoid-kit-human.html
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/hepatic-research/overview.html
- description: 'Hepatocyte versus cholangiocyte identity after differentiation is not resolved: ductal
    markers are still expressed in differentiation medium (at lower levels than in growth medium), and
    STEMCELL states further characterization is needed to comment on hepatocyte vs cholangiocyte fate
    on a per-organoid or per-cell level.'
  source_urls:
  - https://www.stemcell.com/human-liver-organoid-faqs.html
- description: Donor-to-donor and well-to-well variability. Organoids initiated from different donors
    show morphological heterogeneity; organoid size in growth medium is variable and depends on fragment
    size (30 - 100 um fragments and reversible strainers are recommended to standardize it); differentiation
    parameters, seeding density and albumin/CYP3A4 output must be optimized per donor, and albumin levels
    increase in a donor- and time-dependent manner.
  source_urls:
  - https://www.stemcell.com/human-liver-organoid-faqs.html
  - https://www.stemcell.com/products/hepaticult-organoid-kit-human.html
  - https://www.stemcell.com/how-to-detect-albumin-production-in-human-hepatic-organoids.html
- description: 'Organoid yield from tissue is not predictable: yield is not correlated with tissue sample
    size, "more tissue does not necessarily mean more wells", it depends on digestion efficiency, and
    not every cell or fragment develops into an organoid, so high seeding densities are needed. STEMCELL''s
    own experience is based on 16 human biopsy samples.'
  source_urls:
  - https://www.stemcell.com/human-liver-organoid-faqs.html
- description: Dependence on Corning Matrigel as the matrix for domes, suspension and monolayer coating.
    Interviewees name the design of chemically defined matrices as an outstanding need, and a STEMCELL-hosted
    talk covers engineering organoids using ECM from decellularized tissue.
  source_urls:
  - https://www.stemcell.com/organoid-profiles-luigi-aloia.html
  - https://www.stemcell.com/lscn-2022-engineering-organoids-using-ecm-from-decellularized-tissue.html
  - https://www.stemcell.com/liver-organoid-suspension-culture.html
- description: 'The lumen is enclosed and the culture degenerates if the passage window is missed: organoids
    must be passaged "before the lumen turns dark and collapses". Dome handling is also position-dependent
    - only the 8 central wells of a 24-well plate are recommended, as edge wells are slanted and domes
    flatten.'
  source_urls:
  - https://www.stemcell.com/liver-organoid-single-cell-culture.html
  - https://www.stemcell.com/recovering-cryopreserved-liver-organoids.html
  - https://www.stemcell.com/mouse-hepatic-progenitor-organoid-culture-supplementary-protocols.html
- description: Proliferative organoids harvested from Matrigel for CYP assays tend to fragment, and the
    resulting fragments show CYP activity only in a donor-specific manner.
  source_urls:
  - https://www.stemcell.com/how-to-detect-cyp-activity-in-human-hepatic-organoids.html
- description: 'Licence restriction: the HepatiCult media and cryopreserved Mouse Hepatic Organoids are
    sold for research use only under a licence to intellectual property owned by Hubrecht Organoid Technology
    (HUB). Purchase does not include the right to use them for drug screening aiming for commercial gain,
    equipment validation, biobanking or other commercial purposes; a further licence from HUB is required.'
  source_urls:
  - https://www.stemcell.com/products/hepaticult-organoid-kit-human.html
  - https://www.stemcell.com/products/hepaticult-organoid-growth-medium-mouse.html
  - https://www.stemcell.com/products/mouse-hepatic-organoids.html
- description: 'Mouse organoids are hepatic progenitors with only low expression of mature cell-type genes:
    RNA-seq of organoids in HepatiCult (Mouse) shows markers of hepatic stem and progenitor cells and
    "low levels of genes associated with mature hepatic cell types, including cholangiocytes and hepatocytes";
    maturation requires a published differentiation medium that is not a STEMCELL product.'
  source_urls:
  - https://www.stemcell.com/products/hepaticult-organoid-growth-medium-mouse.html
