model:
  id: liver-organoid-adult-tissue
  type: Organoid
  name: Liver organoids from adult liver tissue
  description: Three-dimensional cultures of a spherical monolayer epithelium grown from stem and progenitor
    cells isolated from adult liver ductal tissue. In growth medium they are proliferating hepatic progenitor/ductal
    organoids that express KI67, EPCAM, HNF4A and SOX9 and can be expanded with "potential for indefinite
    culture" (STEMCELL maintains human cultures to passage 14 - 15). After differentiation, human organoids
    downregulate LGR5, KRT19, KRT7 and SOX9, upregulate ALB, CYP3A4, ASGR1, SERPINA1, UGT1A1, GSTA1, SLC2A2,
    G6PC, CYP27A1, BAAT and OTC, and secrete albumin, produce bile acids and urea, and show CYP3A4 activity.
    Mouse organoids show polygonal morphology, binucleation, MRP4 localized to the organoid exterior (basolateral
    surface distal from the lumen), and express PROM1, AXIN2, SOX9, CD44, KRT19, HNF1B, HNF4A and AFP.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0002107
    name: liver
  cell_types:
  - id: CL:0002195
    name: hepatic stem cell
  - id: CL:0000068
    name: duct epithelial cell
  - id: CL:1000488
    name: cholangiocyte
  - id: CL:0000182
    name: hepatocyte
  cell_source: adult tissue
  differentiation_method: Fresh or cryopreserved liver tissue is enzymatically digested and the ductal
    material (or single cells derived from it) is seeded in extracellular matrix; outgrowth is driven
    by HepatiCult Organoid Initiation Medium (human) or HepatiCult Organoid Growth Medium, which expand
    EPCAM+ bile duct-derived bipotent progenitors as a proliferating, ductal/progenitor-phenotype epithelium
    (LGR5, AXIN2, SOX9, KRT19, KRT7, HNF4A). After 2 - 3 passages in Growth Medium, human cultures can
    be switched to HepatiCult Organoid Differentiation Medium, which withdraws proliferative signals and
    matures the organoids toward hepatocyte-like cells over ~10 - 15 days. For mouse, STEMCELL supplies
    only a growth medium; the pages state mouse hepatic progenitor organoids are "primed for downstream
    differentiation" using published differentiation media rather than a STEMCELL product.
  culture_system: Corning Matrigel domes (typically 30 - 40 uL, 24-well plates) for routine culture; dilute
    Matrigel suspension in ultra-low-adherence 6-well plates on an orbital shaker (80 rpm) or in 100 mL
    spinner flasks (33 rpm) for scale-up; 6 uL domes or Matrigel layers in 96-well plates (or 96-/24-well
    Organoid Culture Plates) for screening. Human organoids are passaged as 30 - 100 um fragments every
    7 - 10 days in domes, 4 - 7 days in dilute Matrigel suspension, and every 10 - 12 days when passaged
    as single cells (5,000 - 15,000 live cells per dome, with Y-27632). Mouse hepatic progenitor organoids
    are ready for passage in 4 - 7 days (domes) or 3 - 6 days (dilute suspension) and appear within 4
    - 5 days of initiation. Organoids can be cryopreserved as fragments at any stage.
