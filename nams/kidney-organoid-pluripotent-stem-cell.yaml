- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: Phenotypic high-throughput screening of nephrotoxic compounds; the kit is tested for compatibility
    with such assays, and a STEMCELL scientific poster covers high-throughput-compatible differentiation
    of hPSC lines to kidney organoids for nephrotoxic drug screening.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-kidney-organoid-kit.html
  - https://www.stemcell.com/scientific-resources/areas-of-interest/drug-discovery-solutions-and-in-vitro-models/cell-sourcing-and-in-vitro-models/organoids-in-drug-discovery/scientific-posters.html
- description: 'Nephrotoxicity dose-response testing: the drug-discovery review cites a kidney organoid-based
    384-well platform that predicted cisplatin-induced nephrotoxic effects dose-dependently using a luminescence
    cell-viability assay with biomarker expression analysis. The CRISPR webinar describes cisplatin and
    gentamicin assays plus dextran uptake as the functional tests that work well in these organoids.'
  source_urls:
  - https://www.stemcell.com/improving-drug-discovery-with-organoids.html
  - https://www.stemcell.com/re-creating-disease-with-kidney-organoids-and-crispr-1.html
  supporting_references:
  - doi:10.1016/j.stem.2018.04.022
- description: 'Genetic disease modelling with CRISPR-Cas9: PKD1-/- and PKD2-/- knockouts (made by NHEJ)
    in hPSCs give organoids that form large cysts in suspension culture while unmodified controls do not,
    with cyst size driven mainly by fluid accumulation and partly by proliferation. Dr. Freedman reports
    the same phenotype across multiple guide RNAs and clones as evidence against off-target causes.'
  source_urls:
  - https://www.stemcell.com/re-creating-disease-with-kidney-organoids-and-crispr-1.html
- description: Kidney developmental biology and disease modelling generally, and immunocytochemical phenotyping
    of renal epithelial, endothelial and mesenchymal markers to compare experimental conditions, including
    presence or absence of a drug or pathogen.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-kidney-organoid-kit.html
  - https://www.stemcell.com/performing-immunocytochemical-staining-of-psc-derived-kidney-organoids.html
- description: 'Infectious disease research: a STEMCELL ISSCR showcase covers organoid applications in
    infectious disease and nephrotoxicity, and the drug-discovery review cites kidney organoids used in
    SARS-CoV-2 studies, including neutralization of infection by a soluble ACE2 variant.'
  source_urls:
  - https://www.stemcell.com/isscr-innovation-showcase-applications-of-organoid-and-organotypic-cultures-in-infectious-diseases-nephrotoxicity-and-highly-relevant-cell-based-assay.html
  - https://www.stemcell.com/improving-drug-discovery-with-organoids.html
  supporting_references:
  - doi:10.1681/asn.2020101537
limitations:
- description: No functional vasculature or filtration. Dr. Freedman states the endothelial cells in the
    organoids do not form bona fide glomeruli even though they lie adjacent to podocytes, "so there is
    clearly something missing"; it is not clear how achievable a bona fide vasculature is in organoids,
    and he suspects it may have to be solved in vivo first.
  source_urls:
  - https://www.stemcell.com/re-creating-disease-with-kidney-organoids-and-crispr-1.html
- description: 'The tubules cannot be perfused: they have no obvious inlets and outlets, so achieving
    filtration with microfluidics is not expected to be easy without an integrated vasculature.'
  source_urls:
  - https://www.stemcell.com/re-creating-disease-with-kidney-organoids-and-crispr-1.html
- description: 'Models the developing nephron rather than the mature kidney: the kit is described as generating
    organoids that model the developing nephron and progress through embryonic intermediate mesoderm/metanephric
    mesenchyme stages, with marker expression only beginning by day 14 of an 18-day protocol.'
  source_urls:
  - https://www.stemcell.com/products/stemdiff-kidney-organoid-kit.html
- description: 'Limited functional readout repertoire: asked about functional tests, Dr. Freedman says
    nephrotoxicity and dextran uptake work well so his group focuses on those, and that others they tried
    were not published "because they haven''t worked".'
  source_urls:
  - https://www.stemcell.com/re-creating-disease-with-kidney-organoids-and-crispr-1.html
- description: 'Matrigel dependence: differentiation starts from hPSCs overlaid with Corning Matrigel,
    and the webinar names examining a range of natural and synthetic matrices as an open question, noting
    matrix choice affects cyst formation.'
  source_urls:
  - https://www.stemcell.com/products/stemdiff-kidney-organoid-kit.html
  - https://www.stemcell.com/re-creating-disease-with-kidney-organoids-and-crispr-1.html
- description: 'Antibody and imaging artifacts complicate phenotyping: the PC2 antibody used gives background
    that persists in PKD2-/- mutants where the protein is absent by Western blot, so staining alone is
    not conclusive.'
  source_urls:
  - https://www.stemcell.com/re-creating-disease-with-kidney-organoids-and-crispr-1.html
- description: 'Input-medium constraint: the kit is optimized for hPSCs previously cultured in mTeSR1,
    and mTeSR Plus-maintained hPSCs are only compatible if mTeSR1 is used for the first three days of
    the protocol.'
  source_urls:
  - https://www.stemcell.com/products/stemdiff-kidney-organoid-kit.html
- description: Research use only and not intended for human or animal diagnostic or therapeutic uses.
    No HUB licence restriction is stated for this kit.
  source_urls:
  - https://www.stemcell.com/products/stemdiff-kidney-organoid-kit.html
