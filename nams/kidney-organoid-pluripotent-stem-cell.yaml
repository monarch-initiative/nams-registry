    journal: Nature Cell Biology
    year: 2014
  - id: doi:10.1016/j.stem.2018.04.022
    title: High-Throughput Screening Enhances Kidney Organoid Differentiation from Human Pluripotent Stem
      Cells and Enables Automated Multidimensional Phenotyping
    authors:
