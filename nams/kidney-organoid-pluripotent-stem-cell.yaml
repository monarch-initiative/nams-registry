model:
  id: kidney-organoid-pluripotent-stem-cell
  type: Organoid
  name: Kidney organoids from human pluripotent stem cells
  description: hPSC-derived organoids that model the developing nephron, forming convoluted tubular structures
    with nephron-like segmentation and containing podocytes (podocalyxin), proximal tubules (lotus tetragonolobus
    lectin), distal tubules (E-cadherin), plus an associated endothelium (CD31) and mesenchyme (vimentin,
    MEIS1/2/3). STEMCELL reports high-efficiency generation from both ES (H1, H9) and iPS (WLS-1C, STiPS-M001)
    lines and lower experimental variability than home-made medium.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0002113
    name: kidney
  cell_types:
  - id: CL:0000653
    name: podocyte
  - id: CL:0002306
    name: epithelial cell of proximal tubule
  - id: CL:1000849
    name: kidney distal convoluted tubule epithelial cell
  - id: CL:0000115
    name: endothelial cell
  - id: CL:0008019
    name: mesenchymal cell
  - id: CL:0000324
    name: metanephric mesenchyme stem cell
  cell_source: pluripotent stem cells
  differentiation_method: A two-stage directed differentiation. hPSCs (previously in mTeSR1, or mTeSR
    Plus provided mTeSR1 is used for the first three days) are plated and overlaid with Corning Matrigel
    to form cavitated spheroids. On day 0 the medium is switched from mTeSR1 to the STEMdiff Kidney Organoid
    Kit, and over 18 days the cells progress through late primitive streak, intermediate mesoderm and
    metanephric mesenchyme stages to self-organize into kidney organoids. Gene expression shifts from
    pluripotency (day 0) to mesoderm (day 1.5 - 4) to intermediate mesoderm/metanephric mesenchyme (day
    4 - 12), with podocyte, proximal and distal tubule, mesenchyme and endothelium markers appearing from
    day 14.
  culture_system: Adherent culture with a Matrigel overlay, in 96- and 384-well plates (organoid number
    per 96-well is quantified on day 18); reproducible in high-throughput formats. The ICC protocol stains
    organoids whole-mount in 96-well plates.
  references:
  - id: doi:10.1038/ncb2894
    title: Directing human embryonic stem cell differentiation towards a renal lineage generates a self-organizing
      kidney
    authors:
