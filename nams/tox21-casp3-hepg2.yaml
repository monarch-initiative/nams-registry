model:
  id: tox21-casp3-hepg2
  name: TOX21_CASP3_HEPG2
  description: 'The TOX21_CASP3_HEPG2 is a cell-based, single-readout assay that uses HepG2,
    a human liver cell line, with measurements taken at 16 hours after chemical dosing on
    a microplate: 1536-well plate. To identify small molecule compounds that induce apoptosis,
    a homogeneous, luminescent Caspase-Glo 3/7 assay was used. HepG2 cells were used to screen
    Tox21 libraries for identifying caspase-3/7 activity inducers. Cytotoxicity of the compounds
    was tested in parallel by measuring the cell viability using CellTiter-Fluor assay system
    in the same wells. See tox21-casp3-hepg2-p1.'
