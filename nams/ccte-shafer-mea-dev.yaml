model:
  id: ccte-shafer-mea-dev
  name: CCTE_Shafer_MEA_dev
  description: CCTE_Shafer_MEA_dev assay is conducted using Axion Biosystems 48 well microelectrode
    array (MEA) plates and Maestro recording system. Each well of the MEA plate contains a
    grid of 16 microelectrodes embedded in the culture surface. Electrically active cells,
    such as neurons, can be cultured over the electrodes, and electrical activity in these
    cells can be recorded extracellularly. The spontaneous firing of neurons is captured from
    each electrode on a microsecond timescale providing both temporally and spatially precise
    data. Because the recordings do not impact the health of the cells, multiple recordings
    can be made from the same neural network over time in culture. The CCTE_Shafer_MEA_dev
    assay uses primary cultures of rat cortical neurons. Recordings are made on days post-plating
    5, 7, 9 and 12. As these cultures mature over time, neural networks develop functional
    activity and form cohesive networks in which electrical activity can be highly coordinated.
  description_scope: METHOD
