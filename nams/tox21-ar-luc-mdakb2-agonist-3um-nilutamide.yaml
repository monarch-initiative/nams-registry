model:
  id: tox21-ar-luc-mdakb2-agonist-3um-nilutamide
  name: TOX21_AR_LUC_MDAKB2_Agonist_3uM_Nilutamide
  description: TOX21_AR_LUC_MDAKB2_Agonist_3uM_Nilutamide is a cell-based, single-readout
    assay that uses MDA-kb2, a human breast cell line, with measurements taken at 24 hours
    after chemical dosing in a 1536-well plate. This is an secondary assay to TOX21_AR_LUC_MDAKB2_Agonist
    for agonist specificity. This particular screening for measuring luciferase reporter gene
    activity using MDA-kb2 cells against Tox21 10K library compounds is a confirmation study
    on agonist mode screening in the presence of AR-antagonist compound (Nilutamide) at 3.0uM
    final concentration. See tox21-ar-mda-kb2-luc-agonist-p3.
