  - id: CL:0000066
    name: epithelial cell
  cell_source: adult tissue
  differentiation_method: Expansion and differentiation of primary human fallopian tube epithelium in
    a serum-free medium in which sex steroids can be adjusted (GyneCult Fallopian Tube Organoid Medium).
    No protocol details are in the corpus.
  culture_system: Not described in the corpus beyond "serum-free" and "sex steroid-modular".
