model:
  id: ccte-glted-hiyd
  type: BiochemicalAssay
  name: CCTE_GLTED_hIYD
  description: CCTE_GLTED_hIYD is a cell-free, single-readout assay that uses human iodotyrosine
    deiodinase (hIYD) enzyme produced with baculovirus-insect cell system. The assay is based
    on iodide release measured by the Sandell-Kolthoff method and is run in 96-well plate
    format with assay plates run in triplicate (n=3) with measurements taken at 3 hours after
    chemical dosing. Platewise-normalization was used based on positive control (3-Nitro-L-tyrosine,
    MNT) and negative/solvent controls (DMSO, NaOH).
  description_scope: METHOD
