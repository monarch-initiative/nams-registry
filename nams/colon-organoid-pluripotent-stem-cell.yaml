model:
  id: colon-organoid-pluripotent-stem-cell
  type: Organoid
  name: hPSC-derived human colonic organoids
  description: Colon (large intestinal) organoids differentiated from hiPSCs, distinct from the small
    intestinal organoids generated from the same kit. They express colon-specific markers including the
    colonic transcription factor SATB2, alpha-carbonic anhydrases CA2 and CA4, goblet cell markers MUC2
    and colon-specific MUC5B, and posterior HOX genes (HOXA10, HOXA13, HOXD13), with downregulation of
    the anterior fore/midgut HOX markers seen in small intestinal organoids from the same lines. Like
    hPSC-derived small intestinal organoids they comprise a polarized epithelial monolayer around a hollow
    lumen with an associated mesenchymal population.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0001155
    name: colon
  cell_types:
  - id: CL:0000160
    name: goblet cell
  - id: CL:0011108
    name: colon epithelial cell
  - id: CL:0008019
    name: mesenchymal cell
  cell_source: pluripotent stem cells
  differentiation_method: 'Human iPSCs are taken through a four-stage process from definitive endoderm
    to posterior hindgut endoderm and then to colonic organoids via transient BMP signaling. Mid/hindgut
    spheroids are generated with the STEMdiff Intestinal Organoid Kit (Cat #05140) and harvested on day
    7/8, embedded at 70-100 spheroids per ~100% Matrigel dome, and cultured in a human colonic organoid
    (HCO) growth medium spiked with 100 ng/mL recombinant BMP2 for the first 3 days, then without BMP2.'
  culture_system: ~100% Matrigel domes in 24-well plates, 0.5 mL HCO growth medium per well, medium changed
    three times per week, passaged into fresh Matrigel every 10-14 days at ~80-100 organoids per dome;
    cultures are fully established by the end of the third passage.
  references:
  - id: doi:10.1016/j.stem.2017.05.020
    title: Differentiation of Human Pluripotent Stem Cells into Colonic Organoids via Transient Activation
      of BMP Signaling
