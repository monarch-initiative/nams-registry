  name: Homo sapiens
applications:
- description: Studying large intestine cell biology, modeling diseases such as colorectal cancer, and
    cytotoxicity screening of novel therapeutics in drug discovery, offered as an alternative to immortalized
    cell lines and animal models that do not represent tumor biology complexity.
  source_urls:
  - https://www.stemcell.com/differentiate-colon-organoids.html
  supporting_references:
  - doi:10.1038/nm.4355
  - doi:10.1038/s41598-020-63151-z
limitations:
- description: Growth declines with extended passaging; the protocol notes a decline in culture growth
    rate after multiple passages, attributed to reduced mesenchymal and stem cell populations.
  source_urls:
  - https://www.stemcell.com/differentiate-colon-organoids.html
- description: ESC/hPSC-derived colon organoid systems are prone to fibroblast overgrowth; IntestiCult
    Plus can support them but STEMCELL recommends the STEMdiff Intestinal Organoid Kit route instead.
  source_urls:
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: The HCO growth medium is assembled by the user from individual components rather than supplied
    as a complete colon-specific differentiation medium; STEMCELL states that for primary patient-derived
    organoids IntestiCult Plus covers both small intestine and colon, while for hPSC-derived systems only
    a publicly available adaptation protocol is offered.
  source_urls:
  - https://www.stemcell.com/differentiate-colon-organoids.html
  - https://www.stemcell.com/the-hidden-variable-in-your-intestinal-organoids-faq.html
- description: Shares the fetal-like maturity limitation of hPSC-derived intestinal organoids, since it
    uses the same upstream mid/hindgut spheroid route.
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/intestinal-research/mini-review.html
