model:
  id: forebrain-dorsal-organoid-pluripotent-stem-cell
  type: Organoid
  name: Dorsal forebrain (cortical) organoids from human pluripotent stem cells
  description: Guided, brain-region-specific organoids representing the early developing human dorsal
    forebrain. Organoids are spherical and of similar size across 11 cell lines. Day 25 and day 50 organoids
    have several cortical-like regions of radially arranged PAX6+ cells surrounded by MAP2+ neurons. With
    longer culture (100-200 days), deep-layer neurons (CTIP2, TBR1) separate further from upper-layer
    neurons (SATB2). Day 50 organoids develop network bursting on MEA.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0014740
    name: dorsal pallium
  cell_types:
  - id: CL:0011020
    name: neural progenitor cell
  - id: CL:0000681
    name: radial glial cell
  - id: CL:0000679
    name: glutamatergic neuron
  cell_source: pluripotent stem cells
  differentiation_method: Directed differentiation with precisely timed small-molecule patterning factors,
    adapted from Pasca's protocols (Birey et al. 2017). hPSCs form embryoid bodies in AggreWell800 microwells
    over 6 days, then grow in suspension and are patterned to the early developing dorsal pallium (FOXG1+,
    PAX6+ progenitors, cortical and glutamatergic neuron genes).
  culture_system: Matrix-free, serum-free suspension culture. Organoids are generated in 43 days, and
    the fusion-free media need no orbital shaking. With AggreWell800, a kit yields 200 or more consistently
    sized organoids. Culture beyond 50 days uses the STEMdiff Neural Organoid Maintenance Kit, and organoids
    have been shown out to days 100-200.
  references:
  - id: doi:10.1038/nature22330
    title: Assembly of functionally integrated human forebrain spheroids
    authors:
    - Fikri Birey
    - Jimena Andersen
    - Christopher D. Makinson
    - Saiful Islam
    - Wu Wei
    - Nina Huber
    - H. Christina Fan
    - Kimberly R. Cordes Metzler
    - Georgia Panagiotakos
