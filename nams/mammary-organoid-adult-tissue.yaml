model:
  id: mammary-organoid-adult-tissue
  type: Organoid
  name: Mammary organoids (multilineage and luminal) from adult tissue
  description: Hormone-responsive mammary organoids from mouse or human primary mammary epithelium that
    keep estrogen receptor (ER) and progesterone receptor (PR) expression, described as the key markers
    that earlier 3D culture systems failed to keep consistently. Mouse organoids derived after EpiCult
    Plus expansion express luminal keratin 8 and basal keratin 14.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0001911
    name: mammary gland
  cell_types:
  - id: CL:0002326
    name: luminal epithelial cell of mammary gland
  - id: CL:0002324
    name: basal-myoepithelial cell of mammary gland
  - id: CL:4033058
    name: luminal hormone-sensing cell of mammary gland
  cell_source: adult tissue
  differentiation_method: Primary mammary epithelial cells are differentiated into multilineage or luminal
    organoids in MammoCult Organoid Kits (serum- and phenol red-free, modular; separate human and mouse
    kits). Alternatively, mouse mammary epithelial cells can first be expanded in 2D in EpiCult Plus Medium
    and then differentiated as organoids.
  culture_system: 3D culture in a reconstituted basement membrane matrix such as Matrigel (general description
    in the mammary review); no timings given in the corpus.
