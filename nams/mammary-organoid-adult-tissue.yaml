applications:
- description: 'Hormone-responsive mammary biology using organoids that keep ER and PR expression (markers
    listed: ER and PR for hormone-responsive luminal cells, MUC1 for luminal cells, smooth muscle actin
    for basal cells).'
  source_urls:
  - https://www.stemcell.com/culturing-mouse-and-human-mammary-organoids-with-mammocult.html
  - https://www.stemcell.com/performing-icc-staining-epithelial-organoids.html
- description: Modeling human mammary epithelial lineages in patient-derived organoid cultures (AACR 2025
    poster title) and expanding mouse mammary epithelial stem cells in serum-free organoid growth (AACR
    2022 poster title).
  source_urls:
  - https://www.stemcell.com/technical-resources/area-of-interest/mammary-research/scientific-posters.html
- description: Growing mammary epithelial cells in a more physiologically relevant format than the mammosphere
    assay, whose spheres often do not recapitulate the morphology of the parental tissue.
  source_urls:
  - https://www.stemcell.com/mammary-stem-cells-and-breast-cancer.html
  supporting_references:
  - doi:10.1016/j.cell.2017.11.010
  - doi:10.1242/dev.145045
limitations:
- description: 'Open challenges stated in the mammary review: standardizing protocols to improve reproducibility
    between labs, propagating the stem cells long-term with a normal karyotype, and keeping tumours so
    that they recapitulate their in vivo counterparts.'
  source_urls:
  - https://www.stemcell.com/mammary-stem-cells-and-breast-cancer.html
- description: Historically, 3D mammary cultures did not consistently produce organoids expressing ER
    and PR; ER+ cells and ER+ tumour cells do not grow in commonly used mammary media. MammoCult Organoid
    Kits are presented as the fix, but no comparative data are in the corpus.
  source_urls:
  - https://www.stemcell.com/culturing-mouse-and-human-mammary-organoids-with-mammocult.html
  - https://www.stemcell.com/mammary-stem-cells-and-breast-cancer.html
- description: Culture variability, which the defined serum-free formulation is said to reduce (implied
    limitation of serum-containing alternatives).
  source_urls:
  - https://www.stemcell.com/culturing-mouse-and-human-mammary-organoids-with-mammocult.html
