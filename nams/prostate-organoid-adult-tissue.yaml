model:
  id: prostate-organoid-adult-tissue
  type: Organoid
  name: Prostate organoids from adult tissue
  description: Human and mouse prostate organoids with a cell-dense core of keratin 8+, androgen receptor+
    luminal cells, lined on the outside by keratin 14+ basal cells. A publication listed on STEMCELL product
    pages describes a FACS-free method for growing mouse prostate organoids that respond strongly to androgens.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0002367
    name: prostate gland
  cell_types:
  - id: CL:0002340
    name: luminal cell of prostate epithelium
  - id: CL:0002341
    name: basal cell of prostate epithelium
  cell_source: adult tissue
  differentiation_method: Freshly dissociated human prostate cells are expanded in EpiCult Plus Medium
    for 5 days, then seeded into a human prostate organoid medium for another 11 days. Mouse prostate
    epithelial cells expanded in EpiCult Plus can likewise be differentiated as organoids. STEMCELL also
    lists ProstaCult Organoid Medium (Human) and ProstaCult Organoid Medium (Mouse) in poster titles.
  culture_system: 3D organoid culture after 2D expansion (timings above for human). No matrix or plate
    details are given.
