model:
  id: ccte-deisenroth-5ar-nbte
  name: CCTE_Deisenroth_5AR_NBTE
  description: CCTE_Deisenroth_5AR NBTE (5alpha-reductase NanoBRET Target Engagement Assay)
    is a cell-based, single-readout assay that uses HEK293T, a human kidney cell line, with
    measurements taken at 5 hours after chemical dosing in a 384 well plate. This assay includes
    a primary and secondary screen as well as an autofluorscence screen.
