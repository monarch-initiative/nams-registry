model:
  id: retinal-ganglion-cell-ngn2-forward-programming-pluripotent-stem-cell
  type: TwoDCellCulture
  name: Retinal ganglion cells by NGN2 forward programming from human pluripotent stem cells
  description: >-
    Human iPSC/PSC-derived retinal ganglion cells (RGCs) generated by
    transcription-factor forward programming rather than by stepwise
    developmental differentiation, reviewed in Wong, Yip & Huang 2023
    (doi:10.3390/ijms241713652, Table 2; the protocol of Luo et al.). The
    approach overexpresses neurogenin 2 (NGN2) by lentiviral transduction to
    expedite differentiation: lentivirus is transduced on day -1, NGN2
    expression is induced on day 0 with doxycycline, glial cell-derived
    neurotrophic factor (GDNF) is added on day 2, and the cells are switched to
    RGC SATO growth medium with the Notch inhibitor DAPT for the next four days,
    so the RGC product is reached in approximately one week. The review frames
    this as directed differentiation toward the RGC lineage through both
    endogenous Notch inhibition and exogenous NGN2 upregulation. These are
    wild-type reference cells carrying no disease genotype. This record is split
    from retinal-ganglion-cell-pluripotent-stem-cell because the generating
    method is categorically different (transcription-factor forward programming
    in about a week, rather than weeks-long developmental differentiation or
    organoid dissociation); the two records describe the same cell product
    (RGCs) made by different systems. The finer detail of how the forward-
    programming protocol is modelled is a NAMO modelling question still to be
    settled.
  biological_organization_level: CELLULAR
  spatial_context: >-
    Purified inner-retina projection neurons (retinal ganglion cells) of the
    retina (UBERON:0000966), as a monolayer forward-programmed culture.
  complexity_level: LOW
  cell_types:
  - id: CL:0000740
    name: retinal ganglion cell
  cell_source: pluripotent stem cells
  substrate_type: Tissue-culture surface.
  differentiation_method: >-
    Transcription-factor forward programming (Luo et al., reviewed in Wong et
    al. 2023): lentiviral NGN2 transduction on day -1; NGN2 induction with
    doxycycline on day 0; GDNF on day 2; switch to RGC SATO growth medium with
    the Notch inhibitor (gamma-secretase inhibitor) DAPT for four further days.
    Combines exogenous NGN2 upregulation with endogenous Notch inhibition to
    commit pluripotent stem cells to the RGC lineage in about one week.
  culture_conditions: >-
    2D adherent culture of forward-programmed RGCs. As a direct conversion
    method it bypasses the retinal-organoid and weeks-long directed-
    differentiation routes used for the companion RGC record.
  references:
  - id: doi:10.3390/ijms241713652
    title: 'Establishing Functional Retina in a Dish: Progress and Promises of Induced
      Pluripotent Stem Cell-Based Retinal Neuron Differentiation'
    authors:
    - Nonthaphat Kent Wong
    - Shea Ping Yip
    - Chien-Ling Huang
    journal: International Journal of Molecular Sciences
    year: 2023
    url: https://doi.org/10.3390/ijms241713652
synonyms:
- NGN2 forward-programmed RGCs
- neurogenin-2 induced retinal ganglion cells
- forward-programmed iPSC-derived RGCs
species:
- id: NCBITaxon:9606
  name: Homo sapiens
applications:
- description: >-
    Rapid generation of human RGCs (about one week) for glaucoma and
    optic-neuropathy disease modelling and RGC replacement research, as an
    alternative to weeks-long developmental differentiation.
  source_urls:
  - https://doi.org/10.3390/ijms241713652
  supporting_references:
  - doi:10.3390/ijms241713652
limitations:
- description: >-
    Wild-type reference cells carrying no glaucoma lesion (OPTN, MYOC, elevated
    intraocular pressure). As a forced transcription-factor conversion, the
    method bypasses the normal developmental trajectory, so the identity and
    maturity of the product need not match RGCs made by developmental
    differentiation or found in fetal retina.
  source_urls:
  - https://doi.org/10.3390/ijms241713652
  supporting_references:
  - doi:10.3390/ijms241713652
