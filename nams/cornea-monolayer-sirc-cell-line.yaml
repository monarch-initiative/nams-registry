model:
  id: cornea-monolayer-sirc-cell-line
  type: CellLineModel
  name: SIRC rabbit corneal monolayer
  description: >-
    A conventional two-dimensional monolayer of SIRC (Statens Seruminstitut Rabbit
    Cornea) cells, the ocular comparator in a paired study of particulate matter
    (PM) cytotoxicity across monolayers and two-layer co-cultures. The companion
    record cornea-coculture-sirc-balb-3t3-transwell is the same corneal layer seeded
    over a BALB/3T3 mouse fibroblast feeder on a porous Transwell insert. SIRC is a
    rabbit line, so this is the one non-human monolayer in the set. Recorded in the
    registry from the primary paper, Guerra-Flórez et al. 2023
    (doi:10.1016/j.tox.2023.153685), in the Toxicology special issue "New approach
    methodologies: from conceptual development to regulatory application". Only the
    paper's abstract was retrievable in the curation environment, so this record is
    bounded to what the abstract reports.
  biological_organization_level: CELLULAR
  cell_types:
  - id: CL:0000575
    name: corneal epithelial cell
  cell_source: >-
    The SIRC (Statens Seruminstitut Rabbit Cornea) immortalised rabbit corneal cell
    line, used here as an ocular-surface model. Its cell-type binding is provisional:
    SIRC is corneal in origin but its epithelial-versus-fibroblastic identity is
    debated in the literature, so corneal epithelial cell is the tissue-of-origin
    anchor rather than a settled phenotype.
  culture_conditions: >-
    Monolayer culture. Exposed to coarse and fine PM extracts at 1, 2 and 5 mg/mL,
    with cell viability read at 24 hours by MTT assay. Finer detail is in the full
    text, which was not retrievable here.
  references:
  - id: doi:10.1016/j.tox.2023.153685
    title: 'In vitro toxicity of fine and coarse particulate matter on the skin, ocular
      and lung microphysiological cell-culture systems.'
    authors:
    - Guerra-Flórez DY
    - Valencia-Osorio LM
    - Zapata-González AF
    - Álvarez-Láinez ML
    - Cadavid-Torres E
    - Meneses-Ramírez EA
    - Torres-Osorio V
    - Botero-Valencia JS
    - Pareja-López A
    journal: Toxicology
    year: 2023
    url: https://doi.org/10.1016/j.tox.2023.153685
species:
- id: NCBITaxon:9986
  name: Oryctolagus cuniculus
applications:
- description: >-
    Cytotoxicity screening of airborne particulate matter on corneal cells. The
    study exposed the monolayer to coarse and fine PM at 1, 2 and 5 mg/mL and read
    viability at 24 hours by MTT, reporting a greater viability loss from fine PM
    than coarse PM.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
- description: >-
    A single-cell-type baseline for the paired corneal co-culture. For SIRC the
    abstract reports a seeding-configuration effect in the two-layer format
    (non-contact more PM-resistant than in-contact), so the monolayer is the
    reference the co-culture is read against.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
limitations:
- description: >-
    The only endpoint is MTT viability at 24 hours, an apical measure of cell death
    that identifies no mechanism. The abstract proposes possible cellular
    interactions rather than measuring any.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
- description: >-
    A rabbit line, so results carry a species gap to human ocular surface, and an
    immortalised line rather than primary corneal tissue. The line's
    epithelial-versus-fibroblastic identity is itself unsettled.
  source_urls:
  - https://doi.org/10.1016/j.tox.2023.153685
  supporting_references:
  - doi:10.1016/j.tox.2023.153685
- description: >-
    Abstract-only record. The full text was not retrievable in the curation
    environment, so quantitative dose-response, replicate structure and PM
    characterisation are not captured here.
