synonyms:
- mouse intestinal epithelial organoids
species:
- id: NCBITaxon:10090
  name: Mus musculus
applications:
- description: Studying development and function of normal and tumorigenic intestinal epithelium, modeling
    intestinal disease, and investigating stem cell properties and regenerative therapy approaches; listed
    research fields for the cryopreserved organoids include epithelial cell biology, cancer, cystic fibrosis,
    microbiomics, intestinal immunology, and bacterial or viral pathogenesis.
  source_urls:
  - https://www.stemcell.com/products/intesticult-organoid-growth-medium-mouse.html
  - https://www.stemcell.com/products/mouse-intestinal-organoids.html
- description: Toxicity testing presented as a way to supplement data without sacrificing additional animals;
    flavopiridol intestinal epithelial toxicity was assessed by cell viability, total organoid area, and
    organoid morphology measured as degree of branching. A 96-well viability assay for mouse small intestinal
    organoids after cytotoxic compound treatment was presented at SOT 2017.
  source_urls:
  - https://www.stemcell.com/services/contract-assay-services/organoid-assays/intestinal-services
  - https://www.stemcell.com/technical-resources/area-of-interest/organoid-research/intestinal-organoids/scientific-posters.html
- description: 'Genetic studies using organoids from existing knockout mice, presented as faster than
    making a knockout strain: organoids from knockout mice give an intestinal culture with complete gene
    knockout and no off-target effects, used to identify transporters involved in gut hormone secretion
    or substrate transport and to observe knockout effects on intestinal morphology. Mechanistic work
    on IL-22-driven intestinal regeneration identified intestinal stem cells, not Paneth cells, as the
    targets.'
  source_urls:
  - https://www.stemcell.com/organoid-profiles-tamara-zietek.html
  - https://www.stemcell.com/organoid-profiles-caroline-lindemans.html
  supporting_references:
  - doi:10.1038/nature16460
- description: 'Cancer mechanism studies: Apc-deficient mouse intestinal organoids show constitutively
    active WNT signaling and are tumorigenic when injected into nude mice, and have been used to dissect
    MAPK and WNT interactions in tumor progression.'
  source_urls:
  - https://www.stemcell.com/intestinal-organoid-culture-lp.html
  supporting_references:
  - doi:10.1038/nature09637
limitations:
- description: 'Mouse rather than human: the pages'' framing throughout is that animal-derived models
    have limited relevance to human physiology, and mouse organoids are offered as a way to supplement
    data rather than as the human-relevant system.'
  source_urls:
  - https://www.stemcell.com/products/brands/intesticult-intestinal-organoid-media.html
  - https://www.stemcell.com/services/contract-assay-services/organoid-assays/intestinal-services
- description: High cell turnover makes derived 2D cultures fragile; mouse small intestinal organoids
    in particular are described as very challenging for monolayer work and colon-derived organoids are
    recommended instead.
  source_urls:
  - https://www.stemcell.com/how-to-generate-mouse-intestinal-organoid-derived-monolayers-using-intesticult.html
- description: 'Seeding density is a narrow window: too dense and organoids do not receive enough nutrients
    from the medium, too sparse and the organoids themselves do not produce enough factors for proper
    expansion, so crypts should be plated at three different densities. Crypts that touch and stick to
    the well surface will differentiate, so pre-warmed plates and ice-cold Matrigel are critical.'
  source_urls:
  - https://www.stemcell.com/critical-steps-for-culturing-mouse-intestinal-organoids.html
- description: 'Luminal debris accumulates: cultures must be passaged at a 1:6 split after 7-10 days to
    avoid overgrowth and excessive accumulation of debris within the organoid lumen. Large multi-layered
    fragments carried through crypt isolation contain no stem cells and will not form organoids.'
  source_urls:
  - https://www.stemcell.com/how-to-establish-mouse-intestinal-organoid-culture.html
- description: 'Cryopreservation constraints: whole organoids should not be frozen as intact structures
    because they break down and fragments die during thawing with loss of stem cell components; consecutive
    freeze-thaw cycles are not recommended, organoids should be passaged at least twice before refreezing,
    and long-term storage at -80 C is not recommended (stability ~6 months at -135 C).'
  source_urls:
  - https://www.stemcell.com/how-to-cryopreserve-intestinal-organoids.html
  - https://www.stemcell.com/how-to-thaw-intestinal-organoids.html
- description: Research-use-only HUB licence restriction applies to both the medium and the cryopreserved
    organoids, excluding commercial drug screening, equipment validation and biobanking without a further
    licence.
  source_urls:
  - https://www.stemcell.com/products/intesticult-organoid-growth-medium-mouse.html
  - https://www.stemcell.com/products/mouse-intestinal-organoids.html
