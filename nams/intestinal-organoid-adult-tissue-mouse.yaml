model:
  id: intestinal-organoid-adult-tissue-mouse
  type: Organoid
  name: Mouse intestinal organoids from adult crypts
  description: Three-dimensional cultures of adult mouse intestinal epithelium with a polarized epithelium
    containing all of the known cell types of the adult intestinal epithelium, a central lumen, budding
    crypt-like domains, a self-propagating stem cell niche, and functional transport into and out of the
    lumen. Used for both small and large intestinal epithelium and associated stem cell dynamics, and
    available as a cryopreserved product for standardized experimental starting material.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0000160
    name: intestine
  cell_types:
  - id: CL:0002250
    name: intestinal crypt stem cell
  - id: CL:0000510
    name: paneth cell
  - id: CL:0000160
    name: goblet cell
  - id: CL:0000164
    name: enteroendocrine cell
  - id: CL:0000584
    name: enterocyte
  - id: CL:0009010
    name: transit amplifying cell
  cell_source: adult tissue
  differentiation_method: 'Mouse small intestine or colon is harvested, the mesentery removed, and crypts
    released and fractionated; crypt-enriched fractions are identified microscopically, counted, and resuspended
    in undiluted Matrigel with IntestiCult Organoid Growth Medium (Mouse, Cat #06005), a defined serum-free
    medium. Organoids form in less than one week. Cryopreserved Mouse Intestinal Organoids (Cat #70931;
    200 organoids per vial from C57BL/6 small intestine, frozen in CryoStor CS10) allow cultures to be
    established without isolating crypts from primary tissue.'
  culture_system: Matrigel domes (150 uL Matrigel plus 150 uL medium per passage aliquot) in multiwell
    plates on pre-warmed plates with ice-cold Matrigel; crypts plated at three densities; passaged at
    a 1:6 split after 7-10 days, not above 200 organoids per well.
  references:
  - id: doi:10.1038/nature07935
    title: Single Lgr5 stem cells build crypt-villus structures in vitro without a mesenchymal niche
    authors:
    - Toshiro Sato
    - Robert G. Vries
    - Hugo J. Snippert
    - Marc van de Wetering
    - Nick Barker
    - Daniel E. Stange
    - Johan H. van Es
    - Arie Abo
    - Pekka Kujala
    - Peter J. Peters
    - Hans Clevers
    journal: Nature
    year: 2009
  - id: doi:10.1038/cddis.2014.183
    title: Ex vivo culture of intestinal crypt organoids as a model system for assessing cell death induction
      in intestinal epithelial cells and enteropathy
    authors:
    - T Grabinger
    - L Luks
    - F Kostadinova
    - C Zimberlin
    - J P Medema
    - M Leist
    - T Brunner
    journal: Cell Death & Disease
    year: 2014
  - id: doi:10.1038/nm.2695
    title: Functional engraftment of colon epithelium expanded in vitro from a single adult Lgr5+ stem
      cell
    authors:
    - Shiro Yui
    - Tetsuya Nakamura
    - Toshiro Sato
    - Yasuhiro Nemoto
    - Tomohiro Mizutani
    - Xiu Zheng
    - Shizuko Ichinose
    - Takashi Nagaishi
    - Ryuichi Okamoto
