model:
  id: airway-organoid-apical-in-adult-tissue
  type: Organoid
  name: Apical-in airway organoids from primary human bronchial epithelial cells
  description: A three-dimensional organotypic culture of the large airway epithelium grown from primary
    human bronchial epithelial cells in a Matrigel dome. Fully differentiated organoids have a centralized
    lumen surrounded by a polarized airway epithelial layer with ciliated and goblet cells, so the apical
    surface and cilia face inward into the lumen. The same cellular differentiation (extensive mucociliary
    differentiation to a pseudostratified epithelium) is obtained as in air-liquid interface culture,
    but in a matrix-embedded spheroid format that does not need cell culture inserts.
  three_d_architecture: ORGANOID
  organ_modeled:
    id: UBERON:0002185
    name: bronchus
  cell_types:
  - id: CL:0002633
    name: respiratory basal cell
  - id: CL:0000067
    name: ciliated epithelial cell
  - id: CL:0002370
    name: respiratory tract goblet cell
  cell_source: adult tissue
  differentiation_method: Primary human bronchial epithelial cells (HBECs) are first expanded in 2D adherent
    culture in PneumaCult-Ex Plus or PneumaCult-NGEx Medium and passaged at 50 - 60% confluence. Expanded
    HBECs are embedded in Matrigel domes and cultured 4 - 7 days in PneumaCult Airway Organoid Seeding
    Medium, which yields spheroids composed of basal cells with no lumen and no apparent polarity. Switching
    to PneumaCult Airway Organoid Differentiation Medium for a further 21 - 28 days produces organoids
    with a central lumen and a polarized epithelium containing ciliated and goblet cells.
  culture_system: 50 uL domes of 90% Corning Matrigel GFR (phenol red-free, LDEV-free, 356231) plus 10%
    seeding medium in 24-well non-tissue-culture-treated plates; 2 x 10^3 HBECs per dome at passage 3
    (4000 at P4, 6000 at P5), 500 - 750 uL medium per well with changes every 2 days. 400 - 600 organoids
    per dome after the seeding phase. Total time in culture is donor- and passage-dependent, roughly 25
    - 35 days; differentiated organoids are about 100 um across and approximately 40 - 50% of cells are
    ciliated.
  references:
