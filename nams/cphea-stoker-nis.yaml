model:
  id: cphea-stoker-nis
  name: CPHEA_Stoker_NIS
  description: CPHEA_Stoker_NIS is a cell-based, single-readout assay that uses hNIS-HEK293T-EPA,
    a novel human kidney cell line expressing human NIS, with measurements taken at 2 hours
    after chemical dosing in a 96-well plate. This radioactive iodide uptake (RAIU) assay
    is used to identify inhibitors of NIS-mediated iodide uptake. A parallel cytoxicity assay
    (Cell Titer Glo, Promega) was also run in the same cell line.
  description_scope: METHOD
