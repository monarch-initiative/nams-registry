  name: BSK_KF3CT
  description: BSK_KF3CT is a cell-based, multiplexed-readout assay that uses keratinocytes
    and foreskin fibroblasts, a human skin primary cell co-culture, with measurements taken
    at 24 hours after chemical dosing in a 96-well plate.
