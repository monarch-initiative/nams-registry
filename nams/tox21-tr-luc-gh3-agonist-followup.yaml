  name: TOX21_TR_LUC_GH3_Agonist_Followup
  description: TOX21_TR_LUC_GH3_Agonist_Followup is a secondary assay for specificity for
    the TOX21_TR_LUC_GH3_Agonist assay. TOX21_TR_LUC_GH3_Agonist_Followup is a cell-based,
    single-readout assay that uses GH3, a rat pituitary gland cell line, with measurements
    taken at 28 hours after chemical dosing in a 1536-well plate.
