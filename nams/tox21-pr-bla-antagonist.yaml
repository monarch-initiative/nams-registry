model:
  id: tox21-pr-bla-antagonist
  name: TOX21_PR_BLA_Antagonist
  description: TOX21_PR_BLA_Antagonist is a cell-based, single-readout assay that uses transfected
    HEK293T, a human kidney cell line, with measurements taken at 24 hours after chemical
    dosing in a 1536-well plate. To identify the compounds that stimulate PR signaling, a
    PR-UAS-bla GripTite cell line i.e. PR-UAS-bla HEK293T (Invitrogen, Carlsbad, CA, USA)
    containing a beta-lactamase reporter gene under the control of an UAS response element
    was used to screen Tox21 10K compound library. The cytotoxicity of the Tox21 compound
    library against the PR-bla cell line was tested in parallel by measuring the cell viability
    using CellTiter-Glo assay in the same wells. See tox21-pr-bla-antagonist-p1.
  description_scope: METHOD
