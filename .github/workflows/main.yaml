# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1"  # Make tools pretty.

permissions: {}

jobs:
  pre-commit:

    runs-on: ubuntu-latest

    steps:

    # https://github.com/actions/checkout
    - name: Check out repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    # https://github.com/astral-sh/setup-uv
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # pre-commit's version is pinned in uv.lock (the lint group), and each
    # hook's in .pre-commit-config.yaml.
    - name: Run the pre-commit hooks on every file
      run: uv run --only-group lint pre-commit run --all-files --show-diff-on-failure

  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest and newest supported versions. The registry isn't
        # published as a package, so the versions between add little.
        python-version: ["3.10", "3.14"]
      fail-fast: false

    steps:

    # https://github.com/actions/checkout
    - name: Check out repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    # https://github.com/astral-sh/setup-uv
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # https://github.com/actions/setup-python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install just
      run: |
        uv tool install rust-just

    - name: Install project
      run: uv sync --group dev

    - name: Fetch the NAMO schema
      run: uv run python scripts/link_namo.py

    - name: Run test suite
      run: just test
