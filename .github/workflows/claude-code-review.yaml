---
# Reviews each pull request with Claude Code and posts the review on the PR.
# Built from:
# https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret, made with
# `claude setup-token`. The token lasts one year: renew it by November 2027.
name: Claude Code Review

on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

jobs:
  claude-review:
    # Draft PRs are reviewed when they are marked ready. PRs from forks
    # and from Dependabot cannot read the token, so they are skipped. To
    # review a PR again, re-run this job from the PR's checks.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # https://github.com/anthropics/claude-code-action
      - name: Review the pull request
        uses: anthropics/claude-code-action@v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post as github-actions[bot] with this job's token, so the
          # Claude GitHub App does not need to be installed on the repo.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repository is a LinkML registry
            of New Approach Methodology (NAM) records: YAML records under
            nams/ and partial-nams/, the schema under src/, and Python
            fetch and import scripts under scripts/. Read README.md and
            CONTRIBUTING.md for its conventions.

            Look for, in order of importance:
            1. Bugs: code that crashes or gives wrong output, and records
               that would fail schema validation or `just test`.
            2. Record content: identifiers, ontology terms, URLs and
               references that are wrong or don't support what the record
               says.
            3. Changes that contradict the repository's conventions.

            Report only problems you can point to in the diff, each with
            the concrete input or case that goes wrong. Skip style
            preferences. Use an inline comment for each problem, then one
            short top-level comment that summarises the review. If you find
            nothing, say so in one line.

          claude_args: |
            --allowedTools
              "mcp__github_inline_comment__create_inline_comment"
              "Bash(gh pr comment:*)"
              "Bash(gh pr diff:*)"
              "Bash(gh pr view:*)"
