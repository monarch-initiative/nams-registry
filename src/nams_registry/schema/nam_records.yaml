---
id: https://w3id.org/monarch-initiative/nams-registry/nam_records
name: nam_records
title: NAM records
description: |-
  Individual NAMs extracted from the resources in the nams-registry, one
  file per NAM in nams/. Each record holds the NAM as an unmodified NAMO
  model (https://github.com/monarch-initiative/namo), plus what NAMO does
  not hold: where the NAM was found, what it is used for, and its
  limitations. Where a full record can't yet be written, a NAM is kept as
  a partial record in partial-nams/<resource>/, holding only what the
  resource gives publicly.
license: MIT

prefixes:
  nams_registry: https://w3id.org/monarch-initiative/nams-registry/
  linkml: https://w3id.org/linkml/
  namo: https://w3id.org/monarch-initiative/namo/
  dcterms: http://purl.org/dc/terms/
  aop: https://aopwiki.org/aops/
  aop.events: https://aopwiki.org/events/
default_prefix: nams_registry
default_range: string

imports:
  - linkml:types
  # NAMO, from the namo repository; scripts/link_namo.py puts it in place
  # (gitignored). It is never committed here.
  - namo

classes:

  NAMRecord:
    tree_root: true
    description: >-
      One NAM, as a NAMO model with what the registry adds around it: where
      the NAM was found, what it is used for, and its limitations. The file in
      nams/ is named after the model's id.
    slots:
      - model
      - synonyms
      - species
      - applications
      - limitations
      - source_resources
      - creation_date
      - last_modified_date

  PartialNAMRecord:
    description: >-
      A NAM found in a resource, recorded only in part, in
      partial-nams/<resource>/<id>.yaml. It holds only what the resource
      gives publicly, in the resource's own terms, and is kept where a full
      NAMRecord can't yet be written, e.g. while the terms for reusing the
      resource's full records are unsettled. It is generated by that
      resource's script, not edited by hand. Once a NAMRecord in nams/
      names one of its source_urls, the script no longer writes it.
    attributes:
      id:
        identifier: true
        required: true
        description: >-
          The partial record's file name, from the NAM's name. A full
          NAMRecord for the NAM may have a different id.
      name:
        required: true
        description: The NAM's name in the resource.
      resource:
        required: true
        description: The id of the resource in resources/, e.g. namsnetwork.
      source_ids:
        multivalued: true
        description: >-
          The resource's own ids for the NAM. A resource may list one NAM
          several times, e.g. once per endpoint; the partial record merges them.
      source_urls:
        range: uri
        multivalued: true
        required: true
        description: The resource's pages for the NAM, one per source id.
      accessed_on:
        range: date
        required: true
      method_type:
        description: The resource's kind of method, e.g. in vitro or in silico.
      proposed_namo_class:
        description: >-
          The NAMO class the NAM's model would be, when the resource's data
          makes it clear, e.g. CoCulture. Left out when it does not, or when
          NAMO has no class for the method (in chemico, ex vivo).
      development_status:
        description: >-
          The resource's development or regulatory status, e.g. Regulatory
          accepted NAMs.
      endpoints:
        multivalued: true
        description: The regulatory endpoints the resource lists the NAM for.
      organs:
        multivalued: true
      cell_lines:
        multivalued: true
        description: >-
          The cells the resource names, as it names them, e.g. A549. Not yet
          mapped to Cellosaurus or CL.
      guidelines:
        multivalued: true
        description: Test guidelines, guidance documents or SOPs, e.g. OECD TG 442D.
      regulations:
        multivalued: true
        description: The regulations the resource lists the NAM under.
      substances:
        multivalued: true
        description: Substances or materials the resource links to the NAM.
      methods_biomarkers:
        multivalued: true
        description: Measurement methods and biomarkers the resource links to the NAM.
      aops:
        range: uriorcurie
        multivalued: true
        description: AOP-Wiki AOPs the resource links to the NAM, e.g. aop:173.
      key_events:
        range: uriorcurie
        multivalued: true
        description: >-
          AOP-Wiki Key Events the resource links to the NAM, e.g.
          aop.events:1635.

  NAMStatement:
    description: One thing a NAM is used for, or one of its limitations.
    attributes:
      description:
        required: true
      source_urls:
        range: uri
        multivalued: true
        description: The pages the statement was taken from.
      supporting_references:
        range: uriorcurie
        multivalued: true
        description: >-
          Publications the source page cites for the statement, e.g.
          doi:10.1038/nm.3201.

  SourceRecord:
    description: A registry resource a NAM was found in.
    attributes:
      resource:
        required: true
        description: The id of the resource in resources/, e.g. stemcell-organoids.
      source_urls:
        range: uri
        multivalued: true
        description: The resource's pages that describe the NAM.
      products:
        range: Product
        multivalued: true
        inlined_as_list: true
        description: Products the resource sells for the NAM, for a vendor.
      accessed_on:
        range: date

  Product:
    attributes:
      name:
        required: true
      catalog_number:
      url:
        range: uri

slots:
  model:
    range: ModelSystem
    required: true
    inlined: true
    description: >-
      The NAM as a NAMO model. Its type names the NAMO class, e.g. Organoid,
      and its id identifies the NAM, naming the organ, the format if it is
      not an organoid, and the cell source, e.g.
      kidney-organoid-pluripotent-stem-cell.
  species:
    range: OrganismTaxon
    multivalued: true
    inlined_as_list: true
    description: >-
      The species the cells come from. NAMO records species only for animal
      models; move this into the model if NAMO adds it.
  applications:
    range: NAMStatement
    multivalued: true
    inlined_as_list: true
    description: What the NAM is used for. Move into the model if NAMO adds it.
  limitations:
    range: NAMStatement
    multivalued: true
    inlined_as_list: true
    description: The NAM's limitations. Move into the model if NAMO adds it.
  source_resources:
    range: SourceRecord
    multivalued: true
    inlined_as_list: true
    required: true
  synonyms:
    multivalued: true
    description: >-
      Other names for the same NAM, as used in the literature or by its
      sources, e.g. "enteroids" for adult intestinal organoids. A vendor's
      product, kit or brand name for the NAM is not a synonym; it goes in the
      product list of the resource it was found in (source_resources >
      products). Broader or narrower terms are not synonyms either. Move into
      the model if NAMO adds it.
  creation_date:
    range: date
    slot_uri: dcterms:created
    description: The date this record was created.
  last_modified_date:
    range: date
    slot_uri: dcterms:modified
    description: The date this record was last changed.
