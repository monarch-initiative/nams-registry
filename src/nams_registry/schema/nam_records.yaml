---
id: https://w3id.org/monarch-initiative/nams-registry/nam_records
name: nam_records
title: NAM records
description: |-
  Individual NAMs extracted from the resources in the nams-registry, one
  file per NAM in nams/. Each record holds the NAM as an unmodified NAMO
  model (https://github.com/monarch-initiative/namo), plus what NAMO does
  not hold: where the NAM was found, what it is used for, and its
  limitations.
license: MIT

prefixes:
  nams_registry: https://w3id.org/monarch-initiative/nams-registry/
  linkml: https://w3id.org/linkml/
  namo: https://w3id.org/monarch-initiative/namo/
  dcterms: http://purl.org/dc/terms/
  aop: https://aopwiki.org/aops/
  aop.events: https://aopwiki.org/events/
default_prefix: nams_registry
default_range: string

imports:
- linkml:types
# NAMO, from the namo repository; scripts/link_namo.py puts it in place
# (gitignored). It is never committed here.
- namo

classes:

  NAMRecord:
    tree_root: true
    description: >-
      One NAM, as a NAMO model with what the registry adds around it: where
      the NAM was found, what it is used for, and its limitations. The file in
      nams/ is named after the model's id.
    slots:
    - model
    - synonyms
    - species
    - applications
    - limitations
    - source_resources
    - compared_with
    - dismech_status
    - vendor_holds_more_details
    - creation_date
    - last_modified_date

  Comparison:
    description: >-
      Another NAM record this NAM was compared with head to head, and the
      paper that made the comparison. It links two registry records through
      a study, rather than describing either model, so it is the registry's,
      not NAMO's.
    attributes:
      nam:
        required: true
        description: >-
          The id of the other NAM record in nams/, e.g.
          sh-sy5y-neuronal-spheroid-cell-line-human.
      reference:
        range: uriorcurie
        required: true
        description: >-
          The paper that compared the two, as a CURIE, e.g.
          doi:10.1016/j.tox.2023.153715.

  DismechStatus:
    description: >-
      Whether a NAM came into the registry through DisMech curation, and
      whether DisMech's graph represents it, as of one DisMech commit.
      DisMech is a route into the registry, not a source, so it is not
      listed in source_resources. A NAM curated in DisMech need not be in
      its graph, e.g. when its readout identifies no mechanism to attach it
      to.
    attributes:
      processed_through_dismech:
        range: boolean
        required: true
        description: The NAM came into the registry through DisMech curation.
      present_in_dismech:
        range: boolean
        required: true
        description: >-
          The NAM is represented in the DisMech graph at dismech_commit. It
          can change as DisMech changes.
      dismech_commit:
        required: true
        pattern: "^[0-9a-f]{40}$"
        description: >-
          The full 40-character SHA of the DisMech commit the values were
          checked against.
      assessed_on:
        range: date
        required: true
        description: The date the values were checked.

  NAMStatement:
    description: One thing a NAM is used for, or one of its limitations.
    attributes:
      description:
        required: true
      source_urls:
        range: uri
        multivalued: true
        description: The pages the statement was taken from.
      supporting_references:
        range: uriorcurie
        multivalued: true
        description: >-
          Publications the source page cites for the statement, e.g.
          doi:10.1038/nm.3201.

  SourceRecord:
    description: >-
      A registry resource a NAM was found in. From source_ids on, the slots
      hold what the resource itself gives for the NAM, in its own terms and
      unmapped to ontologies, e.g. NAMs.network's public catalogue entry.
    attributes:
      resource:
        required: true
        description: >-
          The id of the resource in resources/, e.g. stemcell-organoids. For
          a NAM found in a research paper, scientific-literature.
      source_urls:
        range: uri
        multivalued: true
        description: >-
          The resource's pages that describe the NAM. For
          scientific-literature, the DOI link of each paper the NAM was found
          in, e.g. https://doi.org/10.1016/j.tox.2024.153842; the paper's
          full citation goes in the model's references.
      products:
        range: Product
        multivalued: true
        inlined_as_list: true
        description: Products the resource sells for the NAM, for a vendor.
      accessed_on:
        range: date
      source_ids:
        multivalued: true
        description: >-
          The resource's own ids for the NAM. A resource may list one NAM
          several times, e.g. once per endpoint; the registry record merges them.
      method_type:
        description: The resource's kind of method, e.g. in vitro or in silico.
      development_status:
        description: >-
          The resource's development or regulatory status, e.g. Regulatory
          accepted NAMs.
      endpoints:
        multivalued: true
        description: The regulatory endpoints the resource lists the NAM for.
      organs:
        multivalued: true
      cell_lines:
        multivalued: true
        description: >-
          The cells the resource names, as it names them, e.g. A549. Not yet
          mapped to Cellosaurus or CL.
      guidelines:
        multivalued: true
        description: Test guidelines, guidance documents or SOPs, e.g. OECD TG 442D.
      regulations:
        multivalued: true
        description: The regulations the resource lists the NAM under.
      substances:
        multivalued: true
        description: Substances or materials the resource links to the NAM.
      methods_biomarkers:
        multivalued: true
        description: Measurement methods and biomarkers the resource links to the NAM.
      aops:
        range: uriorcurie
        multivalued: true
        description: AOP-Wiki AOPs the resource links to the NAM, e.g. aop:173.
      key_events:
        range: uriorcurie
        multivalued: true
        description: >-
          AOP-Wiki Key Events the resource links to the NAM, e.g.
          aop.events:1635.

  Product:
    attributes:
      name:
        required: true
      catalog_number:
      url:
        range: uri

slots:
  model:
    range: ModelSystem
    required: true
    inlined: true
    description: >-
      The NAM as a NAMO model. Its type names the NAMO class, e.g. Organoid,
      and its id identifies the NAM, naming the organ, the format if it is
      not an organoid, and the cell source, e.g.
      kidney-organoid-pluripotent-stem-cell. The type is left out when what
      the source gives does not make the NAMO class clear, or NAMO has no
      class for the method (in chemico, ex vivo).
  species:
    range: OrganismTaxon
    multivalued: true
    inlined_as_list: true
    description: >-
      The species the cells come from. NAMO records species only for animal
      models; move this into the model if NAMO adds it.
    bindings:
    - binds_value_of: id
      range: SpeciesEnum
      obligation_level: REQUIRED
  applications:
    range: NAMStatement
    multivalued: true
    inlined_as_list: true
    description: What the NAM is used for. Move into the model if NAMO adds it.
  limitations:
    range: NAMStatement
    multivalued: true
    inlined_as_list: true
    description: The NAM's limitations. Move into the model if NAMO adds it.
  source_resources:
    range: SourceRecord
    multivalued: true
    inlined_as_list: true
    required: true
  compared_with:
    range: Comparison
    multivalued: true
    inlined_as_list: true
    description: >-
      The other NAM records this NAM was compared with in the same study,
      where the comparison is part of what the study found. Record it on
      both records of a pair.
  dismech_status:
    range: DismechStatus
    inlined: true
    description: >-
      For a NAM that came through DisMech curation, whether DisMech's graph
      represents it. Leave it out for a NAM that did not come through
      DisMech.
  synonyms:
    multivalued: true
    description: >-
      Other names for the same NAM, as used in the literature or by its
      sources, e.g. "enteroids" for adult intestinal organoids. A vendor's
      product, kit or brand name for the NAM is not a synonym; it goes in the
      product list of the resource it was found in (source_resources >
      products). Broader or narrower terms are not synonyms either. Move into
      the model if NAMO adds it.
  vendor_holds_more_details:
    range: boolean
    description: >-
      The resource the NAM was found in holds more about it than this record
      does, in a part the registry can't use, e.g. NAMs.network's full
      records, which need a logged-in account. The record holds only what
      the resource gives publicly.
  creation_date:
    range: date
    slot_uri: dcterms:created
    description: The date this record was created.
  last_modified_date:
    range: date
    slot_uri: dcterms:modified
    description: The date this record was last changed.
