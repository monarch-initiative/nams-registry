  bladder: {organ: Urinary bladder, uberon: UBERON:0001255}
  bone: {organ: Bone, uberon: UBERON:0001474}
  brain: {organ: Brain, uberon: UBERON:0000955}
  breast: {organ: Breast, uberon: UBERON:0000310}
  central nervous system: {organ: Central nervous system, uberon: UBERON:0001017}
  cerebral cortex: {organ: Cerebral cortex, uberon: UBERON:0000956}
  cervix: {organ: Uterine cervix, uberon: UBERON:0000002}
  colon: {organ: Colon, uberon: UBERON:0001155}
  # Rat cortical primary cells.
  cortical: {organ: Cerebral cortex, uberon: UBERON:0000956}
  embryo: {organ: null, reason: a developmental stage of the whole organism, not an organ}
  H9 embryonic stem cell: {organ: null, reason: a cell line, not a tissue}
  H9-derived embryonic differentiated neuron: {organ: null, reason: a cell type, not a tissue}
  H9-derived embryonic neural crest stem cell: {organ: null, reason: a cell type, not a tissue}
  H9-derived neuroprogenitor stem cell: {organ: null, reason: a cell type, not a tissue}
  heart: {organ: Heart, uberon: UBERON:0000948}
  intestinal: {organ: Intestine, uberon: UBERON:0000160}
  iPS-derived endothelial cell: {organ: null, reason: a cell type, not a tissue}
  kidney: {organ: Kidney, uberon: UBERON:0002113}
  liver: {organ: Liver, uberon: UBERON:0002107}
  lung: {organ: Lung, uberon: UBERON:0002048}
  lymphoblast: {organ: null, reason: a cell type, not a tissue}
  mammary gland/breast: {organ: Breast, uberon: UBERON:0000310}
  # Nervous tissue, used for neural progenitor and neuron cultures.
  neural: {organ: Nervous system, uberon: UBERON:0001016}
  ovary: {organ: Ovary, uberon: UBERON:0000992}
  pancreas: {organ: Pancreas, uberon: UBERON:0001264}
  peripheral nervous system: {organ: Peripheral nervous system, uberon: UBERON:0000010}
  pituitary gland: {organ: Pituitary gland, uberon: UBERON:0000007}
  pluripotent stem cell: {organ: null, reason: a cell type, not a tissue}
  prostate: {organ: Prostate gland, uberon: UBERON:0002367}
  purified enzyme: {organ: null, reason: not a tissue}
  # UBERON's label is "saliva-secreting gland"; "salivary gland" is its synonym.
  salivary gland: {organ: Salivary gland, uberon: UBERON:0001044}
  skin: {organ: Skin, uberon: UBERON:0002097}
  spinal cord: {organ: Spinal cord, uberon: UBERON:0002240}
  spleen: {organ: Spleen, uberon: UBERON:0002106}
  testis: {organ: Testis, uberon: UBERON:0000473}
  thyroid: {organ: Thyroid gland, uberon: UBERON:0002046}
  thyroid gland: {organ: Thyroid gland, uberon: UBERON:0002046}
  umbilical vein-derived endothelial cell: {organ: null, reason: a cell type, not a tissue}
  uterus: {organ: Uterus, uberon: UBERON:0000995}
  # BioSeek's label for its endothelial and blood-cell co-culture panels.
  vascular: {organ: Vasculature, uberon: UBERON:0002049}

# cellShortName -> the registry's cell_lines. Each value gives the cells it
# names, as one entry or a list for a co-culture: a cell line by its
# Cellosaurus name and accession, a primary or derived cell by its CL label
# and id. An engineered or derived line with no Cellosaurus entry of its own
# keeps EPA's name and records the line it was made from as `parent`.
# `organ` on a cell overrides the tissue table for that cell, where EPA's
# tissue is wrong for it; `organ: null` drops it.
cells:
  1321-N1: {name: 1321N1, cellosaurus: CVCL_0110}
  22Rv1: {name: 22Rv1, cellosaurus: CVCL_1045}
  B and peripheral blood mononuclear cells:
  - {name: B cell, cl: CL:0000236}
  - {name: peripheral blood mononuclear cell, cl: CL:2000001}
  bronchial epithelial cells: {name: bronchial epithelial cell, cl: CL:0002328}
  bronchial epithelial cells and dermal fibroblasts:
  - {name: bronchial epithelial cell, cl: CL:0002328}
  - {name: fibroblast of dermis, cl: CL:0002551}
  C3H10T1/2: {name: C3H/10T1/2 clone 8, cellosaurus: CVCL_0190}
  CHO: {name: CHO, cellosaurus: CVCL_0213}
  CHO-K1: {name: CHO-K1, cellosaurus: CVCL_0214}
  coronary artery smooth muscle cells: {name: smooth muscle cell of the coronary artery, cl: CL:0002592}
  DT40: {name: DT40, cellosaurus: CVCL_0249}
  ERR-HEK293T: {name: ERR-HEK293T, parent: CVCL_0063, note: HEK293T engineered with an ERR reporter}
  foreskin fibroblasts: {name: foreskin fibroblast, cl: CL:1001608}
  GH3: {name: GH3, cellosaurus: CVCL_0273}
  H295R: {name: NCI-H295R, cellosaurus: CVCL_0458}
  HaCAT: {name: HaCaT, cellosaurus: CVCL_0038}
  HCT116: {name: HCT 116, cellosaurus: CVCL_0291}
  HEK293: {name: HEK293, cellosaurus: CVCL_0045}
  HEK293-PR-A: {name: HEK293-PR-A, parent: CVCL_0045, note: HEK293 engineered to express progesterone receptor A}
  HEK293T: {name: HEK293T, cellosaurus: CVCL_0063}
  HeLa: {name: HeLa, cellosaurus: CVCL_0030}
  HepaRG: {name: HepaRG, cellosaurus: CVCL_9720}
  hepatocytes: {name: hepatocyte, cl: CL:0000182}
  HepG2: {name: Hep-G2, cellosaurus: CVCL_0027}
  # Cellosaurus "H9" (CVCL_1240) is a T-cell lymphoma line; the H9 embryonic
  # stem cell line EPA means is WA09, which lists H9 as a synonym.
  hESC: {name: WA09, cellosaurus: CVCL_9773}
  hN2: {name: hN2, note: "ArunA's human neurons; no Cellosaurus or CL id looked up yet"}
  hNC: {name: hNC, cl: CL:0011012, parent: CVCL_9773, note: neural crest cells derived from H9 (WA09)}
  hNN: {name: hNN, cl: CL:0000540, parent: CVCL_9773, note: neurons derived from H9 (WA09)}
  hNP1: {name: hNP1, cl: CL:0011020, parent: CVCL_9773, note: neural progenitor cells derived from H9 (WA09)}
  hNPC: {name: neural progenitor cell, cl: CL:0011020}
  # Not mapped to Cellosaurus HUVEC-C (CVCL_2959): that is one ATCC line, and
  # EPA's HUVEC are not said to be it.
  HUVEC: {name: endothelial cell of umbilical vein, cl: CL:0002618}
  iCell GABANeurons: {name: iCell GABANeurons, cl: CL:0000617, note: iPSC-derived GABAergic neurons}
  iCell GlutaNeurons: {name: iCell GlutaNeurons, cl: CL:0000679, note: iPSC-derived glutamatergic neurons}
  IMR90 (neural crest cells differentiated from iPSC): {name: IMR90 iPSC-derived neural crest cell, cl: CL:0011012, note: "iPSC line not identified in Cellosaurus yet"}
