  SH-SY5Y: {name: SH-SY5Y, cellosaurus: CVCL_0019, organ: null}
  T47D: {name: T-47D, cellosaurus: CVCL_0553}
  TRb-UAS-bla-HEK293T: {name: TRb-UAS-bla HEK293T, parent: CVCL_0063, note: HEK293T engineered with a thyroid receptor beta GAL4-UAS beta-lactamase reporter}
  U-937: {name: U-937, cellosaurus: CVCL_0007}
  U2OS: {name: U2OS, cellosaurus: CVCL_0042}
  umbilical vein endothelium: {name: endothelial cell of umbilical vein, cl: CL:0002618}
  umbilical vein endothelium and peripheral blood mononuclear cells:
  - {name: endothelial cell of umbilical vein, cl: CL:0002618}
  - {name: peripheral blood mononuclear cell, cl: CL:2000001}
  venular endothelial cells and macrophages:
  - {name: endothelial cell of venule, cl: CL:1000414}
  - {name: macrophage, cl: CL:0000235}
  # Cellosaurus has no line named VM7 alone. VM7Luc4E2 (formerly BG1Luc4E2)
  # is the reporter line derived from it; not assumed to be the same cells.
  VM7: {name: VM7, note: "no Cellosaurus entry named VM7"}
  VM7Luc4E2: {name: VM7Luc4E2, cellosaurus: CVCL_6571}

# assayFunctionType of an endpoint -> what a measured target records.
#   measurement: the text written as the target's measurement.
#   mode_from_name: the type names a readout (a channel ratio), not what the
#     assay does, so the measurement is "agonist" or "antagonist" when the
#     assay name says which, and is left out otherwise.
#   targets: false means the endpoint's genes are not written as targets:
#     a background control or viability readout does not measure them.
function_type:
  agonist: {measurement: agonist}
  antagonist: {measurement: antagonist}
  background control: {targets: false}
  binding: {measurement: binding}
  cardiac function: {measurement: cardiac function}
  cellular respiration: {measurement: cellular respiration}
  chemical reporter: {measurement: chemical reporter}
  cytotoxicity: {targets: false}
  detection of steroid hormone: {measurement: steroid hormone production}
  developmental: {measurement: developmental}
  electrical activity: {measurement: electrical activity}
  enzymatic activity: {measurement: enzymatic activity}
  gene expression: {measurement: gene expression}
  inducer: {measurement: inducer}
  # The second channel of a Tox21 beta-lactamase assay, beside "substrate".
  product: {mode_from_name: true}
  ratio: {mode_from_name: true}
  relative metabolite change: {measurement: relative metabolite change}
  reporter gene: {measurement: reporter gene}
  signaling: {measurement: signaling}
  substrate: {mode_from_name: true}
  transporter: {measurement: transporter}
  viability: {targets: false}
