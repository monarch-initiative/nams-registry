# How scripts/write_toxcast.py turns EPA's ToxCast annotation values into
# registry values.
#
# Each table lists every value EPA uses in one field, as fetched by
# scripts/fetch_toxcast.py, and says what the registry does with it. The
# writer only applies this file: it never guesses. A value missing from a
# table is left out of the record and listed in the writer's report, and
# `write_toxcast.py --check` exits 1 while any value is missing, so a new EPA
# release cannot slip values in unreviewed. Add the value here, then rerun.
#
# Ontology ids are recorded here for review and later use; the records carry
# only the label, because the source-record fields they fill take text. Every
# id was read from its ontology in the step it was written, never from
# memory: UBERON and CL from OLS, cell lines from the Cellosaurus API
# (2026-11-17). A row with no id says why.
#
# EPA values are matched exactly, after collapsing whitespace.

# Text repairs, applied to every EPA string before anything else. EPA's text
# carries a UTF-8 non-breaking space that was decoded as Latin-1 somewhere
# upstream, leaving "Â" before it (e.g. "microplate:Â 96-wellÂ plate"), in
# assayDesc, detectionTechnology and the component descriptions.
text_repairs:
  "Â ": " "

# organismId corrections: an NCBI taxon id EPA gives that contradicts EPA's
# own organism name for the same assay. Applied before the species is looked
# up. Report each one to EPA as well.
organism_id:
  # Tanguay_ZF_120hpf (aid 907) is "zebrafish" with taxon 7956, which is the
  # goldfish genus Carassius; every other zebrafish assay uses 7955, Danio
  # rerio.
  7956: {taxon: 7955, organism: zebrafish}

# assayFormatType -> the registry's method_type, in the vocabulary NAMs.network
# records already use (in vitro, in chemico, ex vivo, in silico).
method_type:
  cell-based: in vitro
  # A purified protein, membrane preparation or enzyme with no living cell.
  biochemical: in chemico
  cell-free: in chemico
  # Whole zebrafish embryos.
  organism: in vivo

# cellFormat -> whether cellShortName names the test system. In a cell-free
# assay EPA often still names a cell line (CHO, HEK293, Sf9): the cells only
# produced the protein, so they are not written as the NAM's cells.
cell_format:
  cell line: test_system
  cell-based: test_system
  primary cell: test_system
  primary cell co-culture: test_system
  secondary cell: test_system
  whole embryo: test_system
  cell-free: protein_source
  tissue-based cell-free: protein_source

# tissue -> the registry's organs. EPA's tissue field mixes organs, adjectives,
# cell types and non-tissues; only organs and tissues are written. organ: null
# means the value is not an organ, with the reason.
