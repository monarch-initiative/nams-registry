  - {name: foreskin fibroblast, cl: CL:1001608}
  Lenti-TPO (Lenti-X 293T with TPO overexpression transgene): {name: Lenti-X 293T expressing TPO, parent: CVCL_4401, note: Cellosaurus lists Lenti-X 293T as a synonym of BOSC-23}
  LUHMES: {name: LUHMES, cellosaurus: CVCL_B056}
  # EPA's tissue for BioSeek's lung fibroblast panel is "vascular".
  lung fibroblasts: {name: fibroblast of lung, cl: CL:0002553, organ: Lung}
  MCF7: {name: MCF-7, cellosaurus: CVCL_0031}
  MDA-kb2: {name: MDA-kb2, cellosaurus: CVCL_6421}
  ME-180: {name: ME-180, cellosaurus: CVCL_1401}
  NIH/3T3: {name: NIH 3T3, cellosaurus: CVCL_0594}
  PGC/ERR HEK293T: {name: PGC/ERR HEK293T, parent: CVCL_0063, note: HEK293T engineered with PGC and ERR reporters}
  PR-UAS-bla-HEK293T: {name: PR-UAS-bla HEK293T, parent: CVCL_0063, note: HEK293T engineered with a progesterone receptor GAL4-UAS beta-lactamase reporter}
  RUES2-GLR: {name: RUES2-GLR, parent: CVCL_B810, note: RUES2 embryonic stem cells with a reporter}
  RXRa-UAS-bla HEK 293T: {name: RXRa-UAS-bla HEK293T, parent: CVCL_0063, note: HEK293T engineered with an RXR-alpha GAL4-UAS beta-lactamase reporter}
  SBAD2 (peripheral neurons differentiated from iPSC): {name: SBAD2 iPSC-derived peripheral neuron, cl: CL:2000032, note: "iPSC line not identified in Cellosaurus yet"}
  Sf21: {name: Sf21, cellosaurus: CVCL_0518}
  Sf9: {name: Sf9, cellosaurus: CVCL_0549}
  # A neuroblastoma line; EPA's "bone" is where the parent tumour was sampled
