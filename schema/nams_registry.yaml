classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/monarch-initiative/nams-registry/NamedThing
    description: A generic grouping for any identifiable entity
    from_schema: https://w3id.org/monarch-initiative/nams-registry
    exact_mappings:
    - schema:Thing
    slots:
    - id
    - name
    - description
    class_uri: schema:Thing
  Resource:
    name: Resource
    definition_uri: https://w3id.org/monarch-initiative/nams-registry/Resource
    description: A source of NAMs or NAMs-adjacent information. This includes data
      resources, such as databases, repositories, catalogs, and portals, and reports,
      such as landscape analyses, reviews, and OECD Test Guidelines.
    from_schema: https://w3id.org/monarch-initiative/nams-registry
    is_a: NamedThing
    slots:
    - id
    - name
    - description
    - synonyms
    - homepage_url
    - repository
    - resource_type
    - domain_areas
    - nams_relevance
    - relevance_note
    - curation_model
    - dismech_integration
    - activity_status
    - use_instead
    - license
    - publications
    - creation_date
    - last_modified_date
    - imported_from
    class_uri: nams_registry:Resource
  LicenseInfo:
    name: LicenseInfo
    definition_uri: https://w3id.org/monarch-initiative/nams-registry/LicenseInfo
    description: A license for a resource.
    from_schema: https://w3id.org/monarch-initiative/nams-registry
    slots:
    - licenseInfo__id
    - licenseInfo__label
    attributes:
      id:
        name: id
        description: A URL to the license text, e.g. https://creativecommons.org/licenses/by/4.0/.
          Leave it out when there is none, as for a US government work.
        range: uri
      label:
        name: label
        description: The name of the license.
        required: true
    class_uri: nams_registry:LicenseInfo
  Publication:
    name: Publication
    definition_uri: https://w3id.org/monarch-initiative/nams-registry/Publication
    description: A publication. The same structure as a KG-Registry Publication.
    from_schema: https://w3id.org/monarch-initiative/nams-registry
    slots:
    - publication__id
    - publication__title
    - publication__authors
    - publication__journal
    - publication__year
    - publication__doi
    - publication__preferred
    attributes:
      id:
        name: id
        description: A CURIE for the publication, such as a DOI with its prefix (doi:10.1038/s41597-021-00962-3)
          or a PMID.
        identifier: true
        range: uriorcurie
        required: true
      title:
        name: title
        description: The title of the publication.
      authors:
        name: authors
        description: The authors, e.g. Mortensen HM.
        multivalued: true
      journal:
        name: journal
        description: The journal the publication appeared in.
      year:
        name: year
        description: The year of publication, e.g. '2021'.
        pattern: ^\d{4}$
      doi:
        name: doi
        description: The DOI, without a prefix.
      preferred:
        name: preferred
        description: Whether this is the publication to cite for the resource.
        range: boolean
    class_uri: nams_registry:Publication
  ImportRecord:
    name: ImportRecord
    definition_uri: https://w3id.org/monarch-initiative/nams-registry/ImportRecord
    description: A record of content imported into this registry entry from another
      registry.
    from_schema: https://w3id.org/monarch-initiative/nams-registry
    slots:
    - source
    - source_id
    - source_url
    - source_version
    - imported_on
    class_uri: nams_registry:ImportRecord
