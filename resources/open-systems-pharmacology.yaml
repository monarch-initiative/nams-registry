id: open-systems-pharmacology
name: Open Systems Pharmacology (OSP)
description: Open Systems Pharmacology (OSP) is an open-source, community-governed
  platform for physiologically based pharmacokinetic (PBPK) and quantitative systems
  pharmacology (QSP) modeling. Its OSP Suite comprises PK-Sim, for whole-body PBPK
  modeling, and MoBi, for multiscale physiological modeling and model extension, along
  with the ospsuite R package and reporting tools. The project also maintains the
  OSP PBPK Model Library, a set of released PBPK models for individual compounds,
  including small-molecule drugs and antibodies, each with an evaluation report and
  a PK-Sim project file, and qualification documents for the suite. The OSP management
  team includes members from pharmaceutical companies and academic and service organizations.
