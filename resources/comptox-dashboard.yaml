holds_nams: secondary
relevance_note: >-
  Organized around chemicals, not methods: each chemical page is a set of
  sections drawing on other EPA resources, and several hold NAM results.
  These are ToxCast and Tox21 bioactivity (invitrodb v4.3 since Dashboard
  2.9.0, 2026-10-15), ToxCast-based models, high-throughput transcriptomics
  (HTTr, snapshot Jan-22) and phenotypic profiling (HTPP, U-2 OS cells,
  snapshot Jul-22), httk toxicokinetics and IVIVE, GenRA read-across, and
  OPERA property predictions. The rest is chemistry, conventional hazard
  (ToxValDB, cancer, genotoxicity, skin and eye, GHS), exposure and use data,
  and literature links. Nothing is labelled a NAM. Its assay-endpoint pages
  show the invitrodb annotation fields that toxcast covers; HTTr, HTPP and
  GenRA have no registry entries of their own.
curation_model:
- maintainers
- aggregated
dismech_integration: >-
  Through its API only. DisMech's ToxCast tooling (the epa-ctx-api skill and
  src/dismech/toxcast_assays.py) calls the CTX APIs, which EPA publishes as
  the CompTox Chemicals Dashboard APIs; see toxcast. Nothing in kb/ cites the
  Dashboard or a DTXSID, and nothing touches HTTr, HTPP or GenRA. Checked
  against dismech commit 05ed74fe230.
