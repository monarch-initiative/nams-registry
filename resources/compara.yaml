id: compara
name: CoMPARA (Collaborative Modeling Project for Androgen Receptor Activity)
description: CoMPARA (Collaborative Modeling Project for Androgen Receptor Activity) is a
  set of consensus models that predict androgen receptor (AR) binding, agonist and antagonist
  activity. The U.S. EPA led it in support of the Endocrine Disruptor Screening Program, following
  CERAPP. Its chemical list extended CERAPP's with further chemicals of interest and simulated
  ToxCast metabolites, to 55,450 structures. Twenty-five international groups contributed
  91 models, built on a common training set of 1,746 chemicals compiled from 11 ToxCast and
  Tox21 high-throughput in vitro assays and evaluated against curated literature data. The
  consensus models averaged about 80% predictive accuracy on the evaluation set. They are
  implemented in OPERA, which was used to screen about 875,000 chemicals in DSSTox, and those
  predictions are available on the CompTox Chemicals Dashboard and NICE. EPA's figshare holds
  the project's training, prediction and evaluation sets and its individual and consensus
  models.
