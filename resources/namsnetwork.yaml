id: namsnetwork
name: NAMs Network
description: NAMs.network is the first database of regulatory-relevant New Approach
  Methodologies (NAMs) for assessing the safety of materials and chemicals. Given
  the ethical, economic, and time-related challenges associated with animal testing,
  as well as emerging bans on such methods in the EU, it is paramount to develop and
  validate alternative in silico, in chemico, in vitro, and ex vivo approaches. NAMs.network
  provides state-of-the-art knowledge on different NAMs for materials and chemical
  safety assessment.
homepage_url: https://nams.network/
resource_type: KnowledgeGraph
domain_areas:
- toxicology
- chemistry and biochemistry
holds_nams: primary
relevance_note: >-
  NAMs are its records. Its catalogue has 542 records, but lists some NAMs
  more than once, once per endpoint, so it holds 452 NAMs: 298 in vitro, 126
  in silico, 17 in chemico, 8 ex vivo and 3 in vitro/in silico. Each record
  gives a type, a toxicity endpoint, an organ, cell types and a development
  status: 253 NAMs are under development, 121 under validation and 78
  accepted for regulatory use. It also gives a guideline or strategy, and
  the EU regulations the NAM applies to. Filters link NAMs to substances,
  methods and biomarkers, and AOP-Wiki AOPs and Key Events. The catalogue is
  aimed at chemical and nanomaterial safety assessment: the most common
  endpoint is acute inhalation toxicity, and the most common organ is the
  lung (205 NAMs). The list and its filters are public through a JSON API at
  https://api.nams.network, which scripts/fetch_namsnetwork.py reads, and
  scripts/write_partial_namsnetwork.py turns into a partial record per NAM
  in partial-nams/namsnetwork/. A NAM's full record needs a free, logged-in account.
  It adds a description, publications, cell types with species, measures,
  limitations and, for in silico NAMs, the model's algorithm and training
  data, but the site states no terms for reusing it.
curation_model:
- maintainers
dismech_integration: >-
  None. DisMech has no tooling for it, and no DisMech content mentions it.
  Checked against dismech commit 1019485f6e8.
supporting_scripts:
- name: fetch_namsnetwork.py
  repository: https://github.com/monarch-initiative/nams-registry
  path: scripts/fetch_namsnetwork.py
  command: uv run python scripts/fetch_namsnetwork.py
  description: >-
    Fetches the public NAM list and filter facets from the NAMs.network API,
    and rebuilds the links from NAMs to substances, methods and biomarkers,
    and AOP-Wiki AOPs and Key Events.
- name: write_partial_namsnetwork.py
  repository: https://github.com/monarch-initiative/nams-registry
  path: scripts/write_partial_namsnetwork.py
  command: uv run python scripts/write_partial_namsnetwork.py
  description: >-
    Writes a partial record for each NAM in the catalogue fetched by
    fetch_namsnetwork.py into partial-nams/namsnetwork/, merging the records
    the catalogue lists more than once, and skipping NAMs that already have
    a full record in nams/.
priority: high
priority_rationale: >-
  It is one of the few resources that hold NAMs as structured records, each
  with a type, an endpoint, an organ and a development status, and its list
  is public through an API. Its links to AOP-Wiki AOPs and Key Events connect
  it to the AOP-Wiki methods work (#5): in the 2026-11-09 fetch, 14 NAMs link
  to an AOP and 67 to a Key Event. Its scope is narrower than DisMech's. It
  covers toxicity endpoints for chemical and nanomaterial regulation, not
  disease, so its value to DisMech is mainly in the methods it describes.
extraction_effort: low
effort_rationale: >-
  The NAMs are structured records accessible through a public API, making
  extraction straightforward. Scripts like scripts/fetch_namsnetwork.py can
  automate the retrieval of the data.
expectations: >-
  I expect to find detailed information on various NAMs, including their type,
  toxicity endpoint, organ, cell types, development status, guidelines or
  strategies, and relevant EU regulations. The data should be well-structured
  and easily retrievable via the API.
