id: httk
name: httk (High-Throughput Toxicokinetics)
description: High-Throughput Toxicokinetics (httk) is a US EPA R package that provides
  free, open-source data and models for toxicokinetics (TK). It pairs chemical-specific
  in vitro measurements and in silico predictions, available for thousands of chemicals,
  multiple exposure routes, and several species, with generic physiologically based
  (PBTK) and empirical TK models. The package supports traditional dosimetry and in
  vitro to in vivo extrapolation (IVIVE), including reverse dosimetry that converts
  high-throughput screening concentrations (e.g., from ToxCast and Tox21) into equivalent
  real-world exposures.
