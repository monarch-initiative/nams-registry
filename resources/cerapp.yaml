id: cerapp
name: CERAPP (Collaborative Estrogen Receptor Activity Prediction Project)
description: CERAPP (Collaborative Estrogen Receptor Activity Prediction Project) is a set
  of consensus models that predict estrogen receptor (ER) binding, agonist and antagonist
  activity. The U.S. EPA led it in support of the Endocrine Disruptor Screening Program. Seventeen
  groups in the United States and Europe built 40 categorical and 8 continuous QSAR and docking
  models, mostly on a common training set of 1,677 chemical structures provided by the EPA,
  and the models were evaluated on 7,522 chemicals curated from the literature. The models
  were weighted by their accuracy into consensus predictions for a common set of 32,464 chemicals.
  The consensus models are implemented in OPERA, and the predictions are available through
  NICE. EPA's figshare holds the project's training, evaluation and prediction sets and the
  individual models.
