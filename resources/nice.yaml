id: nice
name: NICE (NIH Integrated Chemical Environment)
description: NICE, the NIH Integrated Chemical Environment (formerly the Integrated
  Chemical Environment, ICE), is a public web resource developed by the NTP Interagency
  Center for the Evaluation of Alternative Toxicological Methods (NICEATM), part of
  the National Toxicology Program (NTP) at the National Institute of Environmental
  Health Sciences (NIEHS). It brings together curated chemical characterization and
  physicochemical data, curated in vitro and high-throughput screening (cHTS) assay
  data, and reference in vivo toxicity datasets, together with computational tools
  and workflows (including in vitro to in vivo extrapolation, a dose-response Curve
  Surfer, and physiologically based pharmacokinetic modeling). NICE integrates data
  from established sources, including ToxCast and Tox21 high-throughput screening
  data, chemical identity and property data from the EPA CompTox Chemicals Dashboard
  and DSSTox, and OPERA-predicted physicochemical and ADME properties. It is designed
  to help scientists develop, evaluate, and apply new approach methodologies (NAMs)
  for chemical hazard characterization and next generation risk assessment.
synonyms:
- ICE
- Integrated Chemical Environment
- NIH Integrated Chemical Environment
homepage_url: https://ice.ntp.niehs.nih.gov/
resource_type: Aggregator
domain_areas:
- chemistry and biochemistry
- toxicology
- cheminformatics
- biomedical
- environment
- environmental exposure
holds_nams: primary
relevance_note: >-
  NICE exists to develop and evaluate NAMs, and NAM records make up most of
  its 19 data sets. These include in vitro and in chemico results for skin
  sensitization, skin irritation and corrosion, eye irritation, endocrine
  activity and genotoxicity; ToxCast and Tox21 high-throughput screening
  data; and in silico predictions from OPERA, CATMoS, CERAPP, CoMPARA, the
  AR and ER pathway models, and SEEM3. In vivo and human reference data,
  such as the LLNA, Draize, rat acute toxicity, cancer bioassay and DART
  guideline studies, are held alongside them so the NAMs can be evaluated
  against them.
curation_model:
- maintainers
- aggregated
dismech_integration: >-
  No NICE content has been extracted into DisMech, and DisMech has no tooling
  for it. The Contact Dermatitis entry records the SARA-ICE model, which was
  trained on data drawn from NICE. Checked against dismech commit
  ecaad77e5e9.
supporting_scripts:
- name: fetch_nice.py
  repository: https://github.com/monarch-initiative/nams-registry
  path: scripts/fetch_nice.py
  command: uv run scripts/fetch_nice.py
  description: >-
    Renders the NICE Data Sets page in headless Chrome and parses its table
    into one record per data set, lists the assay names the REST API accepts,
    downloads the data set files under a size limit, and tallies the assay,
    species, reference and data type columns of each spreadsheet.
priority: medium
priority_rationale: >-
  NICE adds nine reference data sets that NICEATM curates, which pair NAM
  results with in vivo or human reference data, and its own curation and
  annotation of the ToxCast and Tox21 data. Most of its content by volume is
  copied unchanged from resources that have their own entries, such as OPERA
  and httk.
expectations: >-
  The content found only in NICE is the reference data NICEATM curates:
  sensitization, skin irritation and corrosion, eye irritation, endocrine,
  acute oral, dermal and inhalation toxicity, cancer, and DART. Each pairs
  NAM results, where there are any, with in vivo or human reference data.
  NICE also adds its own curation to the ToxCast and Tox21 data (hit-call
  flags, and annotations of each assay's mechanistic target and mode of
  action mapped to OBO ontologies), and shows CATMoS, CERAPP and CoMPARA
  predictions. Its OPERA predictions and measured httk ADME values are copied
  unchanged, so get those from the opera and httk entries. The data sets are
  listed at https://ice.ntp.niehs.nih.gov/DATASETDESCRIPTION, where most can
  be downloaded as spreadsheets. All but the chemical use and taxonomy data
  sets can be queried through the REST API at
  https://ice.ntp.niehs.nih.gov/api/v1/search.
