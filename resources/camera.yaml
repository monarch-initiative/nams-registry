id: camera
name: CAMERA (Collection of Alternative Methods for Regulatory Application)
description: CAMERA (Collection of Alternative Methods for Regulatory Application)
  is a public, interactive NIH database and web interface that consolidates validated
  and qualified New Approach Methods (NAMs) for chemical safety testing into a single
  resource. It brings together validation study reports, data, protocols and SOPs,
  and regulatory guidance that were previously scattered across multiple agencies
  and organizations, and lets users filter by alternative method type, defined approach,
  test method endpoint, and regulatory guidance. CAMERA additionally uses standardized
  ontology vocabulary and large language models to identify validated NAMs that can
  measure the key events (KEs) of OECD-endorsed adverse outcome pathways (AOPs), linking
  methods to AOP-Wiki content to support next generation risk assessment. It currently
  holds 67 validated NAMs. CAMERA is supported by NICEATM and operates under the direction
  and oversight of the Interagency Coordinating Committee on the Validation of Alternative
  Methods (ICCVAM).
