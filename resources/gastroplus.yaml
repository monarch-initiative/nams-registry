id: gastroplus
name: GastroPlus
description: >-
  GastroPlus is commercial simulation software for physiologically based
  pharmacokinetic and physiologically based kinetic modelling, sold by
  Simulations Plus. It carries modules for several routes of administration,
  including oral, dermal and intravenous, and predicts the internal
  concentration a given exposure produces. In next-generation risk assessment
  it supplies the exposure half of a bioactivity:exposure ratio: a model is
  built per chemical and exposure scenario, parameterized on properties such as
  logP, water solubility, unbound fraction in plasma, blood:plasma ratio,
  hepatic intrinsic clearance, permeability and pKa, and tiered by whether
  those parameters are predicted, measured in vitro, or calibrated against
  clinical data. Version 9.8 was used for the 70 consumer exposure scenarios in
  the NAM toolbox evaluation of Cable et al. 2025.
homepage_url: https://www.simulations-plus.com/software/gastroplus/
resource_type: DataSource
domain_areas:
