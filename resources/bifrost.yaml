- toxicology
- gene expression profiling
activity_status: unknown
relevance_note: >-
  The second of the two concentration-response analyses behind the registry's
  high-throughput transcriptomics record, and the analysis behind the cell
  stress panel's global point of departure. No homepage or repository is
  recorded because the method paper names none; an implementation exists, and
  the registry should record it once its identity and licence have been read
  from a primary source rather than inferred.
