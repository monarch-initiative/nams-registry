id: bifrost
name: BIFROST
description: >-
  BIFROST is a Bayesian method for inferring a point of departure from
  transcriptomic concentration-response data. Rather than fitting each gene
  separately and then choosing among the results, it infers gene-level effect
  concentrations under a hierarchical model and derives a single global point
  of departure, the minimum effect concentration across all genes, with its
  uncertainty. In the NAM toolbox evaluation of Cable et al. 2025 it was run
  alongside BMDExpress on the same high-throughput transcriptomic data, and a
  version of it was also used to derive a global point of departure from the
  cell stress panel.
resource_type: DataSource
domain_areas:
