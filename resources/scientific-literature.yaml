id: scientific-literature
name: Scientific literature
description: The published scientific literature as a whole, taken as one source
  of NAMs. A NAM found in a research paper names this resource in its
  source_resources, with the paper's DOI link in source_urls, and cites the paper
  in its model's references. A single paper is not a resource of its own.
resource_type: Literature
priority: high
priority_rationale: Databases and catalogues mostly hold NAMs that are already on
  the way to approval and validation for industry use. Research papers describe NAMs
  that are not in them, such as methods still in development or used in a single
  study.
extraction_effort: not_applicable
effort_rationale: The effort depends on each paper, e.g. whether its full text is
  open and how fully it describes the method, so no single estimate fits.
expectations: NAMs that databases and catalogues do not hold yet, described in
  the research papers that develop or use them.
creation_date: '2026-11-12'
last_modified_date: '2026-11-12'
