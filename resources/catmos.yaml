id: catmos
name: CATMoS (Collaborative Acute Toxicity Modeling Suite)
description: 'CATMoS (Collaborative Acute Toxicity Modeling Suite) is a set of consensus QSAR
  models that predict rat acute oral systemic toxicity without animal testing. It came from
  an international project organized by the ICCVAM Acute Toxicity Workgroup with NICEATM and
  the U.S. EPA: 35 research groups submitted 139 models, built and evaluated on an acute oral
  toxicity inventory of 11,992 chemicals, and the models were combined into consensus models.
  CATMoS predicts five end points used in regulatory hazard classification: the LD50 value,
  the four U.S. EPA hazard categories, the five GHS hazard categories, very toxic chemicals
  (LD50 of 50 mg/kg or less) and nontoxic chemicals (LD50 above 2,000 mg/kg). The consensus
  models are implemented in OPERA, which can make predictions for new chemicals, and predictions
  for more than 800,000 chemicals are available through NICE. The project page provides the
  training, validation and prediction-set chemical files.'
