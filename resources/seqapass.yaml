id: seqapass
name: SeqAPASS (Sequence Alignment to Predict Across Species Susceptibility)
description: Sequence Alignment to Predict Across Species Susceptibility (SeqAPASS)
  is an online US EPA screening tool for extrapolating chemical toxicity information
  from data-rich model organisms (e.g., human, mouse, rat, zebrafish) to thousands
  of non-target species. Many chemicals act through known protein targets. Using protein
  sequence and structure data from the NCBI protein database, SeqAPASS compares amino
  acid sequence and protein structure similarity across species to predict whether
  those targets are present, and so whether the species are likely to be susceptible.
  Version 8 can also generate protein structures across species and report metrics
  on their quality.
