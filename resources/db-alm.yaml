id: db-alm
name: DB-ALM (EURL ECVAM DataBase service on ALternative Methods to animal experimentation)
description: The EURL ECVAM DataBase service on ALternative Methods to animal experimentation
  (DB-ALM) is a collection of method summaries and standardised protocols for alternative
  methods in toxicology and biomedical science, maintained by the EU Reference Laboratory
  for Alternatives to Animal Testing (EURL ECVAM) at the European Commission Joint
  Research Centre (JRC). It covers methods submitted to EURL ECVAM for validation
  and methods identified through literature reviews and end users. The former interactive
  online database has been replaced by a versioned open dataset published through
  the JRC Data Catalogue, with a browsable static index of documents and a complete
  downloadable archive.
