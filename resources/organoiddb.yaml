id: organoiddb
name: OrganoidDB
description: OrganoidDB is a database of curated bulk and single-cell transcriptome
  profiles of organoids. It holds 16,218 organoid samples (12,911 human and 3,307
  mouse) collected from GEO and ArrayExpress and organized into 1,069 datasets, 145
  of them single-cell RNA-seq. Primary tissue and cell line samples are included so
  that organoids can be compared against them, with GTEx and the Human Protein Atlas
  linked as references. The web interface supports gene expression search across organoid
  types, culture sources and protocols, sample types and developmental stages, plus
  correlation analysis, and datasets can be browsed with culture details, differentially
  expressed genes, enriched pathways and single-cell clusters. It is run by the Intelligent
  Bioinformatics Research Group at the Institute of Life Sciences, Chongqing Medical
  University.
