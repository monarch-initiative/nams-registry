id: bmdexpress
name: BMDExpress
description: >-
  BMDExpress is free, open-source software for benchmark-dose analysis of
  transcriptomic concentration-response data. It fits dose-response models to
  each probe, returns a benchmark dose with upper and lower confidence bounds
  (BMD, BMDU, BMDL) at a chosen benchmark response, and aggregates probe-level
  results by pathway, so that a mean pathway BMDL can stand as a point of
  departure. BMDExpress 2 rebuilt the original tool with a new interface,
  curve-fitting engine and batch workflow; development has since continued as
  BMDExpress 3. In the NAM toolbox evaluation of Cable et al. 2025 it was run
  at a 10% benchmark response with Reactome pathway enrichment, as one of two
  independent analyses of the same high-throughput transcriptomic data.
synonyms:
- BMDExpress 2
- BMDExpress2
- BMDExpress 3
homepage_url: https://www.sciome.com/bmdexpress/
