activity_status: active
relevance_note: >-
  One of the two concentration-response analyses behind the registry's
  high-throughput transcriptomics record
  (high-throughput-transcriptomics-temposeq). The other is BIFROST, and the two
  are treated as separate lines of evidence rather than alternatives.
