[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "nams_registry"
description = "This is a repository of NAM and NAM-adjacent sources collected in support of a NAMs landscape analysis."
authors = [
  {name = "Ginnie Hench", email = "vhench@unc.edu"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "linkml-term-validator>=0.4.5",
    "linkml-reference-validator>=0.5.1",
    "oaklib>=0.7.4",
]
lint = [
    "pre-commit>=4.6.2",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.nams-registry.namo]
# The NAMO branch, tag or commit downloaded when there is no local NAMO
# checkout (see scripts/link_namo.py). The NAMO_REF environment variable
# overrides it.
# NAMO main at fe36451. It includes namo#29, which binds NAMO's ontology enums
# with reachable_from; before #29, no enum could be checked against its
# ontology.
ref = "fe36451fb0af235b94aae0ba4a7d5b74135c7747"

[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
# The datamodel files are generated by `just gen-python`, which `just test` runs,
# so any fix ruff made to them would be undone.
exclude = [
    "src/nams_registry/_version.py",
    "src/nams_registry/datamodel/nams_registry.py",
    "src/nams_registry/datamodel/nams_registry_pydantic.py",
]
# Apply the excludes to files pre-commit passes by name, too.
force-exclude = true
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/nams_registry/datamodel/nams_registry_pydantic.py",
  "src/nams_registry/datamodel/nams_registry.py",
  "references_cache/*",
]

# Domain words codespell would otherwise flag, one per line.
ignore-words = ".codespell-ignore-words.txt"
quiet-level = 3
