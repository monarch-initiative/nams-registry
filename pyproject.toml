[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "nams_registry"
description = "This is a repository of NAM and NAM-adjacent sources collected in support of a NAMs landscape analysis."
authors = [
  {name = "Ginnie Hench", email = "vhench@unc.edu"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "linkml-term-validator>=0.4.5",
    "linkml-reference-validator>=0.5.1",
    "oaklib>=0.7.4",
]
lint = [
    "pre-commit>=4.6.2",
]
# The code `just check-snippets` and `just deep-research` import. It is a
# group rather than a project dependency for two reasons: it is needed only by
# those recipes, so `uv sync` does not install it by default; and a git
# requirement in `project.dependencies` would need
# `tool.hatch.metadata.allow-direct-references`, which bars the package from
# PyPI. A group is not package metadata, so neither applies.
#
# DisMech is pinned to a commit here and resolved in uv.lock. Bump it with
# `uv lock --upgrade-package dismech` after editing the rev. DisMech requires
# Python >=3.12, which is this project's floor; it adds 18 packages to the
# lockfile (matplotlib, seaborn, koza, duckdb and their dependencies).
#
# DisMech main at e23ed98 (2026-11-18). Its reference_snippet_audit takes the
# schema, the validator config and the cache directory as arguments, so it
# audits this repository's records and references_cache/ unchanged. Its
# deep_research_policy gates Biomni behind DISMECH_ENABLE_BIOMNI.
#
# deep-research-client is the same third-party client DisMech uses; DisMech
# does not implement one, so it is required here rather than inherited.
research = [
    "dismech @ git+https://github.com/monarch-initiative/dismech@e23ed9889fe8e2e621879db5830e660d98f3c28f",
    "deep-research-client[terms,validation]>=0.2.14",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.nams-registry.namo]
# The NAMO branch, tag or commit downloaded when there is no local NAMO
# checkout (see scripts/link_namo.py). The NAMO_REF environment variable
# overrides it.
# NAMO main at 0b7ea2c. It includes namo#29, which binds NAMO's ontology enums
# with reachable_from; before #29, no enum could be checked against its
# ontology. It also includes namo#46, which gives PBPKCompartmentEnum its
# UTERUS and REST_OF_BODY values, and namo#47, which moves
# differentiation_method up to CellularSystem so a 2D culture can carry one;
# the records in nams/ use all three. It also includes namo#48, which adds the
# MolecularModel class for structure-based in silico models (homology
# modelling, docking, molecular dynamics), used by the aromatase/ZEN record.
# It also includes namo#54 (for namo#52), which lets a model system record say
# whether it describes a method or one study's use of it (description_scope,
# method, studies), so the registry needs no convention of its own for that.
ref = "0b7ea2c698d422ad9080ba4f37d418b9e2cf4f42"

[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
# The datamodel files are generated by `just gen-python`, which `just test` runs,
# so any fix ruff made to them would be undone.
exclude = [
    "src/nams_registry/_version.py",
    "src/nams_registry/datamodel/nam_resources.py",
    "src/nams_registry/datamodel/nam_resources_pydantic.py",
]
# Apply the excludes to files pre-commit passes by name, too.
force-exclude = true
# Set oldest supported Python version
target-version = "py312"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/nams_registry/datamodel/nam_resources_pydantic.py",
  "src/nams_registry/datamodel/nam_resources.py",
  "references_cache/*",
  # EPA's CTX annotations, verbatim: OT is an assay source, and EPA's own
  # misspellings stay as EPA wrote them.
  "tests/data/toxcast/*",
]

# Domain words codespell would otherwise flag, one per line.
ignore-words = ".codespell-ignore-words.txt"
quiet-level = 3
